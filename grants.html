<!DOCTYPE html>
<html lang="en">
<head>

<title>Horizon — Finger Lakes + Western NY grant finder</title>

<style>
:root{
  --bedrock:#12100C; --loam:#1A1712; --strata:#252017; --seam:#3A3226;
  --bone:#EFE9DC; --dust:#9C9484;
  --amber:#E9B84C; --aurora:#5FD6C0; --moss:#A9C948; --iris:#A98BE0;
  --ember:#E56A6A; --volt:#5CF7A0; --copper:#D9814E; --r:4px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:#12100C;color-scheme:dark}
html,body{margin:0;padding:0}
body{background:var(--bedrock);
  background-image:radial-gradient(1200px 500px at 80% -10%,rgba(95,214,192,.07),transparent 60%),
    radial-gradient(900px 420px at 5% 5%,rgba(233,184,76,.06),transparent 60%),
    repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 46px);
  color:var(--bone);font-family:"Public Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif;letter-spacing:-.02em;margin:0;color:var(--bone)}
input,textarea,button,select{color-scheme:dark;font:inherit}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.horizon{display:flex;height:5px;width:100%}
.horizon i{flex:1;display:block}
.horizon i:nth-child(1){background:var(--amber)}.horizon i:nth-child(2){background:var(--aurora)}
.horizon i:nth-child(3){background:var(--moss)}.horizon i:nth-child(4){background:var(--iris)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}
.mast{padding:24px 0 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--seam)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:27px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--volt);text-shadow:0 0 22px rgba(92,247,160,.45)}
.brand span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--aurora)}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);
  border:1px solid rgba(233,184,76,.4);padding:5px 9px;border-radius:99px;background:rgba(233,184,76,.06)}
nav.tabs{display:flex;flex-wrap:wrap;margin:20px 0 28px;border:1px solid var(--seam);border-radius:var(--r);overflow:hidden;background:var(--loam)}
nav.tabs button{flex:1 1 auto;min-width:132px;background:transparent;border:0;border-right:1px solid var(--seam);padding:12px 13px;
  cursor:pointer;text-align:left;font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;color:var(--dust)}
nav.tabs button:last-child{border-right:0}
nav.tabs button b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:9.5px;letter-spacing:.16em;color:var(--seam);margin-bottom:4px}
nav.tabs button:hover{color:var(--bone);background:rgba(255,255,255,.03)}
nav.tabs button[aria-selected=true]{background:var(--strata);color:var(--bone);box-shadow:inset 0 -2px 0 var(--aurora)}
nav.tabs button[aria-selected=true] b{color:var(--aurora)}
nav.tabs button:focus-visible{outline:2px solid var(--aurora);outline-offset:-3px}
nav.tabs .badge{display:inline-block;background:var(--volt);color:var(--bedrock);border-radius:99px;padding:0 6px;font-size:10px;font-weight:700;margin-left:6px}
.screen{display:none;animation:rise .3s ease}.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.screen-head{margin-bottom:22px}
.screen-head h2{font-size:31px;font-weight:800;line-height:1.05;color:var(--volt);text-shadow:0 0 26px rgba(92,247,160,.3)}
.screen-head p{margin:8px 0 0;color:var(--dust);max-width:64ch;font-size:14.5px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--aurora);display:block;margin-bottom:8px}
.card{background:var(--loam);border:1px solid var(--seam);border-radius:var(--r)}
.pad{padding:17px 19px}
.grid2{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:13px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
label.f{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);margin:0 0 8px}
hr.hair{border:0;border-top:1px solid var(--seam);margin:15px 0}
.groupname{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:13px 0 7px;display:flex;align-items:center;gap:7px}
.groupname i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip{display:inline-flex;align-items:center;border:1px solid var(--seam);background:transparent;color:var(--dust);
  padding:4px 10px;border-radius:99px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--bone);border-color:var(--dust)}
.chip[aria-pressed=true]{background:rgba(95,214,192,.14);border-color:var(--aurora);color:var(--aurora)}
.chip[aria-pressed=true][data-fam=energy_climate]{background:rgba(233,184,76,.14);border-color:var(--amber);color:var(--amber)}
.chip[aria-pressed=true][data-fam=water]{background:rgba(95,214,192,.14);border-color:var(--aurora);color:var(--aurora)}
.chip[aria-pressed=true][data-fam=land]{background:rgba(169,201,72,.14);border-color:var(--moss);color:var(--moss)}
.chip[aria-pressed=true][data-fam=waste_circular]{background:rgba(217,129,78,.16);border-color:var(--copper);color:var(--copper)}
.chip[aria-pressed=true][data-fam=community_operational]{background:rgba(169,139,224,.16);border-color:var(--iris);color:var(--iris)}
.chip[aria-pressed=true][data-fam=other]{background:rgba(156,148,132,.18);border-color:var(--dust);color:var(--bone)}
.chk{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px;cursor:pointer;color:var(--dust);background:none;border:0;width:100%;text-align:left}
.chk i{width:15px;height:15px;border:1.5px solid var(--seam);border-radius:2px;flex:0 0 auto}
.chk[aria-pressed=true]{color:var(--bone)}
.chk[aria-pressed=true] i{background:var(--aurora);border-color:var(--aurora);position:relative}
.chk[aria-pressed=true] i::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--bedrock);border-width:0 2px 2px 0;transform:rotate(42deg)}
.chk small{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dust)}
.btn{font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;border-radius:var(--r);padding:10px 16px;cursor:pointer;
  border:1px solid var(--aurora);background:var(--aurora);color:var(--bedrock)}
.btn.ghost{background:transparent;color:var(--bone);border-color:var(--seam)}
.btn.ghost:hover{border-color:var(--dust)}
.btn:focus-visible,.chip:focus-visible,.chk:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.field{width:100%;border:1px solid var(--seam);border-radius:var(--r);padding:10px 12px;background:var(--bedrock);color:var(--bone)}
textarea.field{min-height:92px;resize:vertical}
.sub{font-size:12.5px;color:var(--dust);margin-top:6px}
.match{display:flex;align-items:center;gap:9px}
.match .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;color:var(--aurora)}
.meter{width:76px;height:5px;background:var(--seam);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--aurora);box-shadow:0 0 10px rgba(95,214,192,.6)}
.match.mid .num{color:var(--amber)}.match.mid .meter i{background:var(--amber);box-shadow:0 0 10px rgba(233,184,76,.5)}
.match.low .num{color:var(--dust)}.match.low .meter i{background:var(--dust);box-shadow:none}
.res{display:block;width:100%;border-bottom:1px solid var(--seam);padding:17px 19px;transition:background .15s}
.restitle{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;min-width:0;flex:1}
.restitle:hover h3{color:var(--volt)}
.restitle:focus-visible{outline:2px solid var(--aurora);outline-offset:3px}
.res:last-child{border-bottom:0}
.res:hover{background:rgba(255,255,255,.025)}
.res h3{font-size:17.5px;font-weight:700;line-height:1.22;max-width:47ch}
.funder{font-size:12.5px;color:var(--dust);margin-top:4px}
.facts{display:flex;gap:24px;flex-wrap:wrap;margin-top:13px}
.fact b{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dust);font-weight:500}
.fact span{font-family:"IBM Plex Mono",monospace;font-size:14.5px;font-weight:500}
.fact span.urgent{color:var(--ember)}
.fact span.muted{color:var(--dust)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;
  border:1px solid var(--seam);padding:3px 8px;border-radius:2px;color:var(--dust)}
.tag.who{border-color:rgba(239,233,220,.35);color:var(--bone)}
.tag.flag{border-color:rgba(233,184,76,.6);color:var(--amber)}
.tag.closed{border-color:rgba(229,106,106,.6);color:var(--ember)}
.sortbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 19px;border-bottom:1px solid var(--seam);background:var(--strata)}
.count{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dust)}
.tl .track{position:relative;height:2px;background:var(--seam);margin:30px 0 12px}
.tl .pin{position:absolute;top:-6px;width:14px;height:14px;border-radius:50%;background:var(--loam);border:2px solid var(--seam);transform:translateX(-50%)}
.tl .pin.done{background:var(--aurora);border-color:var(--aurora)}
.tl .pin.due{border-color:var(--ember);box-shadow:0 0 12px rgba(229,106,106,.5)}
.tl .pin.pay{border-color:var(--moss)}
.tl .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--aurora),var(--amber))}
.tl .lbls{display:flex;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dust)}
.tl .lbls div{text-align:center;flex:1}
.tl .lbls b{display:block;color:var(--bone);font-size:12.5px;font-weight:600}
table.elig{width:100%;border-collapse:collapse;font-size:13.5px}
table.elig th,table.elig td{text-align:left;padding:10px;border-bottom:1px solid var(--seam)}
table.elig th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dust);font-weight:500}
table.elig td.y{color:var(--aurora);font-weight:600}
table.elig td.n{color:var(--dust)}
.path{border:1px solid var(--seam);border-radius:var(--r);background:var(--loam);padding:17px 19px;margin-bottom:13px}
.path.best{border-color:var(--aurora);box-shadow:0 0 0 1px rgba(95,214,192,.25),0 0 40px rgba(95,214,192,.09)}
.path .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.path h4{font-size:17px;font-weight:700}
.path .tot{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;color:var(--amber)}
.strata{display:flex;height:48px;margin:15px 0 9px;border-radius:3px;overflow:hidden;border:1px solid var(--seam);background:var(--bedrock)}
.strata span{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--bedrock);overflow:hidden;white-space:nowrap;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:15px;font-size:12.5px;color:var(--dust)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px}
.note{font-size:13px;color:var(--dust);margin-top:11px;border-left:2px solid var(--seam);padding-left:12px}
.alert{display:flex;gap:14px;padding:16px 19px;border-bottom:1px solid var(--seam)}
.alert:last-child{border-bottom:0}
.alert .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--moss);margin-top:8px;box-shadow:0 0 10px rgba(169,201,72,.7)}
.alert.read .dot{background:var(--seam);box-shadow:none}
.alert.change .dot{background:var(--ember);box-shadow:0 0 10px rgba(229,106,106,.6)}
.alert h4{font-size:15.5px;font-weight:700;line-height:1.28}
.alert p{margin:4px 0 0;font-size:13.5px;color:var(--dust)}
.alert time{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dust);white-space:nowrap;margin-left:auto}
.daybar{padding:8px 19px;background:var(--strata);color:var(--dust);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--seam)}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--seam);color:var(--dust)}
.pill.seed{color:var(--amber);border-color:rgba(233,184,76,.5)}
.pill.ok{color:var(--moss);border-color:rgba(169,201,72,.5)}
.empty{padding:34px 19px;color:var(--dust);text-align:center}
.empty b{display:block;color:var(--bone);font-family:"Archivo",sans-serif;font-size:16px;margin-bottom:6px}
.railwrap{overflow-x:auto;border:1px solid var(--seam);border-radius:var(--r);background:var(--loam)}
.rail{display:flex;min-width:760px}
.railcell{flex:1;background:transparent;border:0;border-right:1px solid var(--seam);padding:11px 10px 12px;
  cursor:pointer;text-align:left;color:var(--dust);position:relative}
.railcell:last-child{border-right:0}
.railcell:hover{background:rgba(255,255,255,.03)}
.railcell[aria-pressed=true]{background:var(--strata)}
.railcell i{display:block;height:3px;border-radius:2px;margin-bottom:8px;opacity:.55}
.railcell[aria-pressed=true] i{opacity:1}
.railcell b{display:block;font-family:"Archivo",sans-serif;font-size:12px;color:var(--bone);font-weight:600}
.railcell span{display:block;font-size:19px;font-weight:600;color:var(--bone);margin-top:3px}
.railcell em{display:block;font-style:normal;font-size:10.5px;color:var(--dust);margin-top:1px}
.phasetag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 9px;border-radius:99px;color:var(--bedrock);font-weight:700}
.trackcard{overflow:hidden}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin-top:14px}
.tgrid label{display:block}
.tgrid label span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dust);margin-bottom:5px}
.tgrid .field{padding:8px 10px;font-size:13.5px}
.tsec{margin-top:12px;border-top:1px solid var(--seam);padding-top:10px}
.tsec>summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dust);list-style:none}
.tsec>summary:hover{color:var(--bone)}
.tsec[open]>summary{color:var(--aurora)}
.cashbox{margin-top:13px;padding:11px 13px;border:1px solid var(--seam);border-left:2px solid var(--amber);border-radius:3px;background:rgba(233,184,76,.05)}
.readout{display:block;padding:8px 10px;font-size:15px;font-weight:600;color:var(--moss)}
.tgrid select.field{padding:8px 10px;font-size:13.5px}
.flags{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.flag{font-size:12.8px;padding:7px 11px;border-radius:3px;border-left:2px solid}
.flag.warn{background:rgba(233,184,76,.08);border-color:var(--amber);color:var(--amber)}
.flag.bad{background:rgba(229,106,106,.1);border-color:var(--ember);color:var(--ember)}
details summary::-webkit-details-marker{color:var(--dust)}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--seam);font-size:12.8px;color:var(--dust);max-width:78ch}
a{color:var(--aurora)}
@media(max-width:860px){.grid2{grid-template-columns:1fr!important}.screen-head h2{font-size:25px}nav.tabs button{min-width:112px;font-size:12.5px;padding:10px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

// ---------- scoring (mirror of scoring/rules.ts) ----------
const WEIGHTS = {applicant:35, projectOverlap:30, budgetFit:15, geography:12, burden:8};
const INELIGIBLE_CAP = 25;
const NO_TOPIC_CAP = 45;

function scoreGrant(g, p){
  const reasons=[]; let score=0, eligible=true, offTopic=false;
  if(!p.applicant){ reasons.push({label:'No applicant type set — eligibility not assessed',delta:0}); }
  else if(g.eligible_applicants.includes(p.applicant)){
    score+=WEIGHTS.applicant; reasons.push({label:'Your applicant type is named as eligible',delta:WEIGHTS.applicant});
  } else {
    eligible=false; const note=g.applicant_notes?.[p.applicant];
    reasons.push({label:note?`Not eligible as lead applicant — ${note}`:"Your applicant type isn't eligible",delta:0});
  }
  if(p.projectTypes.length){
    const exact=p.projectTypes.filter(t=>g.project_types.includes(t));
    const fams=new Set(g.project_types.map(famOf));
    const near=p.projectTypes.filter(t=>!exact.includes(t)&&fams.has(famOf(t)));
    const raw=(exact.length+near.length*0.5)/p.projectTypes.length;
    let pts=Math.round(WEIGHTS.projectOverlap*raw);
    if(exact.length>0) pts=Math.max(pts,10);
    if(pts>0){ score+=pts;
      const bits=[`${exact.length} exact`]; if(near.length) bits.push(`${near.length} same-family`);
      reasons.push({label:`Project type overlap (${bits.join(', ')})`,delta:pts});
    } else reasons.push({label:'No overlap with the funded project types',delta:0});
    if(exact.length===0) offTopic=true;
  }
  if(p.budget!=null && (g.award_min!=null||g.award_max!=null)){
    const min=g.award_min??0, max=g.award_max??Infinity;
    if(p.budget>=min&&p.budget<=max){score+=WEIGHTS.budgetFit;reasons.push({label:'Your budget sits inside the award range',delta:WEIGHTS.budgetFit});}
    else if(p.budget>max){const pts=Math.round(WEIGHTS.budgetFit/2);score+=pts;reasons.push({label:'Budget exceeds the ceiling — partial funding only',delta:pts});}
    else reasons.push({label:'Budget is below the award floor',delta:0});
  } else if(g.award_min==null&&g.award_max==null){
    const pts=Math.round(WEIGHTS.budgetFit/2); score+=pts;
    reasons.push({label:'Award range not published by the funder',delta:pts});
  }
  const geo=g.geography, national=geo.regions.includes('federal')||geo.regions.includes('statewide_ny');
  if(p.county&&geo.counties.length){
    if(geo.counties.includes(p.county)){score+=WEIGHTS.geography;reasons.push({label:'Your county is explicitly in scope',delta:WEIGHTS.geography});}
    else {eligible=false;reasons.push({label:'Your county is outside the eligible geography',delta:0});}
  } else if(national||geo.regions.length===0){
    const pts=Math.round(WEIGHTS.geography*0.67); score+=pts; reasons.push({label:'Open to your region',delta:pts});
  } else {score+=WEIGHTS.geography;reasons.push({label:'Your region is in scope',delta:WEIGHTS.geography});}
  let burden=WEIGHTS.burden, cs=g.cost_share_pct;
  if(cs!=null&&cs>=50){burden-=4;reasons.push({label:`${cs}% cost share required`,delta:-4});}
  else if(cs!=null&&cs>=15){burden-=2;reasons.push({label:`${cs}% cost share required`,delta:-2});}
  if(g.disbursement==='reimbursement'){burden-=2;reasons.push({label:'Reimbursement basis — you spend first',delta:-2});}
  if(g.requirements.length>3){burden-=2;reasons.push({label:`${g.requirements.length} eligibility requirements to clear`,delta:-2});}
  if(g.status==='forecast'){burden-=3;reasons.push({label:'No open application round announced',delta:-3});}
  score+=Math.max(0,burden);
  if(offTopic){score=Math.min(score,NO_TOPIC_CAP);
    reasons.push({label:`Capped at ${NO_TOPIC_CAP} — funds none of your project types exactly`,delta:0});}
  if(!eligible) score=Math.min(score,INELIGIBLE_CAP);
  return {score:Math.max(0,Math.min(100,Math.round(score))),eligible,reasons};
}

const daysUntil = (d, now=new Date()) => d==null?null:Math.ceil((new Date(d)-now)/864e5);
function monthsToFunds(g, now=new Date()){
  if(g.funds_available_est){const [y,m]=g.funds_available_est.split('-').map(Number);
    if(y) return (y-now.getFullYear())*12+((m||1)-(now.getMonth()+1));}
  const d=daysUntil(g.deadline,now); if(d==null) return null;
  return Math.round(Math.max(0,d)/30 + (g.disbursement==='on_award'?2:5));
}
const DEFAULT_SORT=['match','deadline','award','speed'];
function sortRows(rows, order=DEFAULT_SORT, now=new Date()){
  const norm=v=>v==null?9999:v<0?9998:v;
  const cmp={
    match:(a,b)=>b.match.score-a.match.score,
    deadline:(a,b)=>norm(daysUntil(a.grant.deadline,now))-norm(daysUntil(b.grant.deadline,now)),
    award:(a,b)=>(b.grant.award_max??0)-(a.grant.award_max??0),
    speed:(a,b)=>(monthsToFunds(a.grant,now)??99)-(monthsToFunds(b.grant,now)??99),
  };
  return [...rows].sort((a,b)=>{for(const k of order){const r=cmp[k](a,b);if(r) return r;}
    return a.grant.title.localeCompare(b.grant.title);});
}
function applyFilter(gs, f, now=new Date()){
  return gs.filter(g=>{
    if(!f.includeClosed && g.status==='closed') return false;
    if(f.regions?.length){
      const wide=g.geography.regions.some(r=>['federal','statewide_ny'].includes(r));
      if(!wide && !g.geography.regions.some(r=>f.regions.includes(r))) return false;
    }
    if(f.counties?.length && g.geography.counties.length &&
       !g.geography.counties.some(c=>f.counties.includes(c))) return false;
    if(f.applicants?.length && !g.eligible_applicants.some(a=>f.applicants.includes(a))) return false;
    if(f.projectTypes?.length && !g.project_types.some(t=>f.projectTypes.includes(t))) return false;
    if(f.awardMin!=null && g.award_max!=null && g.award_max<f.awardMin) return false;
    const d=daysUntil(g.deadline,now);
    if(f.deadlineWithinDays!=null && d!=null && d>f.deadlineWithinDays) return false;
    if(f.deadlineNoSoonerThanDays!=null && d!=null && d>=0 && d<f.deadlineNoSoonerThanDays) return false;
    if(f.fundsWithinMonths!=null){const m=monthsToFunds(g,now); if(m!=null&&m>f.fundsWithinMonths) return false;}
    return true;
  });
}
function search(gs, profile, filter, order=DEFAULT_SORT){
  let rows=applyFilter(gs,filter).map(g=>({grant:g,match:scoreGrant(g,profile)}));
  if(filter.minScore!=null) rows=rows.filter(r=>r.match.score>=filter.minScore);
  return sortRows(rows,order);
}

// ---------- best path (mirror of scoring/paths.ts) ----------
const ceilingOf = g => g.award_max ?? g.award_min ?? 0;
function conflicts(a,b){
  const ex=a.tags.filter(t=>t.startsWith('exclusive:')&&b.tags.includes(t));
  if(ex.length) return `shares ${ex[0].replace('exclusive:','')} with ${b.title}`;
  return null;
}
const STACK_SCORE_FLOOR=50;
function greedyStack(cands,budget){
  const sorted=[...cands].sort((a,b)=>ceilingOf(b.grant)-ceilingOf(a.grant));
  const stack=[],blockers=[]; let running=0;
  for(const c of sorted){
    if(c.match.score<STACK_SCORE_FLOOR){blockers.push(`${c.grant.title}: match ${c.match.score}, below the ${STACK_SCORE_FLOOR} floor`);continue;}
    const clash=stack.map(s=>conflicts(c.grant,s.grant)).find(Boolean);
    if(clash){blockers.push(`${c.grant.title}: ${clash}`);continue;}
    if(budget!=null&&running>=budget){blockers.push(`${c.grant.title}: project already fully funded by earlier awards`);continue;}
    const headroom=budget!=null?budget-running:Infinity;
    const contribution=Math.min(ceilingOf(c.grant),headroom);
    if(contribution<=0){blockers.push(`${c.grant.title}: no published award amount`);continue;}
    stack.push({grant:c.grant,contribution,match:c.match}); running+=contribution;
  }
  return {stack,blockers};
}
const LEVEL_COLOR = {state:'#5FD6C0',federal:'#A9C948',utility:'#E9B84C',county:'#E9B84C',municipal:'#E9B84C',private:'#A98BE0'};
function evaluatePath(gs,profile,applicants){
  const seen=new Map();
  for(const applicant of applicants) for(const g of gs){
    if(g.status==='closed') continue;
    const match=scoreGrant(g,{...profile,applicant});
    if(!match.eligible) continue;
    const prev=seen.get(g.id);
    if(!prev||match.score>prev.match.score) seen.set(g.id,{grant:g,match});
  }
  const {stack,blockers}=greedyStack([...seen.values()],profile.budget);
  const total=stack.reduce((n,s)=>n+s.contribution,0);
  const matchRequired=Math.round(stack.reduce((n,s)=>n+(s.grant.cost_share_pct?s.contribution*s.grant.cost_share_pct/100:0),0));
  const months=stack.map(s=>monthsToFunds(s.grant)).filter(m=>m!=null);
  return {key:applicants.join('+'),applicants,total,matchRequired,stack,blockers,
    earliestFundsMonths:months.length?Math.max(...months):null,
    label:applicants.length===1?`${APPLICANT_LABELS[applicants[0]]} applies`
      :`${APPLICANT_LABELS[applicants[0]]} applies, ${APPLICANT_LABELS[applicants[1]].toLowerCase()} as named partner`};
}
function partnerPairs(gs){
  const s=new Set();
  for(const g of gs) for(const [who,note] of Object.entries(g.applicant_notes??{})){
    if(!/(?:as an?|as a named|as a project|participate as)[^.]*partner|partner only/i.test(note)) continue;
    for(const lead of g.eligible_applicants) if(lead!==who) s.add(`${lead}|${who}`);
  }
  return [...s].map(p=>p.split('|'));
}
function comparePaths(gs,profile){
  const solo=APPLICANT_TYPES.map(a=>evaluatePath(gs,profile,[a]));
  const paired=partnerPairs(gs).map(([l,p])=>evaluatePath(gs,profile,[l,p]))
    .filter(p=>p.total>(solo.find(s=>s.key===p.applicants[0])?.total??0));
  return [...paired,...solo].sort((a,b)=>b.total-a.total
    ||a.matchRequired-b.matchRequired
    ||(a.earliestFundsMonths??99)-(b.earliestFundsMonths??99)
    ||a.stack.length-b.stack.length);
}

// ---------- tracker phases ----------
// Order is the user's. `denied` is a terminal branch off `applied`, not a step you
// pass through on the way to `accepted` — the stepper forks there.
const PHASES = [
  {key:'target',      label:'Target',      kind:'pre',    color:'#9C9484', hint:'Identified as worth pursuing. Nothing committed yet.'},
  {key:'pre_req',     label:'Pre-Req',     kind:'pre',    color:'#A98BE0', hint:'Registrations, prequalification, resolutions, match commitments.'},
  {key:'application', label:'Application', kind:'pre',    color:'#5FD6C0', hint:'Actively writing. Deadline is now a hard constraint.'},
  {key:'applied',     label:'Applied',     kind:'wait',   color:'#4FA8E0', hint:'Submitted. Waiting on the funder.'},
  {key:'denied',      label:'Denied',      kind:'closed', color:'#E56A6A', hint:'Not awarded. Capture the reviewer feedback before you close it.'},
  {key:'accepted',    label:'Accepted',    kind:'live',   color:'#A9C948', hint:'Awarded. Contract execution is the next hurdle.'},
  {key:'received',    label:'Received',    kind:'live',   color:'#8FC93A', hint:'Contract executed, funds or authority in hand.'},
  {key:'spending',    label:'Spending',    kind:'live',   color:'#E9B84C', hint:'Period of performance. Track drawdowns against budget.'},
  {key:'reporting',   label:'Reporting',   kind:'live',   color:'#D9814E', hint:'Interim and final reports owed to the funder.'},
  {key:'closed',      label:'Closed',      kind:'closed', color:'#5F6B5C', hint:'Closed out. Retain records for the audit window.'},
];
const PHASE = Object.fromEntries(PHASES.map(p=>[p.key,p]));
const phaseIndex = k => PHASES.findIndex(p=>p.key===k);
// what you can move to from here
function nextPhases(k){
  if(k==='applied') return ['accepted','denied'];
  if(k==='denied'||k==='closed') return [];
  if(k==='reporting') return ['closed'];
  const i=phaseIndex(k);
  return [PHASES[i+1].key==='denied'?'applied':PHASES[i+1].key];
}
function prevPhase(k){
  if(k==='accepted'||k==='denied') return 'applied';
  const i=phaseIndex(k);
  return i>0?(PHASES[i-1].key==='denied'?'applied':PHASES[i-1].key):null;
}
// 15. Standard packet plus anything the funder's own requirements imply.
const BASE_ATTACHMENTS = [
  ['narrative','Project narrative'],
  ['budget','Budget and budget justification'],
  ['workplan','Workplan / timeline'],
  ['support','Letters of support or commitment'],
  ['w9','W-9 or vendor form'],
  ['maps','Site plan or maps'],
];
const DERIVED_ATTACHMENTS = [
  [/prequalif/i,       'prequal_doc',  'NYS prequalification documents'],
  [/SFS|Statewide Financial|Grants\.gov/i, 'registration', 'Registration confirmation (SFS / Grants.gov)'],
  [/resolution/i,      'resolution_doc','Signed board or municipal resolution'],
  [/match|cost share/i,'match_letter', 'Match commitment letter'],
  [/own the project site|easement|site/i,'site_doc','Site control or easement documentation'],
  [/partner/i,         'partner_mou',  'Partner MOU or letter of participation'],
  [/postmark/i,        'mailing',      'Hard copy prepared for postmark'],
  [/incentive|milestone/i,'milestone_sched','Milestone schedule'],
];
function attachmentsFor(g){
  const seen=new Set(), out=BASE_ATTACHMENTS.map(([k,l])=>({k,l,src:'standard'}));
  const hay=[...g.requirements, g.summary??''].join(' ');
  for(const [re,k,l] of DERIVED_ATTACHMENTS){
    if(re.test(hay) && !seen.has(k)){ seen.add(k); out.push({k,l,src:'from this funder\u2019s requirements'}); }
  }
  return out;
}

  sort: [...DEFAULT_SORT],
  profile: {applicant:'town', projectTypes:['solar_renewables','organic_composting','rain_gardens_bioretention'],
    budget:640000, county:'monroe',
    description:'Village-owned parcel in Monroe County. Rooftop solar on the DPW garage, a community compost hub, and a rain garden with native pollinator plantings along the drainage edge. Village owns the land; a local watershed nonprofit would run education programming.'},

// ---------- alerts, derived from the catalog ----------
function buildAlerts(){
  const out=[], now=new Date();
  for(const g of state.grants){
    const d=daysUntil(g.deadline,now);
    if(g.status==='open'&&d!=null&&d>=0&&d<=30)
      out.push({id:'close-'+g.id,kind:'closing_soon',grant:g,when:d,
        title:`Closing in ${d} day${d===1?'':'s'}: ${g.title}`,
        body:`${g.funder} · ${money(g.award_max)?`ceiling ${money(g.award_max)}`:'award range not published'}`});
    if(g.status==='open'&&(d==null||d>30))
      out.push({id:'open-'+g.id,kind:'new_match',grant:g,when:90,
        title:`Open now: ${g.title}`,body:`${g.funder} · ${g.geography.notes??''}`});
    if(g.status==='rolling')
      out.push({id:'roll-'+g.id,kind:'new_match',grant:g,when:120,
        title:`Rolling intake: ${g.title}`,body:`${g.funder} · no fixed deadline`});
    if(g.status==='closed'&&d!=null&&d<0&&d>-45)
      out.push({id:'closed-'+g.id,kind:'changed',grant:g,when:200,
        title:`Closed ${Math.abs(d)} days ago: ${g.title}`,
        body:g.verification_note??'Watch for the next round.'});
    if(g.status==='forecast')
      out.push({id:'fc-'+g.id,kind:'changed',grant:g,when:300,
        title:`No open round: ${g.title}`,body:g.verification_note??'Round not announced.'});
  }
  return out.sort((a,b)=>a.when-b.when);
}

function trackRecord(g){
  return {phase:'target', owner:'', requested:g.award_max??g.award_min??null, awarded:null,
    matchSource:'', matchAmount:null, nextAction:'', nextDate:'', readiness:{}, log:[],
    signatory:'', programOfficer:'', partners:'',            // 7, 8, 9
    submittedOn:'', awardNoticeOn:'', contractOn:'',          // 10
    popStart:'', popEnd:'',                                   // 11
    attachments:{},                                           // 15
    probability:50, writingHours:null,                        // 18
    addedAt:new Date().toISOString()};
}
function track(id){
  if(state.tracked.has(id)) return;
  const g=state.grants.find(x=>x.id===id); if(!g) return;
  const r=trackRecord(g); r.log.push({at:new Date().toISOString(),text:'Added to tracker as Target'});
  state.tracked.set(id,r);
}
const today = () => new Date().toISOString().slice(0,10);
function setPhase(id,phase){
  const r=state.tracked.get(id); if(!r||r.phase===phase) return;
  r.log.push({at:new Date().toISOString(),text:`${PHASE[r.phase].label} → ${PHASE[phase].label}`});
  r.phase=phase;
  // stamp the milestone dates as they happen; still editable afterwards
  if(phase==='applied'  && !r.submittedOn)    r.submittedOn=today();
  if((phase==='accepted'||phase==='denied') && !r.awardNoticeOn) r.awardNoticeOn=today();
  if(phase==='received' && !r.contractOn)     r.contractOn=today();
  if(phase==='spending' && !r.popStart)       r.popStart=today();
}
/** 5. What you have to carry before a reimbursement funder pays you back. */
function exposure(g,r){
  const award=r.awarded??r.requested??0;
  if(!award) return null;
  const match=r.matchAmount ?? (g.cost_share_pct?Math.round(award*g.cost_share_pct/100):0);
  const reimbursed=g.disbursement==='reimbursement';
  return {award, match, reimbursed,
    front: reimbursed ? award+match : match,
    note: reimbursed
      ? 'Award is paid only after you spend, and match is never reimbursed.'
      : g.disbursement==='milestone' ? 'Paid at milestones — you carry each milestone until it clears.'
      : g.disbursement==='on_award' ? 'Paid on award; only the match comes out of your own funds.'
      : 'Disbursement basis not stated by the funder — assume you carry the cost until confirmed.'};
}

/** Things the tracker should say out loud rather than leave you to notice. */
function trackerFlags(g,r){
  const out=[]; const d=daysUntil(g.deadline);
  const pre=['target','pre_req','application'].includes(r.phase);
  if(pre && d!=null && d<0 && g.status!=='rolling')
    out.push({level:'bad',text:`Deadline passed ${Math.abs(d)} days ago while still in ${PHASE[r.phase].label}`});
  else if(pre && d!=null && d>=0 && d<=14)
    out.push({level:'warn',text:`${d} days to deadline and not submitted`});
  if(r.phase==='pre_req'){
    const missing=READINESS.filter(([k])=>!r.readiness[k]).length;
    if(missing) out.push({level:'warn',text:`${missing} readiness item${missing===1?'':'s'} outstanding`});
  }
  if(g.cost_share_pct && ['pre_req','application'].includes(r.phase) && !r.matchSource)
    out.push({level:'warn',text:`${g.cost_share_pct}% cost share required, no match source recorded`});
  const ex=exposure(g,r);
  if(ex && ex.front>0 && ['pre_req','application','applied','accepted','received','spending'].includes(r.phase))
    out.push({level:ex.reimbursed?'warn':'warn',text:`Cash to front: ${money(ex.front)} before the funder pays anything back`});
  if(r.writingHours && r.requested){
    const perHour=Math.round(r.requested*(r.probability/100)/r.writingHours);
    if(perHour<500) out.push({level:'warn',text:`Expected value ${money(perHour)}/hour of writing — check this is worth the effort`});
  }
  if(r.nextDate){
    const nd=daysUntil(r.nextDate);
    if(nd!=null && nd<0) out.push({level:'bad',text:`Next action overdue by ${Math.abs(nd)} days`});
  }
  if(g.needs_verification && pre)
    out.push({level:'warn',text:'Figures on this record still need confirming against the funder notice'});
  return out;
}

  const d=daysUntil(g.deadline);

  return g.award_max!=null?`up to ${money(g.award_max)}`:`from ${money(g.award_min)}`;
}

}

function phaseRail(){
  const counts={}, sums={};
  for(const [id,r] of state.tracked){
    counts[r.phase]=(counts[r.phase]??0)+1;
    sums[r.phase]=(sums[r.phase]??0)+(r.awarded??r.requested??0);
  }
  return `<div class="railwrap"><div class="rail" data-group="phaseFilter">
    ${PHASES.map(ph=>`<button class="railcell" data-v="${ph.key}" aria-pressed="${state.trackerPhaseFilter===ph.key}" title="${esc(ph.hint)}">
      <i style="background:${ph.color}"></i>
      <b>${ph.label}</b>
      <span class="mono">${counts[ph.key]??0}</span>
      <em class="mono">${sums[ph.key]?money(sums[ph.key]):'—'}</em>
    </button>`).join('')}
  </div></div>`;
}

function renderTracker(){
  if(!state.tracked.size) return `${phaseRail()}
    <div class="card empty" style="margin-top:16px"><b>Nothing tracked yet</b>
      Open a grant from Explore and hit "Track this grant". It lands in Target, and you move it
      along the pipeline from here.
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn" data-act="goto-explore">Go to Explore</button>
        <button class="btn ghost" data-act="demo-track">Track the three open programmes</button>
      </div></div>`;

  let rows=[...state.tracked].map(([id,r])=>({g:state.grants.find(x=>x.id===id),r,id})).filter(x=>x.g);
  if(state.trackerPhaseFilter) rows=rows.filter(x=>x.r.phase===state.trackerPhaseFilter);
  rows.sort((a,b)=>phaseIndex(a.r.phase)-phaseIndex(b.r.phase)
    || (daysUntil(a.g.deadline)??9999)-(daysUntil(b.g.deadline)??9999));

  const live=[...state.tracked.values()];
  const pipeline=live.filter(r=>!['denied','closed'].includes(r.phase))
    .reduce((n,r)=>n+(r.awarded??r.requested??0),0);
  const won=live.filter(r=>['accepted','received','spending','reporting','closed'].includes(r.phase))
    .reduce((n,r)=>n+(r.awarded??0),0);
  const decided=live.filter(r=>['denied','accepted','received','spending','reporting','closed'].includes(r.phase));
  const winRate=decided.length?Math.round(decided.filter(r=>r.phase!=='denied').length/decided.length*100):null;

  return `${phaseRail()}
  <div class="row" style="margin:16px 0 6px;gap:22px">
    <div class="fact"><b>In pipeline</b><span class="mono" style="font-size:19px">${money(pipeline)}</span></div>
    <div class="fact"><b>Awarded</b><span class="mono" style="font-size:19px;color:var(--moss)">${money(won)}</span></div>
    <div class="fact"><b>Win rate</b><span class="mono" style="font-size:19px">${winRate==null?'—':winRate+'%'}</span></div>
    <div class="fact"><b>Tracked</b><span class="mono" style="font-size:19px">${state.tracked.size}</span></div>
    ${state.trackerPhaseFilter?`<button class="chip" data-act="clear-phase-filter">Showing ${PHASE[state.trackerPhaseFilter].label} only ✕</button>`:''}
  </div>
  <div class="stack">${rows.length?rows.map(trackerCard).join(''):'<div class="card empty">Nothing in that phase.</div>'}</div>`;
}

// toggle helpers
const toggleArr=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
const parseV=v=>v==='null'?null:isNaN(Number(v))?v:Number(v);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-open],[data-open2],[data-act],[data-v],[data-read],[data-track],[data-untrack],[data-phase],[data-ready],[data-attach]');
  if(!t) return;
  const groupEl = t.closest('[data-group]');
  const group = groupEl?.dataset.group;

  if(t.dataset.tab){ state.tab=t.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.open){ state.detailId=t.dataset.open; state.tab='detail'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.read){ state.readAlerts.add(t.dataset.read); state.detailId=t.dataset.open2; state.tab='detail'; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.act==='reset'){ state.filter={...state.filter,applicants:[],projectTypes:[],counties:[],awardMin:null,
      deadlineWithinDays:null,fundsWithinMonths:null,minScore:null,includeClosed:false}; render(); return; }
  if(t.dataset.act==='goto-explore'){ state.tab='explore'; render(); return; }
  if(t.dataset.act==='clear-phase-filter'){ state.trackerPhaseFilter=null; render(); return; }
  if(t.dataset.act==='demo-track'){
    state.grants.filter(g=>g.status==='open'||g.status==='rolling').forEach(g=>track(g.id));
    render(); return; }
  if(t.dataset.track){ track(t.dataset.track); state.tab='tracker'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.untrack){ state.tracked.delete(t.dataset.untrack); render(); return; }
  if(t.dataset.phase){ const [id,ph]=t.dataset.phase.split(':'); setPhase(id,ph);
    const sc=window.scrollY; render(); window.scrollTo({top:sc}); return; }
  if(t.dataset.ready){ const [id,k]=t.dataset.ready.split(':'); const r=state.tracked.get(id);
    r.readiness[k]=!r.readiness[k]; const sc=window.scrollY; render(); window.scrollTo({top:sc}); return; }
  if(t.dataset.attach){ const [id,k]=t.dataset.attach.split(':'); const r=state.tracked.get(id);
    r.attachments[k]=!r.attachments[k]; const sc=window.scrollY; render(); window.scrollTo({top:sc}); return; }
  if(t.dataset.act==='save-filter'){
    const nameEl=document.getElementById('fname');
    const name=(nameEl?.value||state.draft.name||'Untitled filter').trim();
    state.savedFilters=[...state.savedFilters.filter(f=>f.name!==name),{name,criteria:structuredClone(state.filter)}];
    state.tab='alerts'; render(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }

  const v = parseV(t.dataset.v);
  switch(group){
    case 'regions': case 'counties': case 'applicants': case 'projectTypes':
      state.filter[group]=toggleArr(state.filter[group],v); break;
    case 'awardMin': case 'deadlineWithinDays': case 'fundsWithinMonths':
    case 'minScore': case 'deadlineNoSoonerThanDays':
      state.filter[group]=v; break;
    case 'includeClosed': state.filter.includeClosed=!state.filter.includeClosed; break;
    case 'sort': state.sort=[v,...DEFAULT_SORT.filter(k=>k!==v)]; break;
    case 'sortOrder': state.sort=[v,...state.sort.filter(k=>k!==v)]; break;
    case 'profileTypes': state.profile.projectTypes=toggleArr(state.profile.projectTypes,v); break;
    case 'profileApplicant': state.profile.applicant=v; break;
    case 'profileCounty': state.profile.county=v; break;
    case 'profileBudget': state.profile.budget=v; break;
    case 'phaseFilter': state.trackerPhaseFilter=state.trackerPhaseFilter===v?null:v; break;
    default: return;
  }
  const scroll=window.scrollY; render(); window.scrollTo({top:scroll});
});

document.addEventListener('change', e => handleFieldEdit(e));
document.addEventListener('input', e => handleFieldEdit(e));
function handleFieldEdit(e){
  if(e.target.id==='desc') state.profile.description=e.target.value;
  if(e.target.id==='fname') state.draft.name=e.target.value;
  const t=e.target.dataset?.t;
  if(t){
    const [id,field]=t.split(':'); const r=state.tracked.get(id); if(!r) return;
    const raw=e.target.value;
    r[field]=['requested','awarded','matchAmount','writingHours','probability'].includes(field)
      ? (raw.replace(/[^0-9]/g,'')===''?null:Number(raw.replace(/[^0-9]/g,'')))
      : raw;
    if(['writingHours','probability','matchAmount'].includes(field)){
      const sc=window.scrollY; render(); window.scrollTo({top:sc});
    }
  }
  schedulePersist();
}

function applyPrefill(){
  const q=new URLSearchParams(location.search);
  const county=q.get('county'); const types=q.get('types');
  if(county) state.profile.county=county;
  if(types) state.profile.projectTypes=types.split(',').map(s=>s.trim()).filter(Boolean);
}

// ---------- per-user persistence (Supabase) ----------
let persistT=null, lastSig="";
function snapSig(){ return JSON.stringify({p:state.profile,t:[...state.tracked.entries()],
  f:state.savedFilters,r:[...state.readAlerts],d:state.draft}); }
function schedulePersist(){ if(!LOADED||!sb||!SESSION) return; clearTimeout(persistT); persistT=setTimeout(persistUser,700); }
async function persistUser(){
  if(!sb||!SESSION) return; const sig=snapSig(); if(sig===lastSig) return; lastSig=sig;
  const uid=SESSION.user.id, now=new Date().toISOString();
  try{
    await sb.from('grant_settings').upsert({user_id:uid,
      data:{profile:state.profile, readAlerts:[...state.readAlerts], draft:state.draft}, updated_at:now},{onConflict:'user_id'});
    // small per-user sets: replace wholesale (delete + insert) — simple and correct
    await sb.from('grant_tracked').delete().eq('user_id',uid);
    const trk=[...state.tracked.entries()].map(([grant_id,data])=>({user_id:uid,grant_id,data,updated_at:now}));
    if(trk.length) await sb.from('grant_tracked').insert(trk);
    await sb.from('grant_saved_filters').delete().eq('user_id',uid);
    const flt=state.savedFilters.map(f=>({user_id:uid,name:f.name,data:{criteria:f.criteria}}));
    if(flt.length) await sb.from('grant_saved_filters').insert(flt);
  }catch(e){ console.error('grant persist failed',e); }
}
async function loadUserData(){
  try{
    const [set,trk,flt]=await Promise.all([
      sb.from('grant_settings').select('data').eq('user_id',SESSION.user.id).maybeSingle(),
      sb.from('grant_tracked').select('grant_id,data'),
      sb.from('grant_saved_filters').select('name,data'),
    ]);
    if(set.data&&set.data.data){ const s=set.data.data;
      if(s.profile) state.profile={...state.profile,...s.profile};
      if(Array.isArray(s.readAlerts)) state.readAlerts=new Set(s.readAlerts);
      if(s.draft) state.draft={...state.draft,...s.draft};
    } else { applyPrefill(); }                        // first-time user -> host context
    if(trk.data) state.tracked=new Map(trk.data.map(r=>[r.grant_id,r.data]));
    if(flt.data) state.savedFilters=flt.data.map(r=>({name:r.name, criteria:(r.data||{}).criteria||{}}));
  }catch(e){ console.error('grant user load failed',e); applyPrefill(); }
}

// ---------- boot ----------
async function boot(){
  if(sb){ try{ const {data}=await sb.auth.getSession(); SESSION=data.session||null; }catch(e){} }
  IS_ADMIN = !!(SESSION && SESSION.user && SESSION.user.id===ADMIN_UID);
  let grants=null, gen=(window.__GRANTS__||{}).generated_at, note=(window.__GRANTS__||{}).provenance_note;
  if(sb && SESSION){                                  // catalog from DB (behind sign-in)
    try{ const {data,error}=await sb.from('grants').select('data,last_verified');
      if(!error && data && data.length){ grants=data.map(r=>r.data);
        const lv=data.map(r=>r.last_verified).filter(Boolean).sort(); if(lv.length) gen=lv[lv.length-1]; }
    }catch(e){ console.error('grant catalog load failed',e); }
  }
  if(!grants){                                        // offline / signed-out fallback
    const f=window.__GRANTS__ || await (await fetch('./grants.json')).json();
    grants=f.grants; gen=f.generated_at; note=f.provenance_note;
  }
  state.grants=grants;
  if(sb && SESSION) await loadUserData(); else applyPrefill();
  document.getElementById('stamp').textContent=`${grants.length} records · verified ${gen||''}`+(SESSION?'':' · sign in to save');
  document.getElementById('foot').textContent=note||'';
  lastSig=snapSig(); LOADED=true;
  if(IS_ADMIN) initAdminEditor();
  render();
}
boot().catch(err=>{
  document.getElementById('screens').innerHTML =
    `<div class="card empty"><b>Couldn't load the catalog</b> ${esc(err.message)}.</div>`;
  document.getElementById('stamp').textContent='Catalog unavailable';
});

// ---------- admin catalog editor (admin only) ----------
const NEW_GRANT_TEMPLATE={id:"funder-program-2026",title:"",funder:"",funder_level:"state",
  program_url:"",source_url:"",summary:"",eligible_applicants:["town","county","nonprofit"],
  applicant_notes:{},project_types:[],geography:{regions:["finger_lakes","western_ny"],counties:[],notes:""},
  award_min:null,award_max:null,cost_share_pct:null,expected_awards:null,status:"open",
  opens_on:null,deadline:null,award_notice_est:null,funds_available_est:null,disbursement:null,
  requirements:[],tags:[],last_verified:new Date().toISOString().slice(0,10),verified_by:"admin",
  needs_verification:true,verification_note:"Newly entered — confirm every figure against the funder notice."};
async function upsertGrant(rec){
  const row={id:rec.id,data:rec,status:rec.status||null,deadline:rec.deadline||null,
    last_verified:rec.last_verified||null,needs_verification:!!rec.needs_verification};
  const {error}=await sb.from('grants').upsert(row,{onConflict:'id'});
  if(error) throw error;
  const i=state.grants.findIndex(g=>g.id===rec.id);
  if(i>=0) state.grants[i]=rec; else state.grants.push(rec);
}
async function deleteGrant(id){
  const {error}=await sb.from('grants').delete().eq('id',id); if(error) throw error;
  state.grants=state.grants.filter(g=>g.id!==id);
}
function initAdminEditor(){
  const st=document.createElement('style'); st.textContent=`
    #gae-btn{position:fixed;right:18px;bottom:18px;z-index:9998;background:var(--moss,#a9c948);color:#12160c;
      border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
    #gae-ov{position:fixed;inset:0;z-index:9999;background:rgba(8,10,7,.72);display:none;padding:24px;overflow:auto}
    #gae-ov.on{display:block}
    #gae-panel{max-width:860px;margin:0 auto;background:#14180f;border:1px solid #333;border-radius:12px;padding:20px 22px;color:#e8ead8}
    #gae-panel h3{margin:0 0 4px;font-size:20px} #gae-panel .muted{color:#9aa088;font-size:13px}
    #gae-list{margin:14px 0;max-height:40vh;overflow:auto;border:1px solid #2a2f22;border-radius:8px}
    .gae-row{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #2a2f22}
    .gae-row:last-child{border-bottom:0} .gae-row b{flex:1;font-weight:600;font-size:13.5px}
    .gae-row small{color:#9aa088;font-family:'IBM Plex Mono',monospace;font-size:11px}
    #gae-ov textarea{width:100%;min-height:300px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
      background:#0e120a;color:#dfe3d2;border:1px solid #333;border-radius:8px;padding:12px;box-sizing:border-box}
    #gae-ov button.b{background:#a9c948;color:#12160c;border:0;border-radius:7px;padding:9px 15px;font-weight:700;cursor:pointer;margin-right:8px}
    #gae-ov button.g{background:transparent;color:#e8ead8;border:1px solid #444;border-radius:7px;padding:9px 15px;cursor:pointer;margin-right:8px}
    #gae-ov button.d{background:transparent;color:#e56a6a;border:1px solid #6a2a2a;border-radius:7px;padding:9px 15px;cursor:pointer;float:right}
    #gae-msg{margin:10px 0;color:#e56a6a;font-size:13px;white-space:pre-wrap}`;
  document.head.appendChild(st);
  const btn=document.createElement('button'); btn.id='gae-btn'; btn.textContent='✎ Edit catalog';
  const ov=document.createElement('div'); ov.id='gae-ov';
  ov.innerHTML=`<div id="gae-panel"><h3>Catalog editor <span class="muted">admin only</span></h3>
    <div class="muted">Add or edit grant records. Records save to the shared catalog everyone sees — verify every figure against the funder, and keep <code>needs_verification</code> true until you have.</div>
    <div id="gae-list"></div>
    <button class="b" id="gae-add">+ Add new grant</button>
    <button class="g" id="gae-close">Close</button>
    <div id="gae-edit" style="display:none;margin-top:16px">
      <div class="muted">Edit the record as JSON, then Save.</div>
      <div id="gae-msg"></div>
      <textarea id="gae-json"></textarea>
      <div style="margin-top:12px"><button class="b" id="gae-save">Save</button>
        <button class="g" id="gae-back">Back to list</button>
        <button class="d" id="gae-del">Delete</button></div>
    </div></div>`;
  document.body.appendChild(btn); document.body.appendChild(ov);
  const listEl=ov.querySelector('#gae-list'), editEl=ov.querySelector('#gae-edit'),
        jsonEl=ov.querySelector('#gae-json'), msgEl=ov.querySelector('#gae-msg');
  let editingId=null;
  const showList=()=>{ editEl.style.display='none'; listEl.style.display='';
    listEl.innerHTML=[...state.grants].sort((a,b)=>a.title.localeCompare(b.title)).map(g=>
      `<div class="gae-row"><b>${esc(g.title||'(untitled)')}</b><small>${esc(g.status||'')}</small>
       <button class="g" data-edit="${esc(g.id)}">Edit</button></div>`).join('')||'<div class="gae-row muted">No grants yet.</div>'; };
  const openEditor=(rec)=>{ editingId=rec.id; msgEl.textContent=''; jsonEl.value=JSON.stringify(rec,null,2);
    listEl.style.display='none'; ov.querySelector('#gae-add').style.display='none';
    editEl.style.display=''; ov.querySelector('#gae-del').style.display = state.grants.some(g=>g.id===rec.id)?'':'none'; };
  btn.onclick=()=>{ showList(); ov.querySelector('#gae-add').style.display=''; ov.classList.add('on'); };
  ov.querySelector('#gae-close').onclick=()=>ov.classList.remove('on');
  ov.querySelector('#gae-add').onclick=()=>openEditor(JSON.parse(JSON.stringify(NEW_GRANT_TEMPLATE)));
  ov.querySelector('#gae-back').onclick=()=>{ showList(); ov.querySelector('#gae-add').style.display=''; };
  listEl.onclick=(e)=>{ const b=e.target.closest('[data-edit]'); if(!b) return;
    const rec=state.grants.find(g=>g.id===b.dataset.edit); if(rec) openEditor(rec); };
  ov.querySelector('#gae-save').onclick=async()=>{ msgEl.textContent='';
    let rec; try{ rec=JSON.parse(jsonEl.value); }catch(err){ msgEl.textContent='Invalid JSON: '+err.message; return; }
    if(!rec.id||!rec.title){ msgEl.textContent='id and title are required.'; return; }
    try{ await upsertGrant(rec); render(); showList(); ov.querySelector('#gae-add').style.display=''; }
    catch(err){ msgEl.textContent='Save failed: '+(err.message||err); }
  };
  ov.querySelector('#gae-del').onclick=async()=>{ if(!editingId) return;
    if(!confirm('Delete this grant from the shared catalog?')) return;
    try{ await deleteGrant(editingId); render(); showList(); ov.querySelector('#gae-add').style.display=''; }
    catch(err){ msgEl.textContent='Delete failed: '+(err.message||err); } };
}
</script>
