  const s=occ.sale, [label,cls]=OCC_KIND[occ.type];
  const when = occ.type==="sale" ? fmtSaleDate(s) : fmtDay(occ.date);
  return (
    <div className={"salecard"+(host&&host.givesFree?" free":"")}>
      <div className="when">{when}</div>
      <b>{s.name}</b>
      {host && <div className="host">{host.name}</div>}
      <div className="loc">{[s.venueName, s.street, s.city && s.city+", "+s.state].filter(Boolean).join(" · ")}</div>
      {s.priceNote && <div className="note">{s.priceNote}</div>}
      <div className="foot">
        <span className={"caltag "+cls}>{label}</span>
        {host && host.givesFree && <span className="shopfree">Free</span>}
        {s.url && <a href={s.url} target="_blank" rel="noopener">Details ↗</a>}
        <button onClick={()=>downloadText(s.slug+"-"+occ.type+".ics", saleToICS(occ,host), "text/calendar")}>
          + Calendar</button>
        {host && <button onClick={()=>onOpenCard(host.id)}>Shop →</button>}
      </div>
    </div>
  );
}

function SaleCalendar({sales, vendorById, onOpenCard}){
  const [sub,setSub]=useState("all");
  const [kind,setKind]=useState("all");
  const [freeOnly,setFreeOnly]=useState(false);
  const [showPast,setShowPast]=useState(false);
  const today=todayISO();

  const subOf=s=>{ const v=vendorById[s.vendorId]; return v?v.subregion:null; };
  const subregions=useMemo(()=>[...new Set(sales.map(subOf).filter(Boolean))].sort(),[sales,vendorById]);

  const keep=s=>{
    if(sub!=="all" && subOf(s)!==sub) return false;
    if(kind!=="all" && s.kind!==kind) return false;
    if(freeOnly){ const v=vendorById[s.vendorId]; if(!v||!v.givesFree) return false; }
    return true;
  };
  const filtered=useMemo(()=>sales.filter(keep),[sales,sub,kind,freeOnly,vendorById]);

  const occ=useMemo(()=>filtered.flatMap(saleOccurrences).sort((a,b)=>a.date.localeCompare(b.date)),[filtered]);
  const upcoming=occ.filter(o=>o.date>=today);
  const past=occ.filter(o=>o.date<today);
  const undated=filtered.filter(s=>saleOccurrences(s).length===0);

  const byMonth=list=>{ const m=new Map();
    list.forEach(o=>{ const k=monthKey(o.date); if(!m.has(k)) m.set(k,[]); m.get(k).push(o); });
    return [...m.entries()]; };

  const exportAll=()=>{
    const body=upcoming.map(o=>saleToICS(o, vendorById[o.sale.vendorId]))
      .map(t=>t.split("\r\n").slice(3,-1).join("\r\n"))   // strip each wrapper
      .join("\r\n");
    downloadText("native-plant-sales.ics",
      ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Native Food Forest Planner//Shops//EN",
       body,"END:VCALENDAR"].join("\r\n"), "text/calendar");
  };

  return (
    <div>
      <div className="shopctl">
        <div className="fld"><label>Region</label>
          <select value={sub} onChange={e=>setSub(e.target.value)}>
            <option value="all">All regions</option>
            {subregions.map(s=><option key={s} value={s}>{s}</option>)}
          </select></div>
        <div className="fld"><label>Type</label>
          <select value={kind} onChange={e=>setKind(e.target.value)}>
            <option value="all">Sales &amp; order windows</option>
            <option value="sale">Sales only</option>
            <option value="order_window">Order windows only</option>
          </select></div>
        <button className={"chip"+(freeOnly?" on":"")} onClick={()=>setFreeOnly(f=>!f)}>Free sources only</button>
        {upcoming.length>0 &&
          <button className="chip" onClick={exportAll}>Export {upcoming.length} to calendar (.ics)</button>}
      </div>

      <div className="count">
        {upcoming.length} upcoming date{upcoming.length===1?"":"s"} · {undated.length} not yet announced ·
        {" "}{past.length} past
      </div>

      {upcoming.length===0 && undated.length===0 &&
        <div className="empty">No sales match those filters.</div>}

      {byMonth(upcoming).map(([k,list])=>(
        <div className="calmonth" key={k}>
          <h4>{monthLabel(k)}<span>{list.length} date{list.length===1?"":"s"}</span></h4>
          <div className="calgrid">
            {list.map(o=><SaleCard key={o.sale.id+o.type} occ={o}
                                   host={vendorById[o.sale.vendorId]} onOpenCard={onOpenCard} />)}
          </div>
        </div>
      ))}

      {undated.length>0 && (
        <div className="calundated">
          <h4>Dates not yet announced — {undated.length}</h4>
          <p>These programmes run every year but haven’t published this season’s dates. Most conservation-district
             seedling sales open orders in January and close in early March, with April pick-up — check the district
             directly, or watch this space.</p>
          <div className="calgrid">
            {undated.map(s=>{ const host=vendorById[s.vendorId]; return (
              <div className="salecard" key={s.id}>
                <div className="when" style={{color:"var(--faint)"}}>Date TBA</div>
                <b>{s.name}</b>
                {host && <div className="host">{host.name}</div>}
                <div className="loc">{[s.city && s.city+", "+s.state].filter(Boolean).join(" · ")}</div>
                {s.notes && <div className="note">{s.notes}</div>}
                <div className="foot">
                  <span className={"caltag "+(s.kind==="order_window"?"t-order":"t-sale")}>
                    {s.kind==="order_window"?"Order window":"Sale"}</span>
                  {s.url && <a href={s.url} target="_blank" rel="noopener">Details ↗</a>}
                  {host && <button onClick={()=>onOpenCard(host.id)}>Shop →</button>}
                </div>
              </div>
            );})}
          </div>
        </div>
      )}

      {past.length>0 && (
        <div style={{marginTop:10}}>
          <button className="chip" onClick={()=>setShowPast(p=>!p)}>
            {showPast?"Hide":"Show"} {past.length} past date{past.length===1?"":"s"}</button>
          <div style={{fontFamily:"'Space Mono'",fontSize:10.5,color:"var(--faint)",marginTop:6}}>
            Last year’s date is usually the best predictor of this year’s.
          </div>
          {showPast && byMonth(past).reverse().map(([k,list])=>(
            <div className="calmonth" key={k} style={{marginTop:16,opacity:.75}}>
              <h4>{monthLabel(k)}<span>{list.length} date{list.length===1?"":"s"}</span></h4>
              <div className="calgrid">
                {list.map(o=><SaleCard key={o.sale.id+o.type} occ={o}
                                       host={vendorById[o.sale.vendorId]} onOpenCard={onOpenCard} />)}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* Directory banner: anything happening this calendar month or next */
function UpcomingSalesBanner({sales, vendorById, onGoCalendar}){
  const today=todayISO();
  const horizon=useMemo(()=>{ const d=new Date(); d.setMonth(d.getMonth()+2, 1);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01"; },[]);
  const soon=useMemo(()=>sales.flatMap(saleOccurrences)
    .filter(o=>o.date>=today && o.date<horizon)
    .sort((a,b)=>a.date.localeCompare(b.date)),[sales,today,horizon]);
  if(!soon.length) return null;
  const daysAway=iso=>{ const [y,m,d]=iso.split("-").map(Number);
    return Math.round((new Date(y,m-1,d)-new Date(new Date().toDateString()))/86400000); };
  return (
    <div className="salebanner">
      <div className="hd">Coming up — this month &amp; next</div>
      {soon.map(o=>{ const host=vendorById[o.sale.vendorId], n=daysAway(o.date); return (
        <div className="row" key={o.sale.id+o.type}>
          <span className="dt">{fmtDay(o.date)}</span>
          <span><b>{o.sale.name}</b>{host?` · ${host.name}`:""}{o.sale.city?` · ${o.sale.city}`:""}</span>
          <span className="soon">{OCC_KIND[o.type][0]}{n<=14?` · ${n===0?"today":n===1?"tomorrow":"in "+n+" days"}`:""}</span>
          <a href="#" onClick={e=>{e.preventDefault(); onGoCalendar();}}>Calendar →</a>
        </div>
      );})}
    </div>
  );
}

function ShopMap({vendors, sales, centre, salesByVendor, distOf, plans, planId, setPlanId, onOpenCard, vendorById, invOf, planTotal}){
  const mapRef=useRef(null), mapObj=useRef(null), pinG=useRef(null), ringRef=useRef(null);
  const markers=useRef({});
  const [radius,setRadius]=useState(100);
  const [useRadius,setUseRadius]=useState(true);
  const [showSales,setShowSales]=useState(true);
  const [sel,setSel]=useState(null);
  const [ready,setReady]=useState(false);

  const mapped   = useMemo(()=>vendors.filter(v=>v.lat!==null && v.lat!==undefined),[vendors]);
  const unmapped = useMemo(()=>vendors.filter(v=>v.lat===null || v.lat===undefined),[vendors]);
  const inRange = useMemo(()=>{
    if(!centre || !useRadius) return mapped;
    return mapped.filter(v=>{ const d=distOf[v.id]; return d===null||d===undefined?false:d<=radius; });
  },[mapped,centre,useRadius,radius,distOf]);
  // mail order stays reachable even when it falls outside the radius
  const farShippers = useMemo(()=>{
    if(!centre || !useRadius) return [];
    const inSet=new Set(inRange.map(v=>v.id));
    return mapped.filter(v=>v.ships && !inSet.has(v.id));
  },[mapped,inRange,centre,useRadius]);
  const saleP = useMemo(()=>sales.filter(s=>s.lat!==null && s.lat!==undefined),[sales]);

  /* create once, destroy on unmount */
  useEffect(()=>{
    if(mapObj.current || !mapRef.current || !window.L) return;
    const bases=TILE_LAYERS.map(t=>L.tileLayer(t.url,{maxNativeZoom:t.max,maxZoom:19,attribution:t.attr}));
    const map=L.map(mapRef.current,{center:centre?[centre.lat,centre.lon]:[42.9,-76.5],
      zoom:centre?8:7, layers:[bases[0]]});
    const baseObj={}; TILE_LAYERS.forEach((t,i)=>baseObj[t.name]=bases[i]);
    L.control.layers(baseObj,null,{position:"topright"}).addTo(map);
    L.control.scale({imperial:true,metric:false,position:"bottomleft"}).addTo(map);
    pinG.current=L.layerGroup().addTo(map);
    map.on("click", ()=>setSel(null));   // click empty map to dismiss the detail panel
    mapObj.current=map; setReady(true);
    setTimeout(()=>map.invalidateSize(),40);   // the tab was hidden when the div was measured
    return ()=>{ map.remove(); mapObj.current=null; pinG.current=null; ringRef.current=null;
                 markers.current={}; setReady(false); };
  },[]);

  /* redraw pins whenever the filtered set changes */
  useEffect(()=>{
    if(!ready || !pinG.current) return;
    const map=mapObj.current;
    pinG.current.clearLayers(); markers.current={};
    // No Leaflet popups: a click just records a selection and React renders the
    // detail panel. Nothing about the UI lives inside a Leaflet layer, so a
    // marker rebuild can never destroy what the user is looking at.
    inRange.forEach(v=>{
      // pin size now means something: how much of the plan this shop can supply
      const iv=invOf?invOf(v.id):null;
      const hits=iv?iv.planIds.size:0;
      const r = planTotal>0 && hits>0 ? Math.min(20, 8+Math.round(12*hits/planTotal))
              : (iv&&iv.plantIds.size>0 ? 10 : 7);
      const m=L.circleMarker([v.lat,v.lon],{radius:r,weight:1.6,color:"#2b2a22",
        fillColor:pinFill(v.kind),fillOpacity:1});
      m.on("click",e=>{ L.DomEvent.stopPropagation(e); setSel({kind:"vendor",id:v.id}); });
      m.addTo(pinG.current); markers.current["v"+v.id]=m;
    });
    if(showSales) saleP.forEach(s=>{
      const m=L.circleMarker([s.lat,s.lon],{radius:6,weight:1.4,color:"#2b2a22",
        fillColor:"#f6e7e2",fillOpacity:1,dashArray:"2 2"});
      m.on("click",e=>{ L.DomEvent.stopPropagation(e); setSel({kind:"sale",id:s.id}); });
      m.addTo(pinG.current); markers.current["s"+s.id]=m;
    });
    // plan centre + radius ring
    if(ringRef.current){ ringRef.current.remove(); ringRef.current=null; }
    if(centre){
      const g=L.layerGroup();
      L.circleMarker([centre.lat,centre.lon],{radius:5,weight:2,color:"#42603a",fillColor:"#42603a",fillOpacity:1})
        .addTo(g);
      // interactive:false is ESSENTIAL — a Leaflet circle is clickable by default,
      // and this one is hundreds of pixels wide, drawn after the pins. Without it
      // the ring sits on top and swallows every pin click (broke S3 entirely).
      if(useRadius) L.circle([centre.lat,centre.lon],{radius:radius*1609.34,color:"#42603a",weight:1.5,
        dashArray:"6 6",fill:true,fillOpacity:.05,interactive:false}).addTo(g);
      g.addTo(mapObj.current); ringRef.current=g;
    }
    // fit to what's shown, first paint only
    if(!map._shopsFitted){
      const pts=inRange.map(v=>[v.lat,v.lon]).concat(centre?[[centre.lat,centre.lon]]:[]);
      if(pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(0.12));
      else if(pts.length===1) map.setView(pts[0],10);
      map._shopsFitted=true;
    }
  },[ready,inRange,saleP,showSales,centre,radius,useRadius,distOf,salesByVendor,planTotal]);

  /* selected pin is restyled in place — never rebuilt, so selection can't flicker */
  useEffect(()=>{
    if(!ready) return;
    Object.keys(markers.current).forEach(key=>{
      const m=markers.current[key];
      const isSel = sel && key===(sel.kind==="vendor"?"v":"s")+sel.id;
      m.setStyle({ color:isSel?"#42603a":"#2b2a22", weight:isSel?4:(key[0]==="s"?1.4:1.6) });
      if(isSel && m.bringToFront) m.bringToFront();
    });
  },[sel,ready,inRange,saleP,showSales]);

  const focus=v=>{
    setSel({kind:"vendor",id:v.id});
    const m=markers.current["v"+v.id];
    if(m && mapObj.current) mapObj.current.setView([v.lat,v.lon], Math.max(mapObj.current.getZoom(),11));
  };
  const selVendor = sel && sel.kind==="vendor" ? vendorById[sel.id] : null;
  const selSale   = sel && sel.kind==="sale"   ? sales.find(s=>s.id===sel.id) : null;
  const row=(v,off)=>{
    const d=distOf[v.id];
    return (
      <div key={v.id} className={"lrow"+(sel&&sel.kind==="vendor"&&sel.id===v.id?" sel":"")+(off?" off":"")}
           onClick={()=>{ if(!off) focus(v); else setSel({kind:"vendor",id:v.id}); }}>
        <div className="t"><b>{v.name}</b>
          <span className="d">{d!==null&&d!==undefined?Math.round(d)+" mi":(v.ships?"ships":"—")}</span></div>
        <div className="s">
          {[v.city, v.subregion].filter(Boolean).join(" · ")} · {vkLabel(v.kind)}
          {v.givesFree?" · free":""}{salesByVendor[v.id]?` · ${salesByVendor[v.id]} sale${salesByVendor[v.id]===1?"":"s"}`:""}
          {(()=>{ const iv=invOf?invOf(v.id):null; if(!iv||!iv.plantIds.size) return null;
            return planTotal>0 && iv.planIds.size>0
              ? ` · ${iv.planIds.size} from your plan`
              : ` · ${iv.plantIds.size} plants listed`; })()}
        </div>
        <button className="lcard" onClick={e=>{ e.stopPropagation(); onOpenCard(v.id); }}>Full details →</button>
      </div>
    );
  };

  return (
    <div>
      <div className="shopradius">
        {plans.length>0 && (
          <label className="mono" style={{fontSize:12,display:"inline-flex",alignItems:"center",gap:6}}>
            Measure from
            <select value={planId||""} onChange={e=>setPlanId(e.target.value||null)}
                    style={{fontFamily:"'Spectral'",fontSize:14,background:"#fbf9f2",
                            border:"1.5px solid var(--line)",borderRadius:4,padding:"5px 8px"}}>
              {plans.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </label>
        )}
        {centre ? <>
          <button className={"chip"+(useRadius?" on":"")} onClick={()=>setUseRadius(r=>!r)}>
            {useRadius?"Within radius":"Show all"}</button>
          {useRadius && <>
            <input type="range" min="10" max="300" step="5" value={radius}
                   onChange={e=>setRadius(parseInt(e.target.value,10))} />
            <span className="mono" style={{fontSize:13}}><b>{radius} mi</b></span>
          </>}
        </> : <span className="mono" style={{fontSize:12,color:"var(--faint)"}}>
          This plan has no mapped area yet — draw your plot in its Planting Plan to filter by distance.</span>}
        <button className={"chip"+(showSales?" on":"")} onClick={()=>setShowSales(s=>!s)}>
          Sale venues ({saleP.length})</button>
      </div>

      <div className="shopsplit">
        <div>
          <div className="shopmap" ref={mapRef}></div>
          <div className="shoplegend">
            <span><i style={{background:"#e9f2df"}}></i>Nursery / garden</span>
            <span><i style={{background:"#efe4d0"}}></i>Seed company</span>
            <span><i style={{background:"#eceaf6"}}></i>Seed library</span>
            <span><i style={{background:"#e6eff4"}}></i>Conservation district</span>
            <span><i style={{background:"#f1eaf5"}}></i>Organization</span>
            <span><i style={{background:"#f6e7e2",borderStyle:"dashed"}}></i>Sale venue</span>
            <span><i style={{background:"#42603a",borderColor:"#42603a",width:10,height:10}}></i>Your plan
              {centre?"":" (no mapped area)"}</span>
          </div>
          <div style={{fontFamily:"'Space Mono'",fontSize:10.5,color:"var(--faint)",marginTop:8,lineHeight:1.6}}>
            Colour is the type of supplier. {planTotal>0
              ? "Pin size shows how much of your plan that shop can supply; small pins have no plant list recorded yet."
              : "Pin size shows whether a plant list has been recorded — add plants to a plan to size them by coverage."}
          </div>
        </div>

        <div>
        {(selVendor || selSale) && (
          <div className="shopdetail">
            <button className="x" title="Close" onClick={()=>setSel(null)}>✕</button>
            {selVendor && <>
              <div className="eyebrow">{vkLabel(selVendor.kind)}</div>
              <h4>{selVendor.name}</h4>
              <div className="loc">
                {[selVendor.street, selVendor.city && selVendor.city+", "+selVendor.state+(selVendor.postal?" "+selVendor.postal:"")]
                  .filter(Boolean).join(" · ") || "Location not recorded"}
                {selVendor.county?` · ${selVendor.county} County`:""}
                {distOf[selVendor.id]!==null && distOf[selVendor.id]!==undefined
                  ? ` · ${Math.round(distOf[selVendor.id])} mi away` : ""}
              </div>
              <div className="tags">
                {selVendor.givesFree && <span className="shopfree">Free</span>}
                {selVendor.ships && <span className="shopflag">Ships</span>}
                {selVendor.pickupOnly && <span className="shopflag">Pick-up only</span>}
                {selVendor.membershipRequired && <span className="shopflag">Members</span>}
                {selVendor.localEcotype && <span className="shopflag">Local ecotype</span>}
                {selVendor.straightSpeciesOnly && <span className="shopflag">Straight species</span>}
                {salesByVendor[selVendor.id]>0 &&
                  <span className="shopflag">{salesByVendor[selVendor.id]} sale{salesByVendor[selVendor.id]===1?"":"s"}</span>}
              </div>
              {selVendor.forms.length>0 &&
                <div className="line"><b>Forms</b> {selVendor.forms.map(f=>FORM_LABEL[f]||f).join(" · ")}</div>}
              {selVendor.hours && <div className="line"><b>Hours</b> {selVendor.hours}</div>}
              {selVendor.orderWindow && <div className="line"><b>Ordering</b> {selVendor.orderWindow}</div>}
              {selVendor.notes && <p>{selVendor.notes}</p>}
              {selVendor.needsVerification &&
                <div className="warn">Unverified listing — call ahead before travelling.</div>}
              <div className="acts">
                <button className="pri" onClick={()=>onOpenCard(selVendor.id)}>Full details →</button>
                {selVendor.url && <a href={selVendor.url} target="_blank" rel="noopener">Website ↗</a>}
                {selVendor.phone && <a href={"tel:"+selVendor.phone.replace(/[^0-9+]/g,"")}>{selVendor.phone}</a>}
              </div>
            </>}
            {selSale && (()=>{ const host=vendorById[selSale.vendorId]; return <>
              <div className="eyebrow">{selSale.kind==="order_window"?"Order window":"Sale"}</div>
              <h4>{selSale.name}</h4>
              <div className="loc">
                {[selSale.venueName, selSale.street, selSale.city && selSale.city+", "+selSale.state]
                  .filter(Boolean).join(" · ")}
              </div>
              <div className="line"><b>When</b> {
                selSale.startsOn
                  ? fmtSaleDate(selSale)
                  : selSale.orderClosesOn ? "Orders close "+fmtDay(selSale.orderClosesOn)
                  : "Date not yet announced"}</div>
              {selSale.pickupOn && <div className="line"><b>Pick-up</b> {fmtDay(selSale.pickupOn)}</div>}
              {host && <div className="line"><b>Run by</b> {host.name}</div>}
              {selSale.priceNote && <div className="line"><b>Payment</b> {selSale.priceNote}</div>}
              {selSale.notes && <p>{selSale.notes}</p>}
              <div className="acts">
                {host && <button className="pri" onClick={()=>onOpenCard(host.id)}>Full details →</button>}
                {selSale.url && <a href={selSale.url} target="_blank" rel="noopener">Event page ↗</a>}
              </div>
            </>; })()}
          </div>
        )}

        <div className="shoplist">
          <div className="grouphd">{inRange.length} on the map</div>
          {inRange.length===0 && <div className="lrow" style={{cursor:"default"}}>
            <div className="s">Nothing within {radius} miles. Widen the radius or switch to “Show all”.</div></div>}
          {[...inRange].sort((a,b)=>{
            const x=distOf[a.id], y=distOf[b.id];
            if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
            return x-y;
          }).map(v=>row(v,false))}

          {farShippers.length>0 && <>
            <div className="grouphd">{farShippers.length} outside the radius, ships here</div>
            {farShippers.map(v=>row(v,true))}
          </>}

          {unmapped.length>0 && <>
            <div className="grouphd">{unmapped.length} with no location recorded</div>
            {unmapped.map(v=>row(v,true))}
          </>}
        </div>
        </div>
      </div>
    </div>
  );
}

function Shops({vendors, sales, orgs, plans, vendorPlants, plants, planItems, curPlan, isAdmin, tab, setTab}){
  const [q,setQ]=useState("");
  const [planId,setPlanId]=useState(curPlan);   // which plan the map measures from
  const [focusId,setFocusId]=useState(null);    // vendor jumped to from the map
  useEffect(()=>{ setPlanId(p=> p || curPlan); },[curPlan]);
  const [sub,setSub]=useState("all");
  const [st,setSt]=useState("all");
  const [kind,setKind]=useState("all");
  const [sortKey,setSortKey]=useState("name");
  const [dir,setDir]=useState(1);
  const [chips,setChips]=useState({free:false,ships:false,ecotype:false,straight:false,hasSale:false,
                                   planMatch:false,hasList:false});
  const [centre,setCentre]=useState(null);   // {lat,lon} of the current plan's mapped area

  // distance is measured from the plan's drawn area, exactly as the Grant Finder does
  useEffect(()=>{ let dead=false;
    if(!planId){ setCentre(null); return; }
    (async()=>{
      try{
        const L=await dataProvider.loadLayout(planId); const polys=(L&&L.polys)||[];
        let la=0,ln=0,n=0; polys.forEach(r=>r.forEach(([a,b])=>{la+=a;ln+=b;n++;}));
        if(!dead) setCentre(n?{lat:la/n,lon:ln/n}:null);
      }catch(e){ if(!dead) setCentre(null); }
    })();
    return ()=>{ dead=true; };
  },[planId]);

  const orgById=useMemo(()=>{ const m={}; orgs.forEach(o=>m[o.id]=o); return m; },[orgs]);
  const vendorById=useMemo(()=>{ const m={}; vendors.forEach(v=>m[v.id]=v); return m; },[vendors]);

  /* ---- inventory: what each vendor stocks, and how much of the plan it covers ---- */
  const plantById=useMemo(()=>{ const m={}; (plants||[]).forEach(p=>m[p.id]=p); return m; },[plants]);
  // measured against the same plan the map uses, so the two never disagree
  const planPlantIds=useMemo(()=>new Set(
    (planItems||[]).filter(it=>it.planId===planId).map(it=>it.plantId)),[planItems,planId]);

  const inv=useMemo(()=>{
    const m={};
    (vendorPlants||[]).forEach(vp=>{
      if(!vp.plantId) return;
      const e=m[vp.vendorId]||(m[vp.vendorId]={plantIds:new Set(),planIds:new Set(),rows:0});
      e.rows++; e.plantIds.add(vp.plantId);
      if(planPlantIds.has(vp.plantId)) e.planIds.add(vp.plantId);
    });
    return m;
  },[vendorPlants,planPlantIds]);
  const EMPTY_INV={plantIds:new Set(),planIds:new Set(),rows:0};
  const invOf=id=>inv[id]||EMPTY_INV;
  const planTotal=planPlantIds.size;
  const salesByVendor=useMemo(()=>{ const m={}; sales.forEach(s=>{ m[s.vendorId]=(m[s.vendorId]||0)+1; }); return m; },[sales]);
  // "Full details" from a map pin or list row: show the Directory with that card open
  const openCard=useMemo(()=>(id)=>{ setFocusId(id); setTab("dir"); },[setTab]);
  const distOf=useMemo(()=>{ const m={};
    vendors.forEach(v=>{ m[v.id]=centre?milesBetween(centre.lat,centre.lon,v.lat,v.lon):null; });
    return m; },[vendors,centre]);

  const subregions=useMemo(()=>[...new Set(vendors.map(v=>v.subregion).filter(Boolean))].sort(),[vendors]);
  const states=useMemo(()=>[...new Set(vendors.map(v=>v.state).filter(Boolean))].sort(),[vendors]);
  const kinds=useMemo(()=>[...new Set(vendors.map(v=>v.kind).filter(Boolean))]
    .sort((a,b)=>vkLabel(a).localeCompare(vkLabel(b))),[vendors]);

  const shown=useMemo(()=>{
    const needle=q.trim().toLowerCase();
    let out=vendors.filter(v=>{
      if(sub!=="all" && v.subregion!==sub) return false;
      if(st!=="all" && v.state!==st) return false;
      if(kind!=="all" && v.kind!==kind) return false;
      if(chips.free && !v.givesFree) return false;
      if(chips.ships && !v.ships) return false;
      if(chips.ecotype && !v.localEcotype) return false;
      if(chips.straight && !v.straightSpeciesOnly) return false;
      if(chips.hasSale && !salesByVendor[v.id]) return false;
      if(chips.planMatch && invOf(v.id).planIds.size===0) return false;
      if(chips.hasList && invOf(v.id).plantIds.size===0) return false;
      if(needle){
        const hay=[v.name,v.city,v.county,v.subregion,v.state,v.notes,(v.forms||[]).join(" ")]
          .filter(Boolean).join(" ").toLowerCase();
        if(!hay.includes(needle)) return false;
      }
      return true;
    });
    const val=v=>{ switch(sortKey){
      case "distance": { const d=distOf[v.id]; return d===null||d===undefined?Infinity:d; }
      case "kind": return vkLabel(v.kind);
      case "subregion": return v.subregion||"zzz";
      case "county": return v.county||"zzz";
      case "city": return v.city||"zzz";
      case "forms": return -(v.forms||[]).length;
      case "free": return v.givesFree?0:1;
      case "ships": return v.ships?0:1;
      case "sales": return -(salesByVendor[v.id]||0);
      case "listed": return -invOf(v.id).plantIds.size;
      case "planmatch": return -invOf(v.id).planIds.size;
      case "verified": return v.lastVerified||"";
      default: return v.name.toLowerCase();
    }};
    return out.sort((a,b)=>{
      const x=val(a), y=val(b);
      const c = typeof x==="number" && typeof y==="number" ? x-y : String(x).localeCompare(String(y));
      return (c||a.name.localeCompare(b.name))*dir;
    });
  },[vendors,q,sub,st,kind,chips,sortKey,dir,distOf,salesByVendor,inv]);

  // a vendor jumped to from the map is always shown, even if the filters exclude it
  const listed=useMemo(()=>{
    if(!focusId) return shown;
    const f=vendorById[focusId];
    if(!f) return shown;
    return shown.some(v=>v.id===focusId) ? shown : [f,...shown];
  },[shown,focusId,vendorById]);

  const chip=(k,label)=>(
    <button className={"chip"+(chips[k]?" on":"")} onClick={()=>setChips(c=>({...c,[k]:!c[k]}))}>{label}</button>
  );
  const soon=(title,note)=>(
    <div className="shopsoon"><b>{title}</b>{note}</div>
  );

  return (
    <div>
      <div className="pagehead">
        <div className="eye">Shops &amp; Seed · {vendors.length} listings</div>
        <h2>Where to get native plants &amp; seed</h2>
        <p>Nurseries, seed companies, free seed libraries, conservation-district seedling programmes and the
        organizations that run native plant sales — across Western New York, the Finger Lakes and the Southern Tier,
        plus mail-order sources that ship here.</p>
      </div>

      <div className="shoptabs">
        <button className={tab==="dir"?"on":""} onClick={()=>setTab("dir")}>Directory</button>
        <button className={tab==="map"?"on":""} onClick={()=>setTab("map")}>Map</button>
        <button className={tab==="cal"?"on":""} onClick={()=>setTab("cal")}>Sale Calendar</button>
        {isAdmin && <button className={tab==="edit"?"on":""} onClick={()=>setTab("edit")}>Shop Editor</button>}
      </div>

      {tab==="map" && <ShopMap vendors={vendors} sales={sales} centre={centre}
                               salesByVendor={salesByVendor} distOf={distOf}
                               plans={plans} planId={planId} setPlanId={setPlanId}
                               onOpenCard={openCard} vendorById={vendorById}
                               invOf={invOf} planTotal={planTotal} />}
      {tab==="cal" && <SaleCalendar sales={sales} vendorById={vendorById} onOpenCard={openCard} />}
      {tab==="edit" && soon("Shop Editor arrives in stage S6",
        "Add and edit shops and sales by form, link or document upload. Until then, listings are seeded from importer/vendors/*.json.")}

      {tab==="dir" && <>
        <UpcomingSalesBanner sales={sales} vendorById={vendorById} onGoCalendar={()=>setTab("cal")} />
        <div className="shopctl">
          <div className="fld" style={{flex:"2 1 240px"}}><label>Search name, town or note</label>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="e.g. Ithaca, bare-root, Audubon" /></div>
          <div className="fld"><label>Region</label>
            <select value={sub} onChange={e=>setSub(e.target.value)}>
              <option value="all">All regions</option>
              {subregions.map(s=><option key={s} value={s}>{s}</option>)}
            </select></div>
          <div className="fld"><label>State</label>
            <select value={st} onChange={e=>setSt(e.target.value)}>
              <option value="all">All states</option>
              {states.map(s=><option key={s} value={s}>{s}</option>)}
            </select></div>
          <div className="fld"><label>Type</label>
            <select value={kind} onChange={e=>setKind(e.target.value)}>
              <option value="all">All types</option>
              {kinds.map(k=><option key={k} value={k}>{vkLabel(k)}</option>)}
            </select></div>
          <div className="fld"><label>Sort by</label>
            <select value={sortKey} onChange={e=>setSortKey(e.target.value)}>
              {SHOP_SORTS.map(([k,l])=>(
                <option key={k} value={k} disabled={k==="distance" && !centre}>
                  {l}{k==="distance" && !centre ? " (needs a mapped plan)" : ""}
                </option>
              ))}
            </select></div>
          <button className="dirbtn" title="Toggle direction" onClick={()=>setDir(d=>-d)}>{dir===-1?"↓":"↑"}</button>
        </div>

        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:4}}>
          {chip("free","Free / giveaway")}
          {chip("ships","Ships to me")}
          {chip("ecotype","Local ecotype")}
          {chip("straight","Straight species")}
          {chip("hasSale","Hosts a sale")}
          {chip("hasList","Has a plant list")}
          {planTotal>0 && chip("planMatch","Has plants from my plan")}
        </div>

        <div className="count">
          {shown.length} of {vendors.length} listings
          {centre ? " · distances measured from your plan's mapped area"
                  : " · draw your plot in a Planting Plan to sort by distance"}
        </div>

        {focusId && !shown.some(v=>v.id===focusId) && vendorById[focusId] && (
          <div className="shopunver" style={{borderLeftColor:"var(--sage-d)",background:"#f4f7ee",
                                             color:"var(--sage-d)",marginBottom:12}}>
            Showing <b>{vendorById[focusId].name}</b> from the map — it doesn’t match the filters below.
            {" "}<a href="#" onClick={e=>{e.preventDefault(); setFocusId(null);}}>Clear</a>
          </div>
        )}

        {shown.length===0 && !focusId
          ? <div className="empty">No listings match those filters.</div>
          : listed.map(v=>(
              <ShopCard key={v.id} v={v} org={orgById[v.orgId]}
                        saleCount={salesByVendor[v.id]||0} distance={distOf[v.id]}
                        forceOpen={v.id===focusId}
                        inv={invOf(v.id)} planTotal={planTotal} plantById={plantById}
                        rows={(vendorPlants||[]).filter(x=>x.vendorId===v.id)} />
            ))}

        <div style={{fontFamily:"'Space Mono'",fontSize:11,color:"var(--faint)",marginTop:18,lineHeight:1.6}}>
          Every listing is compiled from public directories and the vendors' own sites, and is marked unverified
          until confirmed directly. Seed libraries mostly stock donated vegetable and flower seed — their native
          share is unconfirmed. Call ahead; sale dates and stock move.
        </div>
      </>}
    </div>
  );
}
const PAGES=[["db","Database"],["plan","My Plans"],["shops","Shops & Seed"],["guide","Scoring Guide"],["data","Raw Data"],["grants","Grant Finder"],["about","About"]];
// S2b: what a signed-out visitor may see. plants / vendors / sales / organizations
// all carry public SELECT policies, so these pages work with no session at all.
// Grant Finder is NOT here on purpose — its tables are authenticated-read only
// (HANDOFF §16), so a public Grant Finder would render an empty catalog.
const PUBLIC_PAGES=["db","shops","guide","about"];
const isPublicPage=k=>PUBLIC_PAGES.includes(k);
// palette for plan pills; new plans cycle through these
const PLAN_COLORS=["#6b8f5a","#b5651d","#4a7a96","#9c6b9e","#c99a2e","#7a8b3f","#a5504d","#4f8a7b"];
// readable text color (dark/light) for a given hex background
function textOn(hex){
  const h=(hex||"#6b8f5a").replace("#",""); const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>150 ? "#2b2a22" : "#fff";
}

/* ── Landing page (shown once, to signed-out first-time visitors) ─────────
   S2b opened the Database and Shops pages to guests, so the first thing a
   visitor meets should explain what this is and let them choose how to enter,
   rather than a bare sign-in form. The choice is remembered in localStorage so
   it never nags twice. */
function Landing({onGuest, onSignIn, onCreate, plantCount, vendorCount}){
  return (
    <div className="landing">
      <div className="lwrap">
        <div className="acc">Native Food Forest</div>
        <h1>Plant a food forest that has roots.</h1>
        <p className="lead">
          A working reference for gardeners and growers in Upstate New York: {plantCount
            ? plantCount.toLocaleString() : "2,400+"} plants scored on their nativity and how
          well they feed people and wildlife, and {vendorCount || "40+"} regional nurseries,
          seed companies and free seed libraries that actually sell them.
        </p>
        <div className="lgrid">
          <div className="lcard">
            <div className="n">01</div>
            <b>Browse the plants</b>
            <p>Every species scored on edibility, ecology, materials and medicine, weighted
               by how native it is to your state — with sources and evidence tiers shown.</p>
          </div>
          <div className="lcard">
            <div className="n">02</div>
            <b>Find where to buy</b>
            <p>Regional nurseries, conservation-district seedling sales and free seed
               libraries, on a map, with a calendar of the one-weekend-a-year plant sales.</p>
          </div>
          <div className="lcard">
            <div className="n">03</div>
            <b>Build a plan</b>
            <p>Group plants into forest layers, map your plot, phase the planting over
               seasons, and get a maintenance and budget schedule. This part needs an account.</p>
          </div>
        </div>
        <div className="lacts">
          <button className="primary" onClick={onGuest}>Continue without an account</button>
          <button onClick={onSignIn}>Sign in</button>
          <button onClick={onCreate}>Create an account</button>
        </div>
        <p className="lnote">
          Browsing the plant database and the shop directory needs no account. An account
          only stores <b>your plans</b>, so they follow you between devices.
        </p>
      </div>
    </div>
  );
}

function App(){
  const [page,setPage]=useState("db");
  const [menu,setMenu]=useState(false);
  const [state,setState]=useState("NY");
  const [plants,setPlants]=useState([]);
  const [plans,setPlans]=useState([]);          // [{id,name,color}]
  const [planItems,setPlanItems]=useState([]);  // [{planId,plantId}]
  const [curPlan,setCurPlan]=useState(null);    // plan currently shown on the My Plans page
  const [loadErr,setLoadErr]=useState(null);
  const [vendors,setVendors]=useState([]);      // Shops & Seed
  const [sales,setSales]=useState([]);
  const [orgs,setOrgs]=useState([]);
  const [vendorPlants,setVendorPlants]=useState([]);
  const [shopTab,setShopTab]=useState("dir"); // lifted so the Map tab can use the wide layout
  // landing: shown to signed-out visitors until they choose how to enter
  const [landed,setLanded]=useState(()=>{ try{ return localStorage.getItem("ff-landed")==="1"; }catch(e){ return false; } });
  const [authMode,setAuthMode]=useState("in");
  const land=(where,mode)=>{ try{ localStorage.setItem("ff-landed","1"); }catch(e){}
    setAuthMode(mode||"in"); setLanded(true); setPage(where); };
  const [planCentre,setPlanCentre]=useState(null);   // shared by Shops and the plant card's Where to buy
  const vendorLookup=useMemo(()=>{ const m={}; vendors.forEach(v=>m[v.id]=v); return m; },[vendors]);
  useEffect(()=>{ let dead=false;
    if(!curPlan){ setPlanCentre(null); return; }
    (async()=>{ try{
      const L=await dataProvider.loadLayout(curPlan); const polys=(L&&L.polys)||[];
      let la=0,ln=0,n=0; polys.forEach(r=>r.forEach(([a,b])=>{la+=a;ln+=b;n++;}));
      if(!dead) setPlanCentre(n?{lat:la/n,lon:ln/n}:null);
    }catch(e){ if(!dead) setPlanCentre(null); } })();
    return ()=>{ dead=true; };
  },[curPlan]);
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(false);

  // track the auth session
  useEffect(()=>{
    auth.getSession().then(({data})=>{ setUser(data.session?.user||null); setAuthReady(true); });
    const { data:sub } = auth.onChange(u=>{ setUser(u); });
    return ()=> sub.subscription.unsubscribe();
  },[]);

  // load data whenever we have a signed-in user
  useEffect(()=>{
    // S2b: plants and the shop catalog are PUBLIC (RLS allows anon select), so
    // they load whether or not anyone is signed in. Only the per-user tables
    // wait for a session.
    (async()=>{
      try{ setPlants(await dataProvider.getPlants()); }
      catch(err){ console.error(err); setLoadErr(err.message||String(err)); }
    })();
    if(!user){ setPlans([]); setPlanItems([]); setCurPlan(null); }
    else (async()=>{
      try{
        const [pns, items] = await Promise.all([dataProvider.loadPlans(), dataProvider.loadPlanItems()]);
        let list=pns;
        if(list.length===0){ list=[await dataProvider.createPlan("My Plan", PLAN_COLORS[0])]; } // brand-new user
        setPlans(list); setPlanItems(items);
        setCurPlan(c=> (c && list.some(p=>p.id===c)) ? c : list[0].id);
      }catch(err){ console.error(err); setLoadErr(err.message||String(err)); }
    })();
    // Shops & Seed loads separately: it must never block or break the plant pages,
    // so a failure here only disables the Shops tab.
    (async()=>{
      try{
        const [vs, sl, og, vp] = await Promise.all([
          dataProvider.getVendors(), dataProvider.getSales(),
          dataProvider.getOrganizations(), dataProvider.getVendorPlants()]);
        setVendors(vs); setSales(sl); setOrgs(og); setVendorPlants(vp);
      }catch(err){ console.error("Shops load failed:",err); }
    })();
  },[user]);

  // membership map: plantId -> [planId,...]
  const membership=useMemo(()=>{
    const m={}; planItems.forEach(it=>{ (m[it.plantId]||(m[it.plantId]=[])).push(it.planId); }); return m;
  },[planItems]);

  const toggle=(plantId, planId)=>{
    planId = planId || curPlan; if(!planId) return;
    const have = planItems.some(it=>it.planId===planId && it.plantId===plantId);
    setPlanItems(items=> have ? items.filter(it=>!(it.planId===planId&&it.plantId===plantId)) : [...items,{planId,plantId}]); // optimistic
    (have ? dataProvider.removePlant(plantId,planId) : dataProvider.addPlant(plantId,planId))
      .catch(err=>{ console.error(err); setPlanItems(items=> have ? [...items,{planId,plantId}] : items.filter(it=>!(it.planId===planId&&it.plantId===plantId))); });
  };
  const newPlan=async(name)=>{
    const color=PLAN_COLORS[plans.length % PLAN_COLORS.length];
    const d=await dataProvider.createPlan((name&&name.trim())||("Plan "+(plans.length+1)), color);
    setPlans(ps=>[...ps,d]); setCurPlan(d.id); return d;
  };
  const renamePlan=(id,name)=>{
    const nm=(name||"").trim(); if(!nm) return;
    setPlans(ps=>ps.map(p=>p.id===id?{...p,name:nm}:p)); // optimistic
    dataProvider.renamePlan(id,nm).catch(err=>console.error(err));
  };
  const deletePlan=async(id)=>{
    await dataProvider.deletePlan(id); // membership rows cascade
    const rest=plans.filter(p=>p.id!==id);
    setPlanItems(items=>items.filter(it=>it.planId!==id));
    if(rest.length===0){ const d=await dataProvider.createPlan("My Plan", PLAN_COLORS[0]); setPlans([d]); setCurPlan(d.id); }
    else { setPlans(rest); if(curPlan===id) setCurPlan(rest[0].id); }
  };
  const verifyToggle=(id,val)=>{
    setPlants(ps=>ps.map(p=>p.id===id?{...p,humanVerified:val}:p)); // optimistic
    dataProvider.setVerified(id,val).catch(err=>{ console.error(err);
      setPlants(ps=>ps.map(p=>p.id===id?{...p,humanVerified:!val}:p)); }); // revert on failure
  };
  const removeImage=(id,url)=>{
    const p=plants.find(x=>x.id===id); if(!p) return;
    const img=(p.images||[]).find(im=>im.url===url);
    const images=(p.images||[]).filter(im=>im.url!==url);
    // also drop the matching photo source (by its Commons url) so they stay in sync
    const sources=(img&&img.source)
      ? (p.sources||[]).filter(s=>!(Array.isArray(s)&&s[1]===img.source)) : (p.sources||[]);
    const prevImg=p.images, prevSrc=p.sources;
    setPlants(ps=>ps.map(x=>x.id===id?{...x,images,sources}:x)); // optimistic
    dataProvider.saveImages(id,images,sources).catch(err=>{ console.error(err);
      setPlants(ps=>ps.map(x=>x.id===id?{...x,images:prevImg,sources:prevSrc}:x)); }); // revert
  };
  const updatePlant=async(id,patch)=>{
    const updated=await dataProvider.updatePlant(id,patch); // throws on failure
    setPlants(ps=>ps.map(p=>p.id===id?updated:p));
  };
  const createPlant=async(patch)=>{
    const row=await dataProvider.insertPlant(patch); // throws on failure (incl. duplicate sci)
    setPlants(ps=>[...ps,row].sort((a,b)=>a.id-b.id));
    return row;
  };
  const go=p=>{ setPage(p); setMenu(false); };
  // "signin" is not a destination for someone who already has a session; resolve
  // it to the Database in the SAME render so no frame can fall through to the
  // router's default (which is Raw Data).
  const effPage = (user && page==="signin") ? "db" : page;
  const signOut=async()=>{ setMenu(false); await auth.signOut(); };

  // gate: wait for auth, then require sign-in
  if(!authReady) return <div className="wrap"><div className="empty">Loading…</div></div>;
  if(!user && !landed) return (
    <Landing plantCount={plants.length} vendorCount={vendors.length}
             onGuest={()=>land("db")} onSignIn={()=>land("signin","in")} onCreate={()=>land("signin","up")} />
  );
  const isAdmin = !!user && user.email === ADMIN_EMAIL;
  const navPages = (isAdmin ? [...PAGES, ["verify","Human Verify"]] : PAGES)
    .filter(([k]) => user || isPublicPage(k));   // signed out: public pages only

  return (
    <div>
      <div className="topbar">
        <div className="brand">
          <span className="acc">Native Plant Database</span>
          <h1>Food Forest Planner</h1>
        </div>
        <button className="ham" aria-label="Menu" onClick={()=>setMenu(true)}><i></i><i></i><i></i></button>
      </div>

      <div className={"menu"+(menu?" open":"")}>
        <div className="scrim" onClick={()=>setMenu(false)}></div>
        <div className="panel">
          <div className="ttl">Navigate</div>
          {navPages.map(([k,label],i)=>(
            k==="plan" ? (
              <React.Fragment key={k}>
                <button className={effPage==="plan"?"active":""} onClick={()=>go("plan")}>
                  {label}<span className="num">0{i+1}</span>
                </button>
                {plans.map(pn=>(
                  <button key={pn.id} className={"plannav"+(page==="plan"&&curPlan===pn.id?" active":"")}
                    onClick={()=>{ setCurPlan(pn.id); go("plan"); }}>
                    <span className="dot" style={{background:pn.color}}></span>
                    <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pn.name}</span>
                    <span className="num" style={{marginLeft:"auto"}}>{planItems.filter(it=>it.planId===pn.id).length}</span>
                  </button>
                ))}
                <button className="plannav newp" onClick={async()=>{ const nm=prompt("Name your new plan:",""); if(nm===null) return; try{ await newPlan(nm); go("plan"); }catch(e){ alert("Couldn't create plan: "+(e.message||e)); } }}>+ New plan</button>
              </React.Fragment>
            ) : (
              <button key={k} className={effPage===k?"active":""} onClick={()=>go(k)}>
                {label}<span className="num">0{i+1}</span>
              </button>
            )
          ))}
          <button className="close" onClick={()=>setMenu(false)}>Close ✕</button>
          <div className="userbar">
            {user ? <>
              <span className="em" title={user.email}>{user.email}</span>
              <button onClick={signOut}>Sign out</button>
            </> : <>
              <span className="em">Browsing as a guest</span>
              <button onClick={()=>{ setAuthMode("in"); go("signin"); }}>Sign in</button>
            </>}
          </div>
        </div>
      </div>

      <div className={"wrap"+(page==="plan"||page==="grants"||(page==="shops"&&shopTab==="map")?" wide":"")}>
        {loadErr ? (
          <div className="empty" style={{borderColor:"var(--red)",color:"var(--ink)"}}>
            <b>Couldn't reach Supabase.</b>
            <div style={{margin:"8px 0",fontFamily:"'Space Mono'",fontSize:12,color:"var(--red)"}}>{loadErr}</div>
            Check that you pasted your <b>Project URL</b> and <b>anon key</b> in the CONFIG block,
            that the <b>Email</b> provider is enabled, and that you ran both SQL files.
          </div>
        ) : (!user && !isPublicPage(effPage)) ? (
          effPage==="signin" ? (
          <div>
            <div className="pagehead">
              <div className="eye">Your account</div>
              <h2>Sign in or create an account</h2>
              <p>Only your plans need an account. Everything else on the site is open.</p>
            </div>
            <Auth initialMode={authMode}/>
          </div>
          ) : (
          <div>
            <div className="pagehead">
              <div className="eye">Sign in required</div>
              <h2>{(PAGES.find(([k])=>k===effPage)||[,"This page"])[1]} needs an account</h2>
              <p>Your plans are saved to your account so they follow you between devices.
                 Browsing the plant database and the shop directory needs no account at all.</p>
            </div>
            <Auth/>
          </div>
          )
        ) : plants.length===0 ? <div className="empty">Loading plants…</div> : (
          effPage==="db" ? <Database plants={plants} state={state} setState={setState} plans={plans} membership={membership} toggle={toggle}
                                  sources={vendorPlants} vendorById={vendorLookup} centre={planCentre}
                                  onGoShops={()=>go("shops")} /> :
          effPage==="plan" ? <MyPlan plants={plants} state={state} plans={plans} planItems={planItems} curPlan={curPlan} setCurPlan={setCurPlan} membership={membership} toggle={toggle} newPlan={newPlan} renamePlan={renamePlan} deletePlan={deletePlan} go={go} /> :
          effPage==="shops" ? <Shops vendors={vendors} sales={sales} orgs={orgs} plans={plans}
                                  vendorPlants={vendorPlants} plants={plants} planItems={planItems}
                                  curPlan={curPlan} isAdmin={isAdmin}
                                  tab={shopTab} setTab={setShopTab} /> :
          effPage==="guide" ? <ScoringGuide /> :
          effPage==="about" ? <About /> :
          effPage==="grants" ? <GrantFinder curPlan={curPlan} /> :
          (effPage==="verify" && isAdmin) ? <VerifyPage plants={plants} state={state} plans={plans} membership={membership} toggle={toggle} verifyToggle={verifyToggle} removeImage={removeImage} updatePlant={updatePlant} createPlant={createPlant} /> :
          <RawData plants={plants} state={state} />
        )}
        <footer className="disclaimer">The contents of this website, such as text, graphics, images, and other material contained on this site (“Content”) are for informational purposes only. The Content is not intended to be a substitute for professional medical advice, diagnosis, or treatment. Caution must be used when utilizing any Content from this website and all Content must be verified by a reliable source before use. The creators of this website accept no liability or responsibility should any damage or injury occur as a result of the use that is made of the Content herein.</footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
