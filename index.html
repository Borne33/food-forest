          </div>
          <div className="pjtblwrap">
            <table className="pjtbl">
              <thead><tr><th>Category</th>{cols.map(c=><th key={c.key}>{c.label}<span>{c.sub}</span></th>)}<th>Total</th></tr></thead>
              <tbody>
                {catRows.map(id=>{ const o=costCell(id); const tot=sumRow(o); if(!tot) return null;
                  return <tr key={id}><td>{catName(id)}</td>{cols.map(c=><td key={c.key}>{o[c.key]?$(o[c.key]):"·"}</td>)}<td>{$(tot)}</td></tr>; })}
                <tr className="sub"><td>Total costs</td>{cols.map(c=><td key={c.key}>{$(totalCostCell[c.key])}</td>)}<td>{$(sumRow(totalCostCell))}</td></tr>
                {anyRev && <tr className="rev"><td>{st.revenueOn?"Revenue":"Imputed value"}</td>{cols.map(c=><td key={c.key}>{$(revCell[c.key])}</td>)}<td>{$(sumRow(revCell))}</td></tr>}
                <tr className="net"><td>Net {anyRev?"income":"cash flow"}</td>{cols.map(c=><td key={c.key}>{$(revCell[c.key]-totalCostCell[c.key])}</td>)}<td>{$(sumRow(revCell)-sumRow(totalCostCell))}</td></tr>
                {period==="year" && <tr className="cum"><td>Cumulative</td>{(()=>{ let run=0; return cols.map(c=>{ run+=revCell[c.key]-totalCostCell[c.key]; return <td key={c.key}>{$(run)}</td>; }); })()}<td></td></tr>}
              </tbody>
            </table>
          </div>
          <div className="pphint" style={{marginTop:8}}>{showTime?"Fully-loaded includes your own labor time valued at $"+st.labor.yourRate+"/h.":"Cash view shows only out-of-pocket spending"+(st.labor.hiredPct?` (incl. ${st.labor.hiredPct}% hired labor)`:" (your own labor excluded)")+"."} {anyRev?"":"Add a yield estimate under Assumptions for an income statement."}</div>
        </div>
      )}

      {tab==="assume" && (
        <div className="pjassume">
          <div className="ppcard">
            <h4>Timeline &amp; rates</h4>
            <div className="pjrow"><label>Start year</label>{num(st.startYear,v=>set("startYear",v||new Date().getFullYear()))}</div>
            <div className="pjrow"><label>Horizon (years)</label>{num(st.horizon,v=>set("horizon",Math.max(1,Math.min(15,v||5))))}</div>
            <div className="pjrow"><label>Your time rate ($/h)</label>{num(st.labor.yourRate,v=>setLabor("yourRate",v||0))}</div>
            <div className="pjrow"><label>Hired labor rate ($/h)</label>{num(st.labor.hiredRate,v=>setLabor("hiredRate",v||0))}</div>
            <div className="pjrow"><label>% labor hired out</label>{num(st.labor.hiredPct,v=>setLabor("hiredPct",Math.max(0,Math.min(100,v||0))))}</div>
            <div className="pphint">Blended labor rate: <b>${Math.round(blended)}/h</b> · {Math.round(M.totalHours)} h total.</div>
          </div>
          <div className="ppcard">
            <h4>Yield / income</h4>
            <label className="pjchk"><input type="checkbox" checked={st.revenueOn} onChange={e=>setSt(o=>({...o,revenueOn:e.target.checked, imputedOn:e.target.checked?false:o.imputedOn}))}/> Model produce <b>sales</b> (income)</label>
            <label className="pjchk"><input type="checkbox" checked={st.imputedOn} onChange={e=>setSt(o=>({...o,imputedOn:e.target.checked, revenueOn:e.target.checked?false:o.revenueOn}))}/> Value harvest as <b>grocery savings</b> (personal use)</label>
            <div className="pjrow"><label>Yield factor ×</label>{num(st.yieldFactor,v=>set("yieldFactor",v||0),0.1)}</div>
            <div className="pphint">Rough estimate: mature edible plants yield ~${YIELD_VALUE.Tree}/tree, ${YIELD_VALUE.Shrub}/shrub, ${YIELD_VALUE.Groundcover}/groundcover per year, ramping to full at each plant's years-to-fruit. Tune with the factor.</div>
          </div>
          <div className="ppcard wide">
            <h4>Cost categories</h4>
            <table className="pjcats"><tbody>
              {(st.cats||[]).map((c,i)=>(
                <tr key={c.id}>
                  <td><input value={c.name} onChange={e=>setSt(o=>({...o,cats:o.cats.map((x,j)=>j===i?{...x,name:e.target.value}:x)}))}/></td>
                  <td className="ty">{c.type==="plantStock"?"per plant":c.type==="labor"?"from scope":c.type==="perSqFtOnce"?"$/sqft once":c.type==="perSqFtAnnual"?"$/sqft·yr":c.type==="annual"?"$/yr":c.type==="contingencyPct"?"% of costs":"one-time"}</td>
                  <td>{(c.type==="plantStock"||c.type==="labor")?<span className="pphint">auto</span>:<input type="number" step={c.type==="perSqFtOnce"||c.type==="perSqFtAnnual"?0.01:1} value={c.rate} onChange={e=>setSt(o=>({...o,cats:o.cats.map((x,j)=>j===i?{...x,rate:Number(e.target.value)}:x)}))} className="pjnum"/>}</td>
                  <td>{c.type==="oneTime"?<span className="pphint">yr {c.year||1}</span>:""}</td>
                  <td>{(c.type==="plantStock"||c.type==="labor")?"":<button className="rmbtn" onClick={()=>setSt(o=>({...o,cats:o.cats.filter((_,j)=>j!==i)}))}>✕</button>}</td>
                </tr>
              ))}
            </tbody></table>
            <button className="addbtn2" onClick={()=>setSt(o=>({...o,cats:[...o.cats,{id:"c"+Date.now(),name:"New cost",type:"oneTime",rate:0,year:1}]}))}>+ Add one-time cost</button>
            <button className="addbtn2" onClick={()=>setSt(o=>({...o,cats:[...o.cats,{id:"c"+Date.now(),name:"New annual cost",type:"annual",rate:0}]}))}>+ Add annual cost</button>
          </div>
          <div className="ppcard wide">
            <h4>Per-plant prices ($ each) — defaults by type; override any</h4>
            <div className="pjprices">
              {chosen.map(p=>(
                <div className="pjprow" key={p.id}>
                  <span className="nm" onClick={()=>openDetail(p)} title="Open card">{p.common} <i>({p.type})</i></span>
                  <input type="number" step={1} value={st.prices[p.id]!=null?st.prices[p.id]:(PLANT_PRICE[p.type]||10)}
                    onChange={e=>setSt(o=>({...o,prices:{...o.prices,[p.id]:Number(e.target.value)}}))} className="pjnum"/>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MyPlan({plants, state, plans, planItems, curPlan, setCurPlan, membership, toggle, newPlan, renamePlan, deletePlan, go}){
  const [detail,setDetail]=useState(null);
  const [view,setView]=useState("layers"); // layers | plant | harvest | maint | project | soil | risk
  const [phases,setPhases]=useState({});   // {plantId: 1..10} for the current plan (lives in the plan layout)
  const [phaseFilter,setPhaseFilter]=useState("all"); // "all" | number | "none" — Forest Layers filter
  const [layoutCounts,setLayoutCounts]=useState({}); // {plantId:qty} from the Planting Plan (for Project Plan)
  // PB: phase scheduling is shared — the Planting Plan sets quantities per phase,
  // the Scope tab sets when each phase happens. One copy, one source of truth.
  const [phaseMeta,setPhaseMeta]=useState(()=>emptyPhaseMeta(BASE_PHASES));
  const [layoutArea,setLayoutArea]=useState(0);       // mapped area in sq ft (for Project Plan)
  // load layout-derived data for the current plan (localStorage instant, then
  // Supabase). The Planting Plan's Plants tab is the sole writer; here we read
  // phases (layer filter), counts and mapped area (Project Plan).
  useEffect(()=>{ setPhases({}); setPhaseFilter("all"); setLayoutCounts({}); setLayoutArea(0); let cancelled=false;
    const areaOf=polys=>{ if(!(window.L&&L.GeometryUtil&&L.GeometryUtil.geodesicArea)||!polys) return 0;
      const m2=polys.reduce((a,r)=>(!r||r.length<3)?a:a+Math.abs(L.GeometryUtil.geodesicArea(r.map(([la,ln])=>L.latLng(la,ln)))),0);
      return Math.round(m2*M2_TO_SQFT); };
    const apply=raw=>{ if(!raw) return;
      const L=migrateLayout(raw);            // same v1->v2 upgrade as the Planting Plan
      const c=L.alloc?deriveCounts(L.alloc):(L.counts||{});
      const ph=L.alloc?derivePhases(L.alloc):(L.phases||{});
      setPhases(ph); setLayoutCounts(c);
      setPhaseMeta(L.phaseMeta||emptyPhaseMeta(BASE_PHASES));
      if(L.polys) setLayoutArea(areaOf(L.polys));
    };
    try{ const s=localStorage.getItem("ff-layout-"+curPlan); if(s) apply(JSON.parse(s)); }catch(e){}
    dataProvider.loadLayout(curPlan).then(L=>{ if(!cancelled) apply(L); }).catch(()=>{});
    return ()=>{ cancelled=true; };
  },[curPlan]);
  const [soil,setSoil]=useState({tex:["Loam"], dr:["Well-drained"], phL:["Neutral (6.5–7.5)"]});
  const [soilDerived,setSoilDerived]=useState(null); // dominant profile from the Planting Plan soil map
  const lastDerived=useRef("");
  const onSoilDerived=(prof)=>{
    setSoilDerived(prof);
    const sig=JSON.stringify(prof), hasAny=prof && (prof.tex.length||prof.dr.length||prof.phL.length);
    if(sig!==lastDerived.current && hasAny){ lastDerived.current=sig;
      setSoil(s=>({ tex:prof.tex.length?prof.tex:s.tex, dr:prof.dr.length?prof.dr:s.dr, phL:prof.phL.length?prof.phL:s.phL })); }
  };
  const curObj=plans.find(p=>p.id===curPlan)||plans[0];
  const curSet=useMemo(()=>new Set(planItems.filter(it=>it.planId===curPlan).map(it=>it.plantId)),[planItems,curPlan]);
  const plan=plants.filter(p=>curSet.has(p.id)).map(p=>p.id); // plant ids in the CURRENT plan
  const curToggle=id=>toggle(id,curPlan);                      // add/remove within the current plan
  const planCount=id=>planItems.filter(it=>it.planId===id).length;
  const doNew=async()=>{ const nm=prompt("Name your new plan:",""); if(nm===null) return; try{ await newPlan(nm); }catch(e){ alert("Couldn't create plan: "+(e.message||e)); } };
  const doRename=()=>{ const nm=prompt("Rename plan:", curObj?curObj.name:""); if(nm!==null) renamePlan(curPlan,nm); };
  const doDelete=async()=>{ if(!curObj) return; if(!confirm(`Delete the plan "${curObj.name}" and its ${planCount(curPlan)} plant(s)? This can't be undone.`)) return; try{ await deletePlan(curPlan); }catch(e){ alert("Couldn't delete plan: "+(e.message||e)); } };
  const planBar=(
    <div className="planbar">
      {plans.map(pn=>(
        <button key={pn.id} className={"planchip"+(pn.id===curPlan?" on":"")} onClick={()=>setCurPlan(pn.id)}
          style={pn.id===curPlan?{background:pn.color,color:textOn(pn.color),borderColor:pn.color}:{}}>
          <span className="cdot" style={{background:pn.color}}></span>{pn.name}<span className="n">{planCount(pn.id)}</span>
        </button>
      ))}
      <button className="planchip add" onClick={doNew}>+ New plan</button>
      <span className="pgrow"></span>
      <button className="planlink" onClick={doRename}>✎ Rename</button>
      {plans.length>1 && <button className="planlink del" onClick={doDelete}>✕ Delete</button>}
    </div>
  );
  const chosen=plants.filter(p=>curSet.has(p.id));
  if(chosen.length===0){
    return (
      <div>
        {planBar}
        <div className="pagehead"><div className="eye">My Plans</div><h2>{curObj?curObj.name:"Your food forest"}</h2>
          <p>This plan is empty.</p></div>
        <div className="empty">Browse the database and add plants to <b>{curObj?curObj.name:"this plan"}</b> — the add button lets you pick which plan.<br/><br/>
          <button className="addbtn" onClick={()=>go("db")}>Go to the database</button></div>
      </div>
    );
  }
  const avg=Math.round(chosen.reduce((a,p)=>a+overall(p,state),0)/chosen.length*10)/10;
  const nfix=chosen.filter(p=>p.nf);
  const polls=chosen.filter(p=>p.pol);
  const heavy=chosen.filter(p=>["Tree"].includes(p.type) && (p.s.raw[0]>=7||p.s.cooked[0]>=7)); // fruit/nut feeders
  const groundcovers=chosen.filter(p=>p.type==="Herb"||p.type==="Fern");
  const invasive=chosen.filter(p=>nativity(p,state).v<0);

  // food-harvest coverage across the four seasons (edible plants only)
  const foodChosen=chosen.filter(isFood);
  const covered=new Set();
  foodChosen.forEach(p=>harvestSeasons(p).forEach(s=>covered.add(s)));
  const gaps=SEASONS.filter(s=>!covered.has(s));

  // symbiosis insights
  const insights=[];
  if(foodChosen.length){
    if(gaps.length===0)
      insights.push(<div className="insight" key="harv"><b>Year-round harvest.</b> Your edible plants together yield across all four seasons — nicely done.</div>);
    else
      insights.push(<div className="insight" key="harv"><b>Harvest calendar.</b> Your edible plants cover {[...SEASONS.filter(s=>covered.has(s))].join(", ")||"no seasons yet"}. Gap{gaps.length>1?"s":""}: <b>{gaps.join(", ")}</b> — see suggested additions to fill {gaps.length>1?"them":"it"}.</div>);
  }
  if(nfix.length && heavy.length)
    insights.push(<div className="insight" key="nf"><b>Nitrogen pairing.</b> Your {nfix.map(p=>p.common).join(", ")} fix nitrogen — site them near hungry fruit/nut trees like {heavy.map(p=>p.common).join(", ")} to feed them naturally.</div>);
  if(polls.length>=2)
    insights.push(<div className="insight" key="pol"><b>Pollinator support.</b> {polls.length} pollinator plants in your plan will boost fruit set across the whole guild; stagger their bloom for season-long coverage.</div>);
  if(groundcovers.length)
    insights.push(<div className="insight" key="gc"><b>Living ground layer.</b> {groundcovers.map(p=>p.common).join(", ")} can carpet the soil to suppress weeds and hold moisture under your taller plants.</div>);
  if(invasive.length)
    insights.push(<div className="insight" key="inv" style={{borderColor:"var(--red)",background:"#f6e3df"}}><b>Heads up.</b> {invasive.map(p=>p.common).join(", ")} scored as invasive in {STATE_NAMES[state]} — consider removing it from your plan.</div>);
  if(!nfix.length)
    insights.push(<div className="insight" key="nonf"><b>No nitrogen source yet.</b> Adding a nitrogen-fixer would help feed the rest of your plan with less fertilizer.</div>);

  // suggestions: top-scoring plants not in plan, prioritizing missing functions
  const notIn=plants.filter(p=>!plan.includes(p.id) && nativity(p,state).v>=0);
  const ranked=[...notIn].sort((a,b)=>overall(b,state)-overall(a,state));
  const suggestions=[];
  const pushSugg=(p,why)=>{ if(p && !suggestions.find(s=>s.p.id===p.id)) suggestions.push({p,why}); };
  if(!nfix.length) pushSugg(ranked.find(p=>p.nf),"adds nitrogen fixing");
  if(!polls.length) pushSugg(ranked.find(p=>p.pol),"adds pollinator support");
  if(!groundcovers.length) pushSugg(ranked.find(p=>p.type==="Herb"||p.type==="Fern"),"adds a ground layer");
  for(const g of gaps) pushSugg(ranked.find(p=>isFood(p)&&harvestSeasons(p).has(g)),"fills the "+g.toLowerCase()+" harvest gap");
  for(const p of ranked){ if(suggestions.length>=6) break; pushSugg(p,"high overall score for "+state); }

  // whole-forest category scores (average per category × 10, so each is out of 100)
  const catAvg=k=>Math.round(chosen.reduce((a,p)=>a+p.s[k][0],0)/chosen.length*10);
  const CAT_KEYS=[["raw","Edible Raw"],["cooked","Edible Cooked"],["life","Lifecycle"],["eco","Ecology"],["materials","Materials"],["med","Medicinal"]];
  // overall soil fit (from the Soil Examination view's current profile)
  const soilSel={tex:soil.tex, dr:soil.dr, ph:PH_BANDS.filter(b=>soil.phL.includes(b.label))};
  const avgSoilFit=chosen.length?Math.round(chosen.reduce((a,p)=>a+soilFit(p,soilSel).pct,0)/chosen.length):0;
  const nTypes=new Set(chosen.map(p=>p.type)).size;
  const NEUTRAL={bg:"#ece7d7", fg:"var(--ink)"};
  const scoreBox=(label,v)=>({label, val:v, bg:bandColor(v), fg:bandText(v)});
  const sfC=pctColor(avgSoilFit);
  const summaryBoxes=[
    {label:"Overall Score", val:avg, bg:bandColor(avg), fg:bandText(avg)},
    scoreBox("Edible Raw",catAvg("raw")), scoreBox("Edible Cooked",catAvg("cooked")),
    scoreBox("Lifecycle",catAvg("life")), scoreBox("Ecology",catAvg("eco")),
    scoreBox("Materials",catAvg("materials")), scoreBox("Medicinal",catAvg("med")),
    {label:"Plants", val:chosen.length, ...NEUTRAL}, {label:"Layers/types", val:nTypes, ...NEUTRAL},
    {label:"N-fixers", val:nfix.length, ...NEUTRAL}, {label:"Pollinator", val:polls.length, ...NEUTRAL},
    {label:"Overall Soil Fit", val:avgSoilFit+"%", bg:sfC, fg:sfC==="var(--yellow)"?"#2b2a22":"#fff"},
  ];

  // phase filter (Forest Layers): distinct phases present in the plan + an unphased bucket
  const phaseVals=[...new Set(chosen.map(p=>phases[p.id]).filter(n=>n>=1))].sort((a,b)=>a-b);
  const hasUnphased=chosen.some(p=>!phases[p.id]);
  const layerChosen = phaseFilter==="all" ? chosen
    : phaseFilter==="none" ? chosen.filter(p=>!phases[p.id])
    : chosen.filter(p=>phases[p.id]===phaseFilter);

  return (
    <div>
      {planBar}
      <div className="pagehead"><div className="eye">My Plans · {chosen.length} plants</div>
        <h2>{curObj?curObj.name:"Your food forest"}</h2>
        <p>Layers, soil fit, and risks for the plants in this plan.</p></div>

      <div className="viewtoggle">
        <button className={view==="layers"?"on":""} onClick={()=>setView("layers")}>Forest Layers</button>
        <button className={view==="plant"?"on":""} onClick={()=>setView("plant")}>Planting Plan</button>
        <button className={view==="harvest"?"on":""} onClick={()=>setView("harvest")}>Harvest</button>
        <button className={view==="maint"?"on":""} onClick={()=>setView("maint")}>Maintenance</button>
        <button className={view==="project"?"on":""} onClick={()=>setView("project")}>Project Plan</button>
        <button className={view==="soil"?"on":""} onClick={()=>setView("soil")}>Soil Examination</button>
        <button className={view==="risk"?"on":""} onClick={()=>setView("risk")}>Risk Register</button>
      </div>

      {view==="layers" && (<React.Fragment>
        <div className="stats">
          {summaryBoxes.map(b=>(
            <div className="stat" key={b.label}>
              <div className="lab">{b.label}</div>
              <div className="v" style={{background:b.bg, color:b.fg}}>{b.val}</div>
            </div>
          ))}
        </div>

        <div className="foresttriad">
          <div style={{gridArea:"ins"}}>
            <div className="pagehead" style={{border:0,margin:"0 0 8px",padding:0}}><div className="eye">Symbiosis insights</div></div>
            {insights}
          </div>
          <div style={{gridArea:"layers"}}>
            <div className="pagehead" style={{border:0,margin:"0 0 10px",padding:0}}><div className="eye">Forest layers</div></div>
            {phaseVals.length>0 && (
              <div className="phasefilter">
                <span className="lb">Phase</span>
                <button className={phaseFilter==="all"?"on":""} onClick={()=>setPhaseFilter("all")}>All</button>
                {phaseVals.map(ph=><button key={ph} className={phaseFilter===ph?"on":""} onClick={()=>setPhaseFilter(ph)}>{ph}</button>)}
                {hasUnphased && <button className={phaseFilter==="none"?"on":""} onClick={()=>setPhaseFilter("none")}>Unphased</button>}
              </div>
            )}
            {layerChosen.length===0 && <div className="empty" style={{margin:0}}>No plants in {phaseFilter==="none"?"the unphased group":"phase "+phaseFilter}.</div>}
            {LAYERS.map((layer,li)=>{
              const inLayer=layerChosen.filter(p=>layer.types.includes(p.type));
              if(!inLayer.length) return null;
              return (
                <div className="layer" key={layer.name} style={{background:LAYER_BG[li],padding:"12px 12px 14px",borderRadius:6}}>
                  <h4>{layer.name}<span>{inLayer.length} plant{inLayer.length>1?"s":""}</span></h4>
                  <div className="minigrid">
                    {inLayer.map(p=><PlanMiniCard key={p.id} p={p} state={state} remove={curToggle} onOpen={setDetail} phase={phases[p.id]} />)}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{gridArea:"sug"}}>
            <div className="pagehead" style={{border:0,margin:"0 0 8px",padding:0}}><div className="eye">Suggested additions</div></div>
            {suggestions.map(({p,why})=>(
              <div className="sugg" key={p.id} style={{display:"block"}}>
                <div onClick={()=>setDetail(p)} style={{cursor:"pointer"}} title="Open card"><b>{p.common}</b> <span style={{fontStyle:"italic",color:"var(--ink2)"}}>{p.sci}</span><div className="why">{why} · scores {overall(p,state)}</div></div>
                <button className="addbtn" onClick={()=>curToggle(p.id)} style={{marginTop:6}}>+ Add</button>
              </div>
            ))}
          </div>
        </div>
      </React.Fragment>)}

      {view==="plant" && <PlantingPlan key={curPlan} chosen={chosen} state={state} planId={curPlan} openDetail={setDetail} onSoilDerived={onSoilDerived} phases={phases} setPhases={setPhases} phaseMeta={phaseMeta} setPhaseMeta={setPhaseMeta} />}

      {view==="harvest" && <HarvestView chosen={chosen} plants={plants} state={state} openDetail={setDetail} />}

      {view==="maint" && <MaintenanceView chosen={chosen} phases={phases} state={state} openDetail={setDetail} />}

      {view==="project" && <ProjectPlan key={curPlan} chosen={chosen} state={state} planId={curPlan} counts={layoutCounts} phases={phases} areaSqft={layoutArea} openDetail={setDetail} phaseMeta={phaseMeta} setPhaseMeta={setPhaseMeta} />}

      {view==="soil" && <SoilExam plants={plants} state={state} plan={plan} toggle={curToggle} soil={soil} setSoil={setSoil} soilDerived={soilDerived} openDetail={setDetail} />}

      {view==="risk" && (<React.Fragment>
        <div className="pagehead" style={{border:0,margin:"0 0 10px",padding:0}}><div className="eye">Risk register · from each plant's cautions</div></div>
        <RiskRegister chosen={chosen} />
      </React.Fragment>)}

      {detail && (
        <div className="pmodal" onClick={()=>setDetail(null)}>
          <div className="scrim"></div>
          <div className="inner" onClick={e=>e.stopPropagation()}>
            <button className="x" onClick={()=>setDetail(null)}>Close ✕</button>
            <PlantCard p={detail} state={state} plans={plans} memberOf={membership[detail.id]} toggle={toggle} defaultOpen />
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Scoring Guide page ---------- */
const GUIDE = {
  nativity:[
    [10,"Native to your selected state — best fit for local ecology."],
    [8,"Native to your broader region (e.g. the Northeast or Southeast) but not recorded in your state."],
    [5,"Native somewhere in the US, outside your region."],
    [4,"Native elsewhere in North America (Canada or Mexico) but not the US."],
    [3,"Native elsewhere in the Americas (Central or South America, or the Caribbean)."],
    [0,"Introduced from outside the Americas, but not classed as invasive."],
    [-5,"Invasive or prohibited in your area — actively harmful; avoid planting."],
  ],
  raw:[
    [10,"Excellent raw with strong evidence of safety & quality (e.g. blueberries)."],
    [9,"Good raw, well documented, minor caveats."],
    [4,"Edible raw but marginal, astringent, or limited evidence."],
    [1,"Technically raw-edible but poor/unsafe without cooking."],
    [0,"Toxic raw — must be cooked, or not eaten raw at all."],
  ],
  cooked:[
    [10,"Excellent cooked staple, strong evidence (e.g. hazelnuts)."],
    [9,"Reliable cooked food, well documented."],
    [4,"Edible cooked but minor/secondary use or thin evidence."],
    [1,"Rarely used cooked; weak evidence."],
    [0,"No meaningful cooked food use."],
  ],
  life:[
    [10,"Long-lived woody perennial — anchors a permanent food forest."],
    [8,"Hardy herbaceous/clumping perennial returning yearly."],
    [5,"Short-lived perennial or reliable self-seeder."],
    [2,"Biennial."],
    [0,"Annual — must be replanted each year (least permanence)."],
  ],
  eco:[
    [10,"Keystone ecological value — e.g. monarch host plus broad pollinator/wildlife support."],
    [8,"Strong pollinator and wildlife value, or nitrogen-fixing soil builder."],
    [5,"Moderate wildlife/pollinator value."],
    [2,"Limited ecological function."],
    [0,"Little to no ecological benefit (or net negative)."],
  ],
  materials:[

function flat(p, state){
  const nat=nativity(p,state);
  return {
    "Common Name":p.common, "Scientific Name":p.sci, "Family":p.family, "Type":p.type, "Lifecycle":p.life,
    "Overall":overall(p,state),
    "Nativity":nat.v, "Nativity Status":nat.label,
    "Edible Raw":p.s.raw[0], "Raw Evidence":TIER[p.s.raw[1]],
    "Edible Cooked":p.s.cooked[0], "Cooked Evidence":TIER[p.s.cooked[1]],
    "Lifecycle Score":p.s.life[0], "Ecology":p.s.eco[0], "Ecology Evidence":TIER[p.s.eco[1]],
    "Materials":p.s.materials[0], "Medicinal":p.s.med[0], "Medicinal Evidence":TIER[p.s.med[1]],
    "Nitrogen Fixer":p.nf?"Yes":"No", "Pollinator":p.pol?"Yes":"No",
    "Deer Resistant":p.deerResistant?"Yes":"No", "Hardiness Zones":p.hardinessZones,
    "NY Priority":p.decPriority?"Yes":"No",
    "Edible Parts":p.edibleParts, "Other Uses":p.otherUses, "Preparation":p.prep,
    "Harvest Time":p.harvest, "Sun":p.sun, "Soil":p.soil,
    "Soil pH":p.soilPh, "Soil N":p.soilN, "Soil P":p.soilP, "Soil K":p.soilK,
    "Health Risks":p.risks, "Where to Buy":p.buy,
    "Sources":p.sources.map(s=>s[1]).join(" | "),
  };
}
function download(filename, text, mime){
  const blob=new Blob([text],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}
function esc(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function RawData({plants, state}){
  const rows=plants.map(p=>flat(p,state));
  const cols=Object.keys(rows[0]);
  const exportCSV=()=>{
    const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(","))).join("\n");
    download(`native-food-forest_${state}.csv`, csv, "text/csv;charset=utf-8;");
  };
  const exportXLS=()=>{
    // Excel-readable HTML table (.xls) — opens natively in Excel, no library needed
    const th=cols.map(c=>`<th>${c}</th>`).join("");
    const trs=rows.map(r=>"<tr>"+cols.map(c=>`<td>${String(r[c]).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`).join("")+"</tr>").join("");
    const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1"><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table></body></html>`;
    download(`native-food-forest_${state}.xls`, html, "application/vnd.ms-excel");
  };
  return (
    <div>
      <div className="pagehead"><div className="eye">Raw Data · {plants.length} rows</div><h2>Spreadsheet view</h2>
        <p>Every field and score behind the app, for {STATE_NAMES[state]}. Export to use in Excel, Sheets, or your own analysis.</p></div>
      <div className="exportrow">
        <button onClick={exportCSV}>⬇ Export CSV</button>
        <button className="alt" onClick={exportXLS}>⬇ Export Excel (.xls)</button>
      </div>
      <div className="tablewrap">
        <table>
          <thead><tr>{cols.map(c=><th key={c}>{c}</th>)}</tr></thead>
          <tbody>
            {rows.map((r,i)=><tr key={i}>{cols.map(c=>
              <td key={c} className={c==="Scientific Name"?"sci":""}
                  style={c==="Overall"?{fontFamily:"Space Mono",fontWeight:700,color:bandColor(r[c])}:null}>
                {c==="Sources"?<span className="mono" style={{fontSize:11}}>{r[c].split(" | ").length} links</span>:String(r[c])}
              </td>)}</tr>)}
          </tbody>
        </table>
      </div>
      <p className="footnote">Tip: the .xls export opens directly in Microsoft Excel; the .csv works everywhere including Google Sheets.</p>
    </div>
  );
}

/* ---------- Auth screen (email + password) ---------- */
function Auth({initialMode}){
  const [mode,setMode]=useState(initialMode==="up"?"up":"in"); // in | up
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null); // {type,text}

  const submit=async()=>{
    setMsg(null);
    if(!email || !pw){ setMsg({type:"err",text:"Enter an email and password."}); return; }
    if(mode==="up" && pw.length<6){ setMsg({type:"err",text:"Password must be at least 6 characters."}); return; }
    setBusy(true);
    try{
      if(mode==="in"){
        const { error } = await auth.signIn(email,pw);
        if(error) throw error;
        // onAuthStateChange in App will pick up the session
      }else{
        const { data, error } = await auth.signUp(email,pw);
        if(error) throw error;
        if(data.session){ /* auto signed in (email confirmation off) */ }
        else setMsg({type:"ok",text:"Account created. Check your email to confirm, then sign in."});
      }
    }catch(err){ setMsg({type:"err",text:err.message||String(err)}); }
    setBusy(false);
  };
  const reset=async()=>{
    if(!email){ setMsg({type:"err",text:"Enter your email above first."}); return; }
    const { error } = await auth.resetPassword(email);
    setMsg(error?{type:"err",text:error.message}:{type:"ok",text:"Password reset email sent."});
  };

  return (
    <div className="authwrap">
      <div className="authcard">
        <div className="acc">Native Food Forest Planner</div>
        <h2>{mode==="in"?"Sign in":"Create account"}</h2>
        <p className="sub">Your plan is saved to your account, so it's there on any device you sign in from.</p>
        <div className="fld"><label>Email</label>
          <input type="email" autoComplete="email" value={email} onChange={e=>setEmail(e.target.value)}
                 onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="you@example.com" /></div>
        <div className="fld"><label>Password</label>
          <input type="password" autoComplete={mode==="in"?"current-password":"new-password"} value={pw}
                 onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••" /></div>
        <button className="authbtn" onClick={submit} disabled={busy}>
          {busy?"Working…":(mode==="in"?"Sign in":"Create account")}</button>
        {msg && <div className={"authmsg "+msg.type}>{msg.text}</div>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <button className="authtoggle" onClick={()=>{setMode(m=>m==="in"?"up":"in");setMsg(null);}}>
            {mode==="in"?"Need an account? Create one":"Have an account? Sign in"}</button>
          {mode==="in" && <button className="authtoggle" onClick={reset}>Forgot password?</button>}
        </div>
      </div>
    </div>
  );
}

      <div className="frow" style={{marginTop:8}}><label>Hardiness zones</label>{I("hardiness_zones")}</div>
      <div className="frow"><label>Years to fruit</label>{I("years_to_fruit")}</div>
      <div className="frow"><label>Min plants to fruit</label>{I("min_plants_fruit","number")}</div>

      <h5>Nativity</h5>
      {MSrow("Native states","native_states",STATES)}
      <div className="frow"><label>Native regions (auto)</label><span style={{fontFamily:"'Space Mono'",fontSize:12,color:"var(--ink2)"}}>{deriveRegions(f.native_states).join(" · ")||"—"}</span></div>

      <div className="frow"><label>Phosphorus (P)</label>{Sel("soil_p",NPK_LEVELS,true)}</div>
      <div className="frow"><label>Potassium (K)</label>{Sel("soil_k",NPK_LEVELS,true)}</div>
      {MSrow("Texture","soil_texture",TEXTURES)}

      <h5>Pictures</h5>

        <div className="listrow" key={i}>

          <input type="text" placeholder="caption" value={im.title} onChange={e=>setImg(i,"title",e.target.value)} style={{maxWidth:140}} />
          <button className="rmbtn" onClick={()=>setF(o=>({...o,images:o.images.filter((_,j)=>j!==i)}))}>✕</button>
        </div>
      ))}
      <button className="addbtn2" onClick={()=>setF(o=>({...o,images:[...o.images,{url:"",title:"",source:""}]}))}>+ Add picture</button>

      <h5>Sources</h5>

        <div className="listrow" key={i}>
          <input type="text" placeholder="label" value={s[0]} onChange={e=>setSrc(i,0,e.target.value)} style={{maxWidth:150}} />
          <input type="text" placeholder="URL" value={s[1]} onChange={e=>setSrc(i,1,e.target.value)} />
          <button className="rmbtn" onClick={()=>setF(o=>({...o,sources:o.sources.filter((_,j)=>j!==i)}))}>✕</button>
        </div>
      ))}
      <button className="addbtn2" onClick={()=>setF(o=>({...o,sources:[...o.sources,["",""]]}))}>+ Add source</button>

      {err && <div className="authmsg err" style={{marginTop:10}}>{err}</div>}
      <div><button className="save" onClick={save} disabled={busy}>{busy?"Saving…":(isNew?"Add this plant":"Save changes")}</button>
        <button className="cancel" onClick={onCancel} disabled={busy}>Cancel</button></div>
    </div>
  );
}

function VerifyPage({plants, state, plans, membership, toggle, verifyToggle, removeImage, updatePlant, createPlant}){
  const [q,setQ]=useState("");
  const [filt,setFilt]=useState("all"); // all | yes | no
  const [editingId,setEditingId]=useState(null);
  const [adding,setAdding]=useState(false);
  const [newKey,setNewKey]=useState(0);   // bump to reset the blank form
  const [added,setAdded]=useState(null);  // the plant just inserted
  const nver=plants.filter(p=>p.humanVerified).length;
  const nlow=plants.filter(isLowData).length;
  const dupe=(sci)=>plants.find(p=>(p.sci||"").trim().toLowerCase()===(sci||"").trim().toLowerCase());
  const addNew=async(_id,patch)=>{
    const d=dupe(patch.sci);
    if(d) throw new Error(`"${patch.sci}" is already in the database as "${d.common}" (id ${d.id}). Edit that plant instead.`);
    // a hand-entered plant is verified by definition — the admin just typed it in
    const row=await createPlant({...patch, human_verified:true});
    setAdded(row); setAdding(false); setNewKey(k=>k+1); setQ(row.common);
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const view=plants.filter(p=>{
    if(filt==="yes" && !p.humanVerified) return false;
    if(filt==="no" && p.humanVerified) return false;
    if(filt==="low" && !isLowData(p)) return false;
    if(q){ const s=(p.common+" "+p.sci).toLowerCase(); if(!s.includes(q.toLowerCase())) return false; }
    return true;
  });
  return (
    <div>
      <div className="pagehead">
        <div className="eye">Human Verify · {nver}/{plants.length} verified · {nlow} low-data</div>
        <h2>Verify plant data</h2>
        <p>Review each plant against its sources, then mark it <b>Human Verified</b>. Verified plants show a check in the Database. <b>{nlow}</b> plants are flagged <b>low-data</b> (thin sources or no documented use) — use the Low-data filter to prioritize them. Only your account can see this page.</p>
      </div>

      {added && (
        <div className="npok">
          ✓ Added <b>{added.common}</b> (<i>{added.sci}</i>) as plant <b>#{added.id}</b>{added.batch?<span> in batch {added.batch}</span>:null}. It's live in the Database now and marked Human Verified — it's shown below so you can keep editing it.
          <button className="editbtn" style={{marginLeft:10}} onClick={()=>setAdded(null)}>Dismiss</button>
        </div>
      )}
      <div className="npbar">
        <button className={"npbtn"+(adding?" off":"")} onClick={()=>{ setAdded(null); setAdding(a=>!a); }}>
          {adding?"✕ Cancel new plant":"+ Add new plant"}</button>
        {!adding && <span className="pphint">Hand-enter a plant that isn't in the database yet. For whole batches, use the importer pipeline instead.</span>}
      </div>
      {adding && (
        <div className="npwrap">
          <div className="npttl">New plant</div>
          <div className="npnote">
            <b>Common name</b>, <b>scientific name</b> and <b>type</b> are required; everything else can be filled in later.
            Scientific name must be unique. Native regions derive themselves from the states you pick, and the plant is saved
            marked <b>Human Verified</b> (untick it on the card below if you want to re-check it). Scores default to 0 / no evidence —
            set the six categories so the plant ranks correctly.
          </div>
          <PlantEditor key={"new"+newKey} isNew p={emptyPlant()} onSave={addNew} onCancel={()=>setAdding(false)} />
        </div>
      )}

      <div className="controls">
        <div className="fld search"><label>Search name</label>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="e.g. pawpaw or Asimina" /></div>
      </div>
      <div className="toggles">
        <button className={"chip"+(filt==="all"?" on":"")} onClick={()=>setFilt("all")}>All</button>
        <button className={"chip"+(filt==="yes"?" on":"")} onClick={()=>setFilt("yes")}>Verified</button>
        <button className={"chip"+(filt==="no"?" on":"")} onClick={()=>setFilt("no")}>Unverified</button>
        <button className={"chip"+(filt==="low"?" on":"")} onClick={()=>setFilt("low")}>⚠ Low data ({nlow})</button>
      </div>
      <div className="count">{view.length} shown</div>
      {view.map(p=>(
        <div key={p.id}>
          <PlantCard p={p} state={state} plans={plans} memberOf={membership[p.id]} toggle={toggle} />
          <div className="vbar">
            <div className="vrow">
              <label>
                <input type="checkbox" checked={!!p.humanVerified}
                       onChange={e=>verifyToggle(p.id, e.target.checked)} />
                Human Verified
              </label>
              <button className="editbtn" onClick={()=>setEditingId(editingId===p.id?null:p.id)}>
                {editingId===p.id?"Close editor":"✎ Edit data"}</button>
              {isLowData(p) && <span className="lowflag" title="Sparse record — worth enriching/verifying">⚠ Low data: {dataGaps(p).join(" · ")}</span>}
            </div>
            {editingId===p.id && <PlantEditor p={p} onSave={updatePlant} onCancel={()=>setEditingId(null)} />}
            {(p.images||[]).length>0 && (
              <div className="vphotos">
                <dt>Photos ({p.images.length}) — remove any wrong ones</dt>
                <div className="vthumbs">
                  {p.images.map((im)=>(
                    <div className="vthumb" key={im.url} title={im.title||""}>
                      <img src={im.url} alt={im.title||""} loading="lazy" />
                      <button className="rm" title="Remove this photo"
                              onClick={()=>{ if(confirm("Remove this photo (and its source) from "+p.common+"?")) removeImage(p.id, im.url); }}>✕</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div className="vsrc">
              <dt>All sources ({(p.sources||[]).length})</dt>
              {(p.sources||[]).map((s,i)=><a key={i} href={s[1]} target="_blank" rel="noreferrer">↗ {s[0]}</a>)}
            </div>
          </div>
        </div>
      ))}
      {view.length===0 && <div className="empty">No plants match those filters.</div>}
    </div>
  );
}

function MultiSelect({label, options, value, onChange}){
  const [open,setOpen]=useState(false);
  useEffect(()=>{ if(!open) return; const h=()=>setOpen(false);
    document.addEventListener("click",h); return ()=>document.removeEventListener("click",h); },[open]);
  const toggle=o=>onChange(value.includes(o)?value.filter(x=>x!==o):[...value,o]);
  return (
    <div className="msfield" onClick={e=>e.stopPropagation()}>
      <label>{label}</label>
      <div className="mscontrol" onClick={()=>setOpen(o=>!o)}>
        {value.length ? value.map(v=><span className="mschip" key={v}>{v.replace(/ \(.*/,"")}</span>) : <span className="msph">Any</span>}
        <span className="mschev">▼</span>
      </div>
      {open && (
        <div className="msmenu">
          {options.map(o=>(
            <div key={o} className={"msopt"+(value.includes(o)?" on":"")} onClick={()=>toggle(o)}>
              <span className="box">{value.includes(o)?"✓":""}</span>{o}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
/* plan multi-select (color chips, selects by plan id) for the Database filter */
function PlanFilter({plans, value, onChange}){
  const [open,setOpen]=useState(false);
  useEffect(()=>{ if(!open) return; const h=()=>setOpen(false);
    document.addEventListener("click",h); return ()=>document.removeEventListener("click",h); },[open]);
  const toggle=id=>onChange(value.includes(id)?value.filter(x=>x!==id):[...value,id]);

  return (
    <div className="msfield" onClick={e=>e.stopPropagation()}>

        <span className="mschev">▼</span>
      </div>
      {open && (
        <div className="msmenu">
          {plans.map(p=>(
            <div key={p.id} className={"msopt"+(value.includes(p.id)?" on":"")} onClick={()=>toggle(p.id)}>
              <span className="box">{value.includes(p.id)?"✓":""}</span>

          ))}
        </div>
      )}
    </div>
  );
}
function FitDot({v, label}){ return <span className={"fdot "+fitCls(v)} title={label}>{v>=1?"✓":(v>=0.5?"~":"✕")}</span>; }

function SoilExam({plants, state, plan, toggle, soil, setSoil, soilDerived, openDetail}){
  const [editing,setEditing]=useState(false);
  const [declined,setDeclined]=useState([]);
  const selTex=soil.tex, selDr=soil.dr, selPhL=soil.phL;
  // mismatch between the painted soil map (dominant) and the manual exam inputs
  const mism=[];
  if(soilDerived){
    if(soilDerived.tex.length && !soilDerived.tex.every(t=>selTex.includes(t))) mism.push(["Texture",soilDerived.tex.join(", ")]);
    if(soilDerived.dr.length && !soilDerived.dr.every(t=>selDr.includes(t))) mism.push(["Drainage",soilDerived.dr.join(", ")]);
    if(soilDerived.phL.length && !soilDerived.phL.every(t=>selPhL.includes(t))) mism.push(["pH",soilDerived.phL.map(l=>l.replace(/ \(.*/,"")).join(", ")]);
  }
  const setSelTex=v=>setSoil(s=>({...s,tex:v})), setSelDr=v=>setSoil(s=>({...s,dr:v})), setSelPhL=v=>setSoil(s=>({...s,phL:v}));

  const sel={tex:selTex, dr:selDr, ph:PH_BANDS.filter(b=>selPhL.includes(b.label))};
  const planPlants=plants.filter(p=>plan.includes(p.id)).map(p=>({p, f:soilFit(p,sel)}))
    .sort((a,b)=>b.f.pct-a.f.pct);
  const total=planPlants.length;
  const goodCount=planPlants.filter(x=>x.f.pct>=GOOD_FIT).length;
  const avgPct=total?Math.round(planPlants.reduce((a,x)=>a+x.f.pct,0)/total):0;
  const suggestions=plants.filter(p=>!plan.includes(p.id) && !declined.includes(p.id))
    .map(p=>({p, f:soilFit(p,sel)})).filter(x=>x.f.pct>=GOOD_FIT)
    .sort((a,b)=>b.f.pct-a.f.pct).slice(0,5);

  const insights=[];
  if(total){
    insights.push(<div className="sinsight" key="a"><b>{goodCount} of {total}</b> plants in your plan are a good fit ({GOOD_FIT}%+) for this soil.</div>);
    const fails={Texture:0,Drainage:0,pH:0};
    planPlants.forEach(({f})=>{ if(f.t<1)fails.Texture++; if(f.d<1)fails.Drainage++; if(f.h<1)fails.pH++; });
    const worst=Object.entries(fails).sort((a,b)=>b[1]-a[1])[0];
    if(worst[1]>0) insights.push(<div className="sinsight" key="b"><b>{worst[0]}</b> is the most common mismatch ({worst[1]} plant{worst[1]>1?"s":""}) — amend the soil or lean on the suggestions.</div>);
    const poor=planPlants.filter(x=>x.f.pct<40).map(x=>x.p.common);
    if(poor.length) insights.push(<div className="sinsight" key="c" style={{borderColor:"var(--red)"}}><b>Poor fit:</b> {poor.join(", ")} may struggle here.</div>);
    if(!poor.length && goodCount===total) insights.push(<div className="sinsight" key="d" style={{borderColor:"var(--green)"}}>Every plant in your plan suits this soil — nicely matched.</div>);
  } else {
    insights.push(<div className="sinsight" key="e">Add plants to your plan to see how well they fit this soil.</div>);
  }

  return (
    <div>
      <div className="pagehead">
        <div className="eye">Soil Exam</div><h2>Match your plan to your soil</h2>
        <p>Set your soil's texture, drainage, and pH — then see how well your plan fits and what else would thrive.</p>
      </div>

      {mism.length>0 && (
        <div className="sinsight" style={{borderColor:"var(--orange)",background:"#f6ead6",marginBottom:14}}>
          <b>Heads up — your Soil Exam doesn't match your painted soil map.</b> The map's dominant {mism.map(m=>m[0]).join(", ")} ({mism.map(m=>m[0]+": "+m[1]).join(" · ")}) differ{mism.length===1?"s":""} from the values set here. Adjust below to match, or keep your manual values.
        </div>
      )}

      {editing ? (
        <div className="soiledit">
          <div className="grid">
            <MultiSelect label="Texture" options={TEXTURES} value={selTex} onChange={setSelTex} />
            <MultiSelect label="Drainage" options={DRAINAGE} value={selDr} onChange={setSelDr} />
            <MultiSelect label="Soil pH" options={PH_BANDS.map(b=>b.label)} value={selPhL} onChange={setSelPhL} />
          </div>
          <button className="done" onClick={()=>setEditing(false)}>Done</button>
        </div>
      ) : (
        <div className="soilprof">
          <div className="eyes">Your soil profile</div>
          <div className="at"><label>Texture</label><div className="v">{selTex.join(", ")||"Any"}</div></div>
          <div className="at"><label>Drainage</label><div className="v">{selDr.join(", ")||"Any"}</div></div>
          <div className="at"><label>Soil pH</label><div className="v">{selPhL.map(l=>l.replace(/ \(.*/,"")).join(", ")||"Any"}</div></div>
          <button className="edit" onClick={()=>setEditing(true)}>Edit soil</button>
        </div>
      )}

      <div className="soilcols">
        <div className="swidget">
          <div className="wh"><span>Soil insights</span></div>
          {insights}
        </div>

        <div className="swidget">
          <div className="wh"><span>Overall soil fit · your plan</span></div>
          <div className="sfmetrics">
            <div className="sfmetric"><b style={{color:pctColor(avgPct)}}>{avgPct}%</b><span>Average fit</span></div>
            <div className="sfmetric"><b>{goodCount}/{total}</b><span>Good fits ({GOOD_FIT}%+)</span></div>
          </div>
          {total ? (
            <table className="smatrix">
              <thead><tr><th className="l">Plant</th><th>Tex</th><th>Drain</th><th>pH</th><th>Fit</th></tr></thead>
              <tbody>
                {planPlants.map(({p,f})=>(
                  <tr key={p.id}>
                    <td className="l">{p.common}<span className="ovmini" style={{background:bandColor(overall(p,state)),color:bandText(overall(p,state))}}>{overall(p,state)}</span></td>
                    <td><FitDot v={f.t} label="Texture" /></td>
                    <td><FitDot v={f.d} label="Drainage" /></td>
                    <td><FitDot v={f.h} label="pH" /></td>
                    <td><span className="fpct" style={{color:pctColor(f.pct)}}>{f.pct}%</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          ) : <div className="empty">No plants in your plan yet.</div>}
          <div style={{fontFamily:"'Space Mono'",fontSize:10,color:"var(--faint)",marginTop:9}}>✓ match · ~ near · ✕ off</div>
        </div>

        <div className="swidget">
          <div className="wh"><span>Suggested for this soil</span></div>
          {suggestions.length ? suggestions.map(({p,f})=>(
            <div className="ssug" key={p.id}>
              <div className="top" onClick={()=>openDetail&&openDetail(p)} style={{cursor:"pointer"}} title="Open card"><span className="nm">{p.common}<span className="ovmini" style={{background:bandColor(overall(p,state)),color:bandText(overall(p,state))}}>{overall(p,state)}</span></span><span className="fpct" style={{color:pctColor(f.pct)}}>{f.pct}%</span></div>
              <div className="dots"><FitDot v={f.t} label="Texture" /><FitDot v={f.d} label="Drainage" /><FitDot v={f.h} label="pH" /></div>
              <div className="acts">
                <button className="add" onClick={()=>toggle(p.id)}>✓ Add</button>
                <button onClick={()=>setDeclined(d=>[...d,p.id])}>✕ Decline</button>
              </div>
            </div>
          )) : <div style={{fontSize:13,color:"var(--faint)"}}>No more good-fit suggestions — all have been added or declined.</div>}
        </div>
      </div>
    </div>
  );
}

function useCountUp(target, dur=1400){
  const [v,setV]=useState(0);
  useEffect(()=>{ let raf, t0; const step=ts=>{ if(!t0)t0=ts; const p=Math.min(1,(ts-t0)/dur);
    setV(target*(1-Math.pow(1-p,3))); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf); },[target,dur]);
  return v;
}

/* Grant Finder — embeds the standalone "Horizon" grant-finder app (grants.html,
   self-contained w/ its own inlined catalog) in an iframe so it runs exactly as
   built while living inside the site's nav & shell. */
function GrantFinder({curPlan}){
  // prefill the finder's best-path form from the plan: food-forest project types
  // + the county reverse-geocoded from the mapped area (when it's one the finder
  // knows). Resolved once before the iframe loads so it isn't reloaded.
  const [src,setSrc]=useState(null);
  useEffect(()=>{ let done=false;
    const base="grants.html?types=habitat_restoration,carbon_offsetting,community_education";
    const finish=c=>{ if(done) return; done=true; setSrc(base+(c?"&county="+c:"")); };
    const to=setTimeout(()=>finish(null),2800);  // never block on geocoding
    (async()=>{
      try{
        const L=await dataProvider.loadLayout(curPlan); const polys=(L&&L.polys)||[];
        let la=0,ln=0,n=0; polys.forEach(r=>r.forEach(([a,b])=>{la+=a;ln+=b;n++;}));
        if(!n){ clearTimeout(to); return finish(null); }
        const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=json&zoom=8&lat="+(la/n)+"&lon="+(ln/n));
        const j=await r.json();
        const cc=(((j.address||{}).county)||"").toLowerCase().replace(/\s+county$/,"").trim();
        clearTimeout(to); finish(["monroe","ontario","wayne","erie"].includes(cc)?cc:null);
      }catch(e){ clearTimeout(to); finish(null); }
    })();
    return ()=>{ done=true; clearTimeout(to); };
  },[curPlan]);
  return (
    <div>
      <div className="pagehead" style={{margin:"0 0 10px"}}>
        <div className="eye">Companion tool</div>
        <h2>Grant Finder — Finger Lakes &amp; Western NY</h2>
        <p>Sustainability grant programmes (federal, state, county, foundation) scored against your project and
        applicant type, with a best-path comparison. Your tracker, saved filters and best-path form are saved to your
        account. Figures carry their source and last-verified date; always confirm against the funder before applying.
        {" "}<a href={src||"grants.html"} target="_blank" rel="noopener">Open full-screen ↗</a></p>
      </div>
      {src ? <iframe src={src} title="Horizon grant finder" className="grantframe"></iframe>
           : <div className="empty">Preparing the grant finder…</div>}
    </div>
  );
}

function milesBetween(a,b,c,d){
  if([a,b,c,d].some(v=>v===null||v===undefined)) return null;
  const R=3958.8, t=Math.PI/180;
  const dLa=(c-a)*t, dLo=(d-b)*t;
  const h=Math.sin(dLa/2)**2 + Math.cos(a*t)*Math.cos(c*t)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
