  const LAYER_ORDER=["Canopy","Shrub","Herbaceous","Groundcover","Vine"];
  const LAYER_COLOR={Canopy:"#4f7a3a",Shrub:"#7a8b3f",Herbaceous:"#9bbf3a",Groundcover:"#c99a2e",Vine:"#9c6b9e"};
  const layerCounts={}; LAYER_ORDER.forEach(l=>layerCounts[l]=0);
  placedPlants.forEach(p=>{ const lyr=(PP_LAYER[p.type]||{}).layer; if(lyr&&layerCounts[lyr]!=null) layerCounts[lyr]++; });
  const maxLayer=Math.max(1,...LAYER_ORDER.map(l=>layerCounts[l]));
  const supportCount=placedPlants.filter(p=>p.nf||p.pol).length;
  const supportPct=placedPlants.length?Math.round(supportCount/placedPlants.length*100):0;
  // --- #7 bill of materials + export ---
  const downloadFile=(name,type,content)=>{ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); };
  const csvCell=x=>`"${String(x==null?"":x).replace(/"/g,'""')}"`;
  const exportCSV=()=>{ const rows=[["code","common","sci","type","lat","lng"]];
    places.forEach(pl=>{ const p=byId[pl.plantId]; if(!p) return; rows.push([codes[pl.plantId],p.common,p.sci,p.type,pl.lat,pl.lng]); });
    downloadFile("planting-placements.csv","text/csv",rows.map(r=>r.map(csvCell).join(",")).join("\n")); };
  const exportGeoJSON=()=>{ const fc={type:"FeatureCollection",features:places.map(pl=>{ const p=byId[pl.plantId]||{};
    return {type:"Feature",geometry:{type:"Point",coordinates:[pl.lng,pl.lat]},properties:{code:codes[pl.plantId],common:p.common,sci:p.sci,type:p.type}}; })};
    downloadFile("planting-placements.geojson","application/geo+json",JSON.stringify(fc,null,2)); };
  const printList=()=>{ const w=window.open("","_blank"); if(!w){ alert("Allow pop-ups to print the list."); return; }
    const body=toPlace.map(p=>`<tr><td>${codes[p.id]}</td><td>${p.common}</td><td><i>${p.sci}</i></td><td style="text-align:right">${counts[p.id]||0}</td></tr>`).join("");
    w.document.write(`<!doctype html><html><head><title>Planting list</title><style>body{font-family:Georgia,serif;margin:32px;color:#2b2a22}h1{font-size:20px}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{padding:5px 8px;border-bottom:1px solid #ccc;font-size:14px}th{text-align:left;border-bottom:2px solid #2b2a22}</style></head><body><h1>Planting list</h1><table><thead><tr><th>Code</th><th>Common name</th><th>Scientific name</th><th style="text-align:right">Qty</th></tr></thead><tbody>${body}</tbody></table><p style="margin-top:14px;font-size:13px">${totalToPlace} plants total.</p></body></html>`);
    w.document.close(); w.focus(); setTimeout(()=>w.print(),250); };

  return (
    <div>
      <div className="ppsteps">
        {STEPS.map((s,i)=>(
          <React.Fragment key={s.key}>
            {i>0 && <span className="arrow">→</span>}
            <button className={"ppstep"+(step===s.key?" on":"")+(i<stepIdx?" done":"")} onClick={()=>setStep(s.key)}>
              <span className="n">{i+1}</span>{s.label}
            </button>
          </React.Fragment>
        ))}
      </div>
      <div className="ppbar">
        <button className="ppbtn ghost" disabled={stepIdx<=0} onClick={()=>setStep(STEPS[stepIdx-1].key)}>← Back</button>
        <button className="ppbtn primary" disabled={stepIdx>=STEPS.length-1} onClick={()=>setStep(STEPS[stepIdx+1].key)}>Next →</button>
        <span className="grow"></span>
        <span className="pphint" style={{marginRight:8}}>Autosaves as you go</span>
        <button className="ppbtn danger" onClick={doRestart}>⟲ Restart</button>
      </div>

      {!ready && <div className="empty">Loading your planting plan…</div>}

      {ready && step==="plants" && (
        <div>
          <div className="pphint" style={{margin:"0 0 12px"}}>Enter how many of each plant you want to place. Rows you've given a quantity are highlighted in green. Click any row to open its full card.</div>
          <div className="pplsum">
            <div className="b"><b>{totalToPlace}</b><span>plants to place</span></div>
            <div className="b"><b>{speciesChosen}</b><span>of {chosen.length} species</span></div>
            <div className="b"><b>{places.length}</b><span>already placed</span></div>
          </div>
          <div className="pphint" style={{margin:"0 0 12px"}}><b>Phase</b> sets the planting order (1 = plant first). Phases group your plan into waves — e.g. nitrogen‑fixers and overstory trees first, understory later. Filter Forest Layers by phase to see each wave. Leave blank for unphased.</div>
          <div className="pplbar">
            <button className={"ppbtn"+(showFilters||colFActive?" primary":" ghost")} onClick={()=>setShowFilters(v=>!v)}>
              ⚲ Filters{colFActive?" ("+colFActive+")":""}</button>
            <button className={"ppbtn"+(onlyChosen?" primary":" ghost")} onClick={()=>setOnlyChosen(v=>!v)}>
              {onlyChosen?"✓ Only with a quantity":"Only with a quantity"}</button>
            {(colFActive>0||qtyQ) && <button className="ppbtn ghost" onClick={()=>{ setColF({layer:"",score:"",minfruit:"",yrs:"",harvest:"",eco:"",phase:"",qty:""}); setQtyQ(""); }}>Clear filters</button>}
            {/* the header row (and its select-all checkbox) is hidden on phones,
                so bulk selection needs its own control there */}
            <button className={"ppbtn mobileonly"+(allInView?" primary":"")} onClick={toggleAll}>
              {allInView ? `✓ ${selInView} selected — deselect` : `Select all ${qtyRows.length} shown`}</button>
            {sel.size>0 && <button className="ppbtn ghost mobileonly" onClick={()=>setSel(new Set())}>Clear selection</button>}
            <span className="grow"></span>
            {totalToPlace>0 && <button className="ppbtn ghost" onClick={()=>{ if(confirm("Clear every quantity in this plan?")) setCounts({}); }}>Clear quantities</button>}
            {Object.keys(phases||{}).length>0 && <button className="ppbtn ghost" onClick={()=>{ if(confirm("Clear every phase assignment in this plan?")) setPhases&&setPhases({}); }}>Clear phases</button>}
          </div>
          {sel.size>0 && (
            <div className="pplbulk">
              <b>{sel.size} selected</b>
              <span className="sep">Bulk set phase</span>
              <span className="sep">set qty in</span>
              <select value={bulkPhase} onChange={e=>setBulkPhase(parseInt(e.target.value,10))}>
                {phaseNos.map(ph=><option key={ph} value={ph}>{(phaseMeta[ph]&&phaseMeta[ph].name)||("Phase "+ph)}</option>)}
              </select>
              <input type="number" min="0" value={bulkQty} onChange={e=>setBulkQty(parseInt(e.target.value||"0",10))} />
              <button className="ppbtn primary" onClick={()=>bulkSetQtyIn(bulkPhase,bulkQty)}>Apply</button>
              <span className="sep">move</span>
              <select value={moveFrom} onChange={e=>setMoveFrom(parseInt(e.target.value,10))}>
                {phaseNos.map(ph=><option key={ph} value={ph}>{"P"+ph}</option>)}
              </select>
              <span className="sep">→</span>
              <select value={moveTo} onChange={e=>setMoveTo(parseInt(e.target.value,10))}>
                {phaseNos.map(ph=><option key={ph} value={ph}>{"P"+ph}</option>)}
              </select>
              <button className="ppbtn" onClick={()=>bulkMovePhase(moveFrom,moveTo)}>Move</button>
              <select style={{display:"none"}} value="" onChange={e=>{}}>
                <option value="">—</option>
                {Array.from({length:PHASE_MAX},(_,k)=>k+1).map(ph=><option key={ph} value={ph}>Phase {ph}</option>)}
                <option value="clear">Clear phase</option>
              </select>
              <span className="grow"></span>
              <button className="ppbtn ghost" onClick={()=>setSel(new Set())}>Deselect all</button>
            </div>
          )}
          <div className="ppphasebar">
            <span className="sep" style={{fontFamily:"'Space Mono'",fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--faint)"}}>Phases</span>
            {phaseNos.map(ph=>(
              <button key={ph} className="ppbtn ghost" title={"Remove "+((phaseMeta[ph]&&phaseMeta[ph].name)||("phase "+ph))}
                      onClick={()=>removePhase(ph)}>{(phaseMeta[ph]&&phaseMeta[ph].name)||("P"+ph)} ✕</button>
            ))}
            <button className="ppbtn" onClick={addPhase}>+ Add phase</button>
          </div>
          <div className="pplscroll">
          <div className="pplist">
            <div className="pplhead" style={{"--ppcols":gridCols}}>
              <div className="pplcheck"><input type="checkbox" checked={allInView} onChange={toggleAll} title="Select all shown" /></div>
              {QCOLS.map(([k,label])=>(
                <div key={k} className={"pplsort"+(k==="name"?" cncell":"")+(/^ph\d+$/.test(k)||k==="total"?" ppphcol":"")+(qSort.key===k?" on":"")}
                     onClick={()=>qSortBy(k)} title={"Sort by "+label}>
                  {label}<span className="ar">{qSort.key===k?(qSort.dir===1?"▲":"▼"):"⇅"}</span>
                </div>
              ))}
            </div>
            {showFilters && (
              <div className="pplfilter" style={{"--ppcols":gridCols}}>
                <div className="pplcheck">{colFActive>0 && <button className="fx" title="Clear column filters" onClick={()=>setColF({layer:"",score:"",minfruit:"",yrs:"",harvest:"",eco:"",phase:"",qty:""})}>✕</button>}</div>
                <div className="cncell"><input placeholder="name…" value={qtyQ} onChange={e=>setQtyQ(e.target.value)} style={{width:"100%"}} /></div>
                <select value={colF.layer} onChange={e=>setCF("layer",e.target.value)}><option value="">Layer</option>{["Canopy","Shrub","Herbaceous","Groundcover","Vine"].map(l=><option key={l} value={l}>{l}</option>)}</select>
                <select value={colF.score} onChange={e=>setCF("score",e.target.value)}><option value="">Score</option><option value="80">80+</option><option value="60">60–79</option><option value="40">40–59</option><option value="lt40">&lt;40</option></select>
                <select value={colF.minfruit} onChange={e=>setCF("minfruit",e.target.value)}><option value="">Min→fruit</option><option value="self">Self‑fruitful</option><option value="partner">Needs 2+</option><option value="unknown">Unknown</option></select>
                <select value={colF.yrs} onChange={e=>setCF("yrs",e.target.value)}><option value="">Yrs→fruit</option><option value="le2">≤2</option><option value="3to5">3–5</option><option value="6plus">6+</option><option value="unknown">Unknown</option></select>
                <input placeholder="harvest…" value={colF.harvest} onChange={e=>setCF("harvest",e.target.value)} />
                <select value={colF.eco} onChange={e=>setCF("eco",e.target.value)}><option value="">Ecology</option><option value="nf">N‑fixer</option><option value="pol">Pollinator</option><option value="either">Either</option><option value="neither">Neither</option></select>
                {phaseNos.map(ph=>(
                  <select key={ph} value={colF["ph"+ph]||""} onChange={e=>setCF("ph"+ph,e.target.value)}>
                    <option value="">{(phaseMeta[ph]&&phaseMeta[ph].name)||("P"+ph)}</option>
                    <option value="has">Has qty</option><option value="none">None</option>
                  </select>
                ))}
                <select value={colF.qty} onChange={e=>setCF("qty",e.target.value)}>
                  <option value="">Total</option><option value="has">Has qty</option><option value="none">None</option></select>
              </div>
            )}
            {qtyRows.length===0 && <div className="pplrow" style={{gridTemplateColumns:"1fr",cursor:"default"}}><div className="pphint">No plants match that filter.</div></div>}
            {qtyRows.map((p,i)=>{
              const sc=overall(p,state), n=counts[p.id]||0, isSel=sel.has(p.id);
              return (
                <div className={"pplrow"+(isSel?" selrow":"")+(n?" has":(i%2?" alt":""))} key={p.id}
                     style={{"--ppcols":gridCols}} onClick={()=>openDetail(p)}>
                  <div className="pplcheck" onClick={e=>e.stopPropagation()}><input type="checkbox" checked={isSel} onChange={()=>toggleSel(p.id)} /></div>
                  <div className="cn cncell">{p.common}<i>{p.sci}</i></div>
                  <div className="fr" data-l="Layer">{(PP_LAYER[p.type]||{}).layer||p.type}</div>
                  <div data-l="Score"><span className="sc" style={{background:bandColor(sc),color:bandText(sc)}}>{sc}</span></div>
                  <div className="fr" data-l="Min → fruit">{p.minPlantsFruit?(p.minPlantsFruit>=2?p.minPlantsFruit+" plants":"Self‑fruitful"):"—"}</div>
                  <div className="fr" data-l="Yrs → fruit">{p.yearsToFruit?p.yearsToFruit:"—"}</div>
                  <div className="fr" data-l="Harvest">{nd(p.harvest)}</div>
                  <div className="eco" data-l="Ecology">{p.nf&&<span className="ecopill nf">N‑fixer</span>}{p.pol&&<span className="ecopill">Pollinator</span>}{!p.nf&&!p.pol&&<span style={{color:"var(--faint)",fontSize:12}}>—</span>}</div>
                  {phaseNos.map(ph=>{
                    const q=(alloc[p.id]||{})[ph]||0;
                    return (
                      <div className="ppqty mini" key={ph}
                           data-l={(phaseMeta[ph]&&phaseMeta[ph].name)||("Phase "+ph)}
                           onClick={e=>e.stopPropagation()}>
                        <input type="number" min="0" value={q}
                               onChange={e=>setQtyIn(p.id,ph,parseInt(e.target.value||"0",10))}/>
                      </div>
                    );
                  })}
                  <div className="pptot" data-l="Total">{n||"—"}</div>
                </div>
              );
            })}
          </div>
          </div>
        </div>
      )}

      <div className="ppmapwrap" style={{display: (ready&&step!=="plants")?"flex":"none"}}>
        <div className="ppmap" ref={mapRef}></div>
        {step==="map" && (
          <div className="ppside">
            <div className="ppcard">
              <h4>Find your site</h4>
              <div className="ppgeo">
                <input placeholder="Address or place…" value={geo} onChange={e=>setGeo(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") doGeo(); }}/>
                <button className="ppbtn" onClick={doGeo}>Go</button>
              </div>
              <div className="pphint">Use the polygon tool (top‑left of the map) to outline 1–5 areas. Edge length shows in feet as you draw. Switch Map / Satellite / Topographic at top‑right.</div>
            </div>
            <div className="ppcard">
              <h4>Mapped area · {polys.length}/5</h4>
              <div className="pptotals">
                <div className="pptot"><div className="v">{fmt(sqft)}</div><div className="l">sq ft</div></div>
                <div className="pptot"><div className="v">{acres.toFixed(3)}</div><div className="l">acres</div></div>
              </div>
            </div>
            <div className="ppcard wide">
              <h4>Your areas</h4>
              {polys.length===0 ? <div className="pphint">Nothing drawn yet. Outline an area with the polygon tool at the top‑left of the map.</div> : (
                <React.Fragment>
                  {polys.map((ring,i)=>(
                    <div className="pparea" key={i} onMouseEnter={()=>hiPoly(i,true)} onMouseLeave={()=>hiPoly(i,false)}>
                      <span className="ix">{i+1}</span>
                      <span className="sz">{fmt(ringArea(ring)*M2_TO_SQFT)} sq ft <i>· {ring.length} corners</i></span>
                      <button title="Zoom the map to this area" onClick={()=>zoomToPoly(i)}>Zoom</button>
                      <button className="del" title="Delete this area"
                        onClick={()=>{ if(confirm("Delete area "+(i+1)+" ("+fmt(ringArea(ring)*M2_TO_SQFT)+" sq ft)?")){ hiPoly(i,false); deletePolyAt(i); } }}>✕ Delete</button>
                    </div>
                  ))}
                  <button className="ppbtn ghost" style={{marginTop:8,width:"100%"}} onClick={clearPolys}>Delete all areas</button>
                  <div className="pphint" style={{marginTop:8}}>You can also reshape an area with the edit (pencil) tool on the map. Deleting an area re‑fits your painted soil map to what's left.</div>
                </React.Fragment>
              )}
            </div>
          </div>
        )}
        {step==="soil" && (
          <div className="ppside">
            {polys.length===0 && <div className="ppcard"><div className="pphint">Draw at least one area in <b>Step 2</b> first — soil paints only inside your mapped areas.</div></div>}
            <div className="ppcard">
              <h4>Soil category</h4>
              <div className="ppseg">
                {SOIL_CATS.map(c=><button key={c} className={soilCat===c?"on":""} onClick={()=>{ setSoilCat(c); setSoilTool({type:"paint",k:SOIL_DEF[c].opts[0].k}); }}>{SOIL_DEF[c].label}</button>)}
              </div>
              <div className="pphint" style={{marginTop:8}}>You paint one category at a time. A value replaces others in the <i>same</i> category but leaves the other two untouched.</div>
            </div>
            <div className="ppcard wide">
              <h4>{SOIL_DEF[soilCat].label} · legend & paint</h4>
              <div className="ppspecies pprow" style={{maxHeight:"none"}}>
                {SOIL_DEF[soilCat].opts.map(o=>(
                  <button key={o.k} className={"ppsp"+(soilTool.type==="paint"&&soilTool.k===o.k?" on":"")} onClick={()=>setSoilTool({type:"paint",k:o.k})}>
                    <span className="dot" style={{background:o.c,border:"1px solid rgba(0,0,0,.25)"}}></span>
                    <span className="nm">{o.k}</span>
                  </button>
                ))}
                <button className={"ppsp"+(soilTool.type==="erase"?" on":"")} onClick={()=>setSoilTool({type:"erase"})}><span className="dot" style={{background:"#fff",border:"1px dashed #999"}}></span><span className="nm">Erase</span></button>
                <button className={"ppsp"+(soilTool.type==="pan"?" on":"")} onClick={()=>setSoilTool({type:"pan"})}><span className="dot" style={{border:"1px solid #999",background:"transparent"}}></span><span className="nm">Pan / move map</span></button>
              </div>
            </div>
            <div className="ppcard">
              <h4>Brush size</h4>
              <div className="ppseg">{["S","M","L"].map(b=><button key={b} className={soilBrush===b?"on":""} onClick={()=>setSoilBrush(b)}>{b==="S"?"Small":b==="M"?"Medium":"Large"}</button>)}</div>
              <button className="ppbtn ghost" style={{marginTop:10,width:"100%"}} onClick={resetSoil}>Clear soil map</button>
              <div className="pphint" style={{marginTop:8}}>This map feeds your <b>Soil Exam</b> (dominant value per category); you can still adjust the exam by hand afterward.</div>
            </div>
          </div>
        )}
        {step==="place" && (
          <div className="ppside">
            <div className="ppcard">
              <h4>Place plants</h4>
              <div className="ppseg" style={{marginBottom:10}}>
                <button className={placeMode==="plant"?"on":""} onClick={()=>setPlaceMode("plant")}>Plant</button>
                <button className={placeMode==="move"?"on":""} onClick={()=>setPlaceMode("move")}>Move</button>
                <button className={placeMode==="erase"?"on":""} onClick={()=>setPlaceMode("erase")}>Remove</button>
                <button className={placeMode==="view"?"on":""} onClick={()=>setPlaceMode("view")}>Done</button>
              </div>
              <div className="pphint">{placeMode==="plant" ? (activeSp!=null ? <span>Click the map to place <b>{byId[activeSp]&&byId[activeSp].common}</b>. It keeps placing until all are down — clicks near an existing plant add another, not open its card.</span> : "Pick a species below, then click the map.") : placeMode==="move" ? "Drag any plant to reposition it." : placeMode==="erase" ? "Click any plant on the map to remove it. Hover shows a red outline; its quantity in Step 1 stays, so you can re‑place it." : "Done — explore freely: pan and zoom the map, and click any plant to open its card. Nothing gets placed or moved."}</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
                <button className="ppbtn ghost" disabled={!places.length} onClick={undoPlace}>↶ Undo last</button>
                <button className="ppbtn danger" disabled={!places.length} onClick={clearPlaces}>✕ Clear all</button>
              </div>
            </div>
            <div className="ppcard">
              <h4>Canopy legend</h4>
              <div className="ppleg">{PP_LAYER_LEGEND.map(([nm,c])=><span className="it" key={nm}><span className="sw" style={{background:c}}></span>{nm}</span>)}</div>
            </div>
            <div className="ppcard">
              <h4>Growth over time · year {growthYear}</h4>
              <div className="ppseg">{GROWTH_YEARS.map(y=><button key={y} className={growthYear===y?"on":""} onClick={()=>setGrowthYear(y)}>{y}</button>)}</div>
              <div className="pphint" style={{marginTop:7}}>Canopy circles show each plant's size at year {growthYear}. {growthYear<=1?"Year 1 — establish nitrogen‑fixers and overstory trees first.":growthYear<=5?"Early years — shrubs and herbs fill in under establishing trees.":growthYear<20?"Maturing — canopies begin to close and layers overlap.":"Mature — full canopy footprint; watch for crowding."}</div>
            </div>
            <div className="ppcard">
              <h4>Support species · target 25–35%</h4>
              <div className="ppgauge"><span className="band"></span><span className="fillg" style={{width:Math.min(100,supportPct)+"%"}}></span></div>
              <div className="pphint" style={{marginTop:7}}><b>{supportPct}%</b> of placed plants fix nitrogen or feed pollinators ({supportCount}/{placedPlants.length}). {placedPlants.length? (supportPct<25?"Consider adding more N‑fixers or pollinators.":supportPct>35?"Well supported — you have room for more productive plants.":"Nicely balanced."):""}</div>
            </div>
            <div className="ppcard">
              <h4>Plan health</h4>
              <div className="pphint">
                <b>{places.length}</b> of <b>{totalToPlace}</b> plants placed.<br/>
                Tree canopy fills <b style={{color:treePct>100?"var(--red)":"var(--sage-d)"}}>{treePct}%</b> of your mapped area.<br/>
                {soilMap && <span><b style={{color:soilFlags.size?"var(--red)":"var(--sage-d)"}}>{soilFlags.size}</b> placement{soilFlags.size===1?"":"s"} on unsuitable soil (red ring).<br/></span>}
                {shadeFlags.size>0 && <span><b style={{color:"var(--orange)"}}>{shadeFlags.size}</b> full‑sun plant{shadeFlags.size===1?"":"s"} shaded under a tree (amber ring).<br/></span>}
                <b>{polCount}</b> pollinator‑supporting · <b>{deerCount}</b> deer‑resistant (of placed).
              </div>
            </div>
            <div className="ppcard">
              <h4>Layer stacking</h4>
              {placedPlants.length===0 ? <div className="pphint">Place plants to see how they stack across forest layers.</div> :
                <div className="ppstack">
                  {LAYER_ORDER.map(l=>(
                    <div className="ppstackrow" key={l}>
                      <span className="lb">{l}</span>
                      <span className="track"><span className="fill" style={{width:Math.round(layerCounts[l]/maxLayer*100)+"%",background:LAYER_COLOR[l]}}></span></span>
                      <span className="vn">{layerCounts[l]}</span>
                    </div>
                  ))}
                </div>}
            </div>
            <div className="ppcard wide">
              <h4>Species</h4>
              <div className="ppspecies">
                {toPlace.length===0 && <div className="pphint">No counts yet — go to Step 1 and set how many of each plant you want.</div>}
                {toPlace.map(p=>{ const done=placedCount(p.id), cap=counts[p.id]||0, info=PP_LAYER[p.type]||{color:"#6f8a5f"};
                  return (
                    <div key={p.id} className={"ppsp"+(activeSp===p.id?" on":"")+(done>=cap?" done":"")} onClick={()=>setActiveSp(p.id)} style={{cursor:"pointer"}}>
                      <span className="dot" style={{background:info.color}}></span>
                      <span className="nm">{codes[p.id]} · {p.common}</span>
                      <span className="ct">{done}/{cap}</span>
                      {done>0 && <span className="ct" title={"Remove all placed "+p.common} style={{cursor:"pointer",color:"#b03a2e"}}
                        onClick={e=>{ e.stopPropagation(); if(confirm("Remove all "+done+" placed "+p.common+" from the map?")) clearSpecies(p.id); }}>✕</span>}
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="ppcard wide">
              <h4>Bill of materials</h4>
              {toPlace.length===0 ? <div className="pphint">Set plant counts in Step 1 to build your planting list.</div> : (
                <React.Fragment>
                  <table className="ppbom"><tbody>
                    {toPlace.map(p=>(
                      <tr key={p.id}><td>{codes[p.id]}</td>
                        <td>{p.common}{/^https?:\/\//.test(p.buy||"") && <a href={p.buy} target="_blank" rel="noopener"> · buy</a>}</td>
                        <td>{counts[p.id]||0}</td></tr>
                    ))}
                  </tbody></table>
                  <div className="pphint" style={{margin:"6px 0 8px"}}>{totalToPlace} plants total · {places.length} placed.</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <button className="ppbtn ghost" onClick={printList}>Print list</button>
                    <button className="ppbtn ghost" onClick={exportCSV}>CSV</button>
                    <button className="ppbtn ghost" onClick={exportGeoJSON}>GeoJSON</button>
                  </div>
                </React.Fragment>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* =====================================================================
   HARVEST VIEW — month-by-month, per-part harvest calendar for a plan.
   Reads plants.harvest_calendar ({food_type:[months]}) via p.harvestCalendar.
   ===================================================================== */
const MONTH_ABBR=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const FOOD_COLOR={ Fruit:"#dd4b3e", "Nut/Seed":"#7a5a34", Grain:"#e0b932", "Leafy Green":"#46a34a",
  Vegetable:"#6f8a5f", "Root/Tuber/Bulb":"#b5651d", "Herb/Spice":"#9c6b9e", "Tea/Drink":"#4a7a96",
  Flower:"#e8923c", "Sap/Syrup":"#9bbf3a" };
const STORABLE=new Set(["Nut/Seed","Grain","Root/Tuber/Bulb"]); // keep in the pantry past harvest
function storedMonths(months){ // months available from storage after the fresh window, through winter
  if(!months||!months.length) return [];
  const out=[]; let m=Math.max(...months);
  for(let i=0;i<5;i++){ m=m%12+1; if(months.includes(m)) break; out.push(m); if(m===3) break; }
  return out;
}

function HarvestView({chosen, plants, state, openDetail}){
  const nowMonth=new Date().getMonth()+1;
  const [filter,setFilter]=useState([]);       // food_types included; [] = all
  const [showStored,setShowStored]=useState(true);
  const active=ft=> (filter.length===0 || filter.includes(ft)) && FOOD_COLOR[ft];

  const ediblePlan=chosen.filter(p=>Object.keys(p.harvestCalendar||{}).length>0);
  const presentFts=FOOD_TYPES.filter(ft=>FOOD_COLOR[ft] && ediblePlan.some(p=>(p.harvestCalendar||{})[ft]));

  const freshAt=(p,m)=>Object.keys(p.harvestCalendar||{}).filter(ft=>active(ft)&&(p.harvestCalendar[ft]||[]).includes(m));
  const segsAt=(p,m)=>{ const segs=[]; const cal=p.harvestCalendar||{};
    Object.keys(cal).forEach(ft=>{ if(!active(ft)) return; const months=cal[ft]||[];
      if(months.includes(m)) segs.push({ft,stored:false});
      else if(showStored && STORABLE.has(ft) && storedMonths(months).includes(m)) segs.push({ft,stored:true}); });
    return segs; };

  // #1 gap finder — months with no fresh (filtered) harvest across the plan
  const gaps=[]; for(let m=1;m<=12;m++){ if(!ediblePlan.some(p=>freshAt(p,m).length)) gaps.push(m); }
  const gapSet=new Set(gaps), inPlan=new Set(chosen.map(p=>p.id));
  const suggs = gaps.length ? plants.filter(p=>!inPlan.has(p.id) && nativity(p,state).v>=0 &&
      Object.keys(p.harvestCalendar||{}).some(ft=>active(ft)&&(p.harvestCalendar[ft]||[]).some(m=>gapSet.has(m))))
      .sort((a,b)=>overall(b,state)-overall(a,state)).slice(0,5) : [];
  // #4 ready now
  const nowList=ediblePlan.map(p=>{ const fts=freshAt(p,nowMonth); return fts.length?{p,fts}:null; }).filter(Boolean);

  // #5 export / print
  const downloadFile=(name,type,content)=>{ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); };
  const exportCSV=()=>{ const rows=[["common","sci","part","months"]];
    ediblePlan.forEach(p=>Object.keys(p.harvestCalendar||{}).forEach(ft=>{ if(!active(ft)) return;
      rows.push([p.common,p.sci,ft,(p.harvestCalendar[ft]||[]).map(m=>MONTH_ABBR[m-1]).join(" ")]); }));
    downloadFile("harvest-calendar.csv","text/csv",rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n")); };
  const printCal=()=>{ const w=window.open("","_blank"); if(!w){ alert("Allow pop-ups to print."); return; }
    const hdr=MONTH_ABBR.map(m=>`<th>${m}</th>`).join("");
    const body=ediblePlan.map(p=>{ const cells=MONTH_ABBR.map((_,i)=>{ const s=segsAt(p,i+1);
      return `<td style="background:${s.length?(s[0].stored?"#e8e2d2":FOOD_COLOR[s[0].ft]):"#fff"}"></td>`; }).join("");
      return `<tr><td style="text-align:left">${p.common}</td>${cells}</tr>`; }).join("");
    w.document.write(`<!doctype html><html><head><title>Harvest calendar</title><style>body{font-family:Georgia,serif;margin:28px;color:#2b2a22}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;height:20px;font-size:11px;text-align:center;padding:2px}td:first-child,th:first-child{text-align:left;padding:2px 6px;white-space:nowrap}</style></head><body><h1>Harvest calendar</h1><table><thead><tr><th>Plant</th>${hdr}</tr></thead><tbody>${body}</tbody></table></body></html>`);
    w.document.close(); w.focus(); setTimeout(()=>w.print(),250); };

  if(!ediblePlan.length) return (
    <div>
      <div className="pagehead"><div className="eye">Harvest</div><h2>Month-by-month harvest</h2>
        <p>When each edible part of your plants is ready to pick.</p></div>
      <div className="empty">No edible plants with harvest timing in this plan yet. Add some fruit, nut, or green producers, then check back.</div>
    </div>
  );

  const monthCell=(p,m)=>{ const segs=segsAt(p,m);
    return <div className={"hvcell"+(m===nowMonth?" now":"")} key={m}>{segs.map((s,i)=>
      <span className="hvseg" key={i} title={s.ft+(s.stored?" (stored)":"")} style={{background:FOOD_COLOR[s.ft],opacity:s.stored?0.3:1}}></span>)}</div>; };

  return (
    <div>
      <div className="pagehead"><div className="eye">Harvest · {ediblePlan.length} edible plants</div>
        <h2>Month-by-month harvest</h2>
        <p>Each row is a plant; colored blocks show when each edible part is ready. Faint blocks are pantry storage. Click a plant for its card.</p></div>

      <div className="hvctrls">
        {presentFts.map(ft=>(
          <button key={ft} className={"hvchip"+(filter.includes(ft)?" on":"")}
            onClick={()=>setFilter(f=>f.includes(ft)?f.filter(x=>x!==ft):[...f,ft])}>
            <span className="sw" style={{background:FOOD_COLOR[ft]}}></span>{ft}</button>
        ))}
        {filter.length>0 && <button className="hvchip" onClick={()=>setFilter([])}>Clear filter</button>}
        <span style={{flex:"1 1 auto"}}></span>
        <button className={"hvchip"+(showStored?" on":"")} onClick={()=>setShowStored(s=>!s)}>Storage {showStored?"on":"off"}</button>
        <button className="hvchip" onClick={printCal}>Print</button>
        <button className="hvchip" onClick={exportCSV}>CSV</button>
      </div>

      {nowList.length>0 && <div className="hvnote"><b>Ready in {MONTH_ABBR[nowMonth-1]}:</b> {nowList.map(({p,fts})=>`${p.common} (${fts.join(", ")})`).join(" · ")}</div>}
      {gaps.length>0
        ? <div className="hvnote" style={{borderColor:"var(--orange)",background:"#f6ead6"}}>
            <b>Fresh-harvest gap{gaps.length>1?"s":""}:</b> {gaps.map(m=>MONTH_ABBR[m-1]).join(", ")}.
            {suggs.length>0 && <React.Fragment> Consider {suggs.map((p,i)=><React.Fragment key={p.id}>{i>0?", ":" "}<b style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>openDetail(p)}>{p.common}</b></React.Fragment>)} to help fill {gaps.length>1?"them":"it"}.</React.Fragment>}
          </div>
        : <div className="hvnote" style={{borderColor:"var(--green)",background:"#e7f0dd"}}><b>Year-round fresh harvest</b> — some part of your plan is pickable every month.</div>}

      <div className="hvtable">
        <div className="hvhead">
          <div className="cn">Plant</div>
          {MONTH_ABBR.map((m,i)=><div key={m} className={"mh"+(i+1===nowMonth?" now":"")}>{m[0]}</div>)}
        </div>
        {LAYERS.map(layer=>{ const inLayer=ediblePlan.filter(p=>layer.types.includes(p.type)); if(!inLayer.length) return null;
          return (
            <React.Fragment key={layer.name}>
              <div className="hvlayerhead">{layer.name}</div>
              {inLayer.map(p=>(
                <div className="hvrow" key={p.id} onClick={()=>openDetail(p)}>
                  <div className="cn">{p.common}<i>{p.sci}</i></div>
                  {MONTH_ABBR.map((_,i)=>monthCell(p,i+1))}
                </div>
              ))}
            </React.Fragment>
          );
        })}
      </div>

      <div className="hvlegend">
        {presentFts.map(ft=><span className="it" key={ft}><span className="sw" style={{background:FOOD_COLOR[ft]}}></span>{ft}</span>)}
        {showStored && <span className="it"><span className="sw" style={{background:"#7a5a34",opacity:0.3}}></span>from storage</span>}
      </div>
    </div>
  );
}

/* =====================================================================
   MAINTENANCE SCHEDULE — rule-based per-plant task generator.
   Timing is relative to each plant's planting year (Year 1 = the year it
   goes in the ground). These are general horticultural rules derived from
   type, lifecycle, years_to_fruit, hardiness zone and traits — sensible
   defaults, not species-specific prescriptions. Reused by the Project Plan
   (scope / schedule / budget) in a later stage.
   ===================================================================== */
const MAINT_CATS={
  Source:"#7a5a34", Plant:"#4f7a3a", Water:"#4a7a96", Mulch:"#b5651d", Protect:"#9c6b9e",
  Prune:"#7a8b3f", Feed:"#c99a2e", Divide:"#6f8a5f", Harvest:"#dd4b3e", Monitor:"#8a8577",
};
const WOODY_TYPES=new Set(["Tree","Shrub","Vine"]);
function zoneMin(hz){ const m=String(hz||"").match(/\d+/); return m?parseInt(m[0],10):5; }
function firstFruitYear(p){ const m=String(p.yearsToFruit||"").match(/\d+/); return m?parseInt(m[0],10):null; }
// coarse spring windows keyed to cold-hardiness — colder zones plant later
function plantWindow(zmin){
  if(zmin<=3) return {source:"Feb–Mar", plant:"May", prune:"Mar"};
  if(zmin<=5) return {source:"Feb–Mar", plant:"Apr–May", prune:"Mar"};
  if(zmin<=6) return {source:"Jan–Feb", plant:"Apr", prune:"Feb–Mar"};
  return {source:"Jan–Feb", plant:"Mar–Apr", prune:"Feb"};
}
function plantTasks(p){
  const z=zoneMin(p.hardinessZones), w=plantWindow(z), woody=WOODY_TYPES.has(p.type);
  const ff=firstFruitYear(p), food=isFood(p)||(p.foodTypes||[]).length>0, t=[];
  const stock = woody ? "bare-root or containerized stock"
    : (["Herb","Fern","Grass"].includes(p.type) ? "plugs, divisions, or seed" : "plugs or divisions");
  t.push({year:1, when:w.source, cat:"Source", title:"Order "+(woody?"bare-root stock":"plants / seed"),
    note:"Order "+stock+" in late winter while dormant — bare-root is cheapest and establishes well if planted promptly."});
  t.push({year:1, when:w.plant, cat:"Plant", title:"Plant out",
    note:(woody?"Plant while dormant in early spring (or fall in milder areas). ":"Plant after your last hard frost. ")+"Set at the original soil line and water in deeply."});
  t.push({year:1, when:"Apr–Sep", cat:"Water", title:"Water to establish",
    note:"Deep-soak weekly through the first growing season (more in drought). Most first-year losses are from drying out."});
  t.push({year:1, when:w.plant, cat:"Mulch", title:"Mulch, refresh yearly", recurring:true,
    note:"3–4 in of wood chips or leaf mould kept off the stem/crown; refresh each spring to hold moisture and feed soil life."});
  if(!p.deerResistant)
    t.push({year:1, when:w.plant, cat:"Protect", title:"Protect from browse",
      note:"Not deer-resistant — fit a tube, cage, or fence at planting. "+(woody?"Keep on trees ~5 years, until bark is above browse height.":"Protect until well established.")});
  if(woody)
    t.push({year:2, when:w.prune, cat:"Prune", title:"Formative / dormant pruning", recurring:true,
      note:(p.type==="Vine"?"Train to a trellis or arbor and ":"Prune for a strong scaffold and open centre; ")+"work in late winter while dormant, removing dead or crossing wood."});
  else
    t.push({year:3, when:"Oct–Apr", cat:"Divide", title:"Divide / cut back", recurring:true,
      note:"Cut back spent growth; lift and divide congested clumps every ~3 years to rejuvenate and to propagate free plants."});
  if(p.lifecycle==="Annual")
    t.push({year:1, when:w.plant, cat:"Plant", title:"Resow each year", recurring:true, note:"Annual — resow every spring, or let it self-seed and thin the volunteers."});
  else if(p.lifecycle==="Biennial")
    t.push({year:2, when:w.plant, cat:"Plant", title:"Resow every 2 years", recurring:true, note:"Biennial — flowers and seeds in year two, then dies; sow a fresh batch yearly for continuity."});
  if(p.nf)
    t.push({year:3, when:"Jun–Aug", cat:"Feed", title:"Chop-and-drop for nitrogen", recurring:true, note:"Nitrogen-fixer — cut back once or twice each summer and drop the prunings as mulch to feed nearby fruit/nut plants."});
  else if(woody && food)
    t.push({year:2, when:"Mar–Apr", cat:"Feed", title:"Spring compost topdress", recurring:true, note:"Feed young fruiting woody plants with a spring compost topdress until established; lean on N-fixers over synthetic feed."});
  if(ff){
    const partner = p.minPlantsFruit>=2 ? " Needs "+p.minPlantsFruit+"+ plants (or a compatible partner) nearby to set fruit." : "";
    t.push({year:ff, when:(p.harvest||"its season"), cat:"Harvest", title:"First harvest (≈ year "+ff+")", note:"Expect the first meaningful yield around year "+ff+"."+partner});
    t.push({year:ff, when:(p.harvest||"its season"), cat:"Harvest", title:"Annual harvest", recurring:true, note:"Harvest yearly once bearing."+partner});
  }
  return t.sort((a,b)=>a.year-b.year || a.title.localeCompare(b.title));
}

function MaintenanceView({chosen, phases, state, openDetail}){
  const [mode,setMode]=useState("plant"); // plant | year
  const [cats,setCats]=useState([]);      // category filter (empty = all)
  const byPlant=useMemo(()=>chosen.map(p=>({p, tasks:plantTasks(p)}))
    .sort((a,b)=>((phases[a.p.id]||99)-(phases[b.p.id]||99)) || a.p.common.localeCompare(b.p.common)),[chosen,phases]);
  const allCats=useMemo(()=>{ const s=new Set(); byPlant.forEach(x=>x.tasks.forEach(t=>s.add(t.cat))); return [...s].sort((a,b)=>Object.keys(MAINT_CATS).indexOf(a)-Object.keys(MAINT_CATS).indexOf(b)); },[byPlant]);
  const show=t=>cats.length===0||cats.includes(t.cat);
  const maxYear=useMemo(()=>Math.max(1,...byPlant.flatMap(x=>x.tasks.map(t=>t.year))),[byPlant]);
  const catChip=c=><span className="mtcat" style={{background:MAINT_CATS[c]}}>{c}</span>;

  const byYear=useMemo(()=>{ const rows=[];
    for(let y=1;y<=maxYear;y++){ const items=[];
      byPlant.forEach(({p,tasks})=>tasks.forEach(t=>{ if(t.year===y && show(t)) items.push({p,t}); }));
      if(items.length) rows.push({year:y, items});
    }
    // recurring tasks summarised once, after the timeline
    const rec=[]; byPlant.forEach(({p,tasks})=>tasks.forEach(t=>{ if(t.recurring && show(t)) rec.push({p,t}); }));
    return {rows, rec};
  },[byPlant,cats,maxYear]);

  const printSched=()=>{ const w=window.open("","_blank"); if(!w){ alert("Allow pop-ups to print."); return; }
    const body=byPlant.map(({p,tasks})=>`<h3>${p.common} <i>${p.sci}</i>${phases[p.id]?` — Phase ${phases[p.id]}`:""}</h3><table><tbody>${tasks.map(t=>`<tr><td>Yr ${t.year}${t.recurring?"+":""}</td><td>${t.when}</td><td><b>${t.title}</b><br>${t.note}</td></tr>`).join("")}</tbody></table>`).join("");
    w.document.write(`<!doctype html><html><head><title>Maintenance schedule</title><style>body{font-family:Georgia,serif;margin:32px;color:#2b2a22}h3{margin:18px 0 4px;font-size:16px}i{color:#666}table{border-collapse:collapse;width:100%;margin-bottom:8px}td{padding:4px 8px;border-bottom:1px solid #ddd;font-size:13px;vertical-align:top}td:first-child{white-space:nowrap;font-family:monospace}</style></head><body><h1>Plant maintenance schedule</h1>${body}</body></html>`);
    w.document.close(); w.focus(); setTimeout(()=>w.print(),250); };

  return (
    <div>
      <div className="pagehead" style={{border:0,margin:"0 0 12px",padding:0}}><div className="eye">Maintenance schedule · {chosen.length} plants</div>
        <p style={{margin:"4px 0 0"}}>Per-plant tasks — sourcing, planting, mulch, protection, pruning, feeding, division and first harvest — timed relative to each plant's <b>planting year</b> and its USDA zone{" "}({STATE_NAMES[state]}). General guidance you can adapt; concrete calendar dates come from the Project Plan → Schedule.</p></div>

      <div className="hvctrls">
        <button className={"hvchip"+(mode==="plant"?" on":"")} onClick={()=>setMode("plant")}>By plant</button>
        <button className={"hvchip"+(mode==="year"?" on":"")} onClick={()=>setMode("year")}>By year</button>
        <span style={{width:12}}></span>
        {allCats.map(c=>(
          <button key={c} className={"hvchip"+(cats.includes(c)?" on":"")} onClick={()=>setCats(f=>f.includes(c)?f.filter(x=>x!==c):[...f,c])}>
            <span className="sw" style={{background:MAINT_CATS[c]}}></span>{c}</button>
        ))}
        {cats.length>0 && <button className="hvchip" onClick={()=>setCats([])}>Clear</button>}
        <span style={{flex:"1 1 auto"}}></span>
        <button className="hvchip" onClick={printSched}>Print</button>
      </div>

      {mode==="plant" ? (
        <div className="mtsched">
          {byPlant.map(({p,tasks})=>{ const vis=tasks.filter(show); if(!vis.length) return null;
            return (
              <div className="mtplant" key={p.id}>
                <div className="mthead" onClick={()=>openDetail(p)}>
                  <b>{p.common}</b> <i>{p.sci}</i>
                  <span className="mtmeta">{p.type}{p.hardinessZones?` · zones ${p.hardinessZones}`:""}{phases[p.id]?` · Phase ${phases[p.id]}`:""}</span>
                </div>
                {vis.map((t,i)=>(
                  <div className="mttask" key={i}>
                    <span className="yr">Yr {t.year}{t.recurring?"+":""}</span>
                    {catChip(t.cat)}
                    <div className="body"><b>{t.title}</b> <span className="when">· {t.when}</span><div className="note">{t.note}</div></div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      ) : (
        <div className="mtsched">
          {byYear.rows.map(({year,items})=>(
            <div className="mtplant" key={year}>
              <div className="mthead"><b>Year {year}</b> <span className="mtmeta">{items.length} task{items.length>1?"s":""} · from each plant's planting</span></div>
              {items.map(({p,t},i)=>(
                <div className="mttask" key={i}>
                  {catChip(t.cat)}
                  <div className="body"><b onClick={()=>openDetail(p)} style={{cursor:"pointer"}}>{p.common}</b> — {t.title} <span className="when">· {t.when}{t.recurring?" · recurring":""}</span><div className="note">{t.note}</div></div>
                </div>
              ))}
            </div>
          ))}
          {byYear.rec.length>0 && (
            <div className="mtplant">
              <div className="mthead"><b>Recurring upkeep</b> <span className="mtmeta">ongoing once established</span></div>
              {byYear.rec.map(({p,t},i)=>(
                <div className="mttask" key={i}>{catChip(t.cat)}
                  <div className="body"><b onClick={()=>openDetail(p)} style={{cursor:"pointer"}}>{p.common}</b> — {t.title} <span className="when">· {t.when}</span></div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   PROJECT PLAN — Budget, Scope and Schedule for establishing the plan.
   A single pure model (computeProject) turns the plan (plants, counts,
   phases, mapped area) + editable assumptions into: a scope of work
   (tasks with hours), a schedule (tasks on a calendar), and a budget
   (per-period costs, optional revenue, cashflow). All assumptions are
   editable defaults — figures are planning estimates, not quotes.
   ===================================================================== */
const PLANT_PRICE = { Tree:25, Shrub:15, Vine:12, Herb:6, Fern:8, Grass:5, Groundcover:4 }; // $/plant defaults by type
const INSTALL_HRS = { Tree:0.75, Shrub:0.4, Vine:0.3, Herb:0.15, Fern:0.15, Grass:0.15, Groundcover:0.1 }; // labor hrs/plant to install
const YIELD_VALUE = { Tree:40, Shrub:20, Vine:15, Herb:8, Fern:3, Grass:3, Groundcover:5 }; // rough $/mature plant/yr (edible only)
const QLABEL=["Q1","Q2","Q3","Q4"];
const projPrice=(p,st)=> (st.prices&&st.prices[p.id]!=null) ? Number(st.prices[p.id]) : (PLANT_PRICE[p.type]||10);
function defaultCats(){ return [
  {id:"stock",   name:"Plant stock",                        type:"plantStock"},
  {id:"siteprep",name:"Site prep (sheet mulch, sod removal)",type:"perSqFtOnce", rate:0.15},
  {id:"amend",   name:"Soil amendments & compost",          type:"perSqFtOnce", rate:0.10},
  {id:"mulch",   name:"Mulch (annual refresh)",             type:"perSqFtAnnual",rate:0.05},
  {id:"tools",   name:"Tools & equipment",                  type:"oneTime", rate:400, year:1},
  {id:"irrig",   name:"Irrigation (drip, timers, barrels)", type:"oneTime", rate:600, year:1},
  {id:"deer",    name:"Deer / browse protection",           type:"oneTime", rate:800, year:1},
  {id:"trellis", name:"Trellises & supports",               type:"oneTime", rate:200, year:1},
  {id:"labor",   name:"Labor",                              type:"labor"},
  {id:"misc",    name:"Misc / consumables",                 type:"annual",  rate:100},
  {id:"contingency", name:"Contingency",                    type:"contingencyPct", rate:10},
]; }
function defaultProject(){ return {
  startYear:new Date().getFullYear(), horizon:5, revenueOn:false, imputedOn:false,
  labor:{ yourRate:25, hiredRate:45, hiredPct:0 }, // hiredPct = % of hours contracted out (cash)
  yieldFactor:1, prices:{}, cats:null,
}; }
function mergeProject(loaded){ const d=defaultProject(); const s={...d,...(loaded||{})};
  s.labor={...d.labor,...(loaded&&loaded.labor||{})}; s.prices={...(loaded&&loaded.prices||{})};
  s.cats=(loaded&&Array.isArray(loaded.cats)&&loaded.cats.length)?loaded.cats:defaultCats();
  s.horizon=Math.max(1,Math.min(15,s.horizon|0||5)); return s; }

function computeProject(chosen, counts, phases, areaSqft, st){
  const N=st.horizon, area=areaSqft||0;
  const hasCounts=Object.keys(counts||{}).length>0;
  const qtyOf=p=>hasCounts?(counts[p.id]||0):1;
  const pYear=p=>Math.max(1,Math.min(N, phases[p.id]||1)); // one phase per year; unphased => yr 1
  const phased=Object.keys(phases||{}).length>0;
  const totalQty=chosen.reduce((a,p)=>a+qtyOf(p),0)||1;
  const scope=[]; const S=(y,q,mo,cat,name,hours)=>{ if(y>=1&&y<=N&&hours>0) scope.push({y,q,mo,cat,name,hours:+hours.toFixed(1)}); };
  const entries=[]; const E=(y,q,catId,catName,cash,kind,timeVal)=>{ if(y>=1&&y<=N&&(cash||timeVal)) entries.push({y,q,catId,catName,cash:cash||0,timeVal:timeVal||0,kind:kind||"cost"}); };

  // --- scope of work ---
  for(let y=1;y<=N;y++){
    const newP=chosen.filter(p=>pYear(p)===y), nqty=newP.reduce((a,p)=>a+qtyOf(p),0);
    if(newP.length){
      S(y,2,4,"Plant",`Plant ${nqty} plant${nqty===1?"":"s"}`+(phased?` — Phase ${y}`:""), newP.reduce((a,p)=>a+qtyOf(p)*(INSTALL_HRS[p.type]||0.3),0));
      S(y,2,4,"Site prep",`Prepare & amend beds (${nqty} plant${nqty===1?"":"s"})`, nqty*0.4);
    }
  }
  if(area>0) S(1,1,3,"Setup","Install irrigation", Math.max(2,area*0.005));
  if(chosen.some(p=>!p.deerResistant)) S(1,2,4,"Setup","Install browse protection / fencing", 16);
  const vines=chosen.filter(p=>p.type==="Vine").length; if(vines) S(1,2,5,"Setup",`Build ${vines} trellis/support${vines===1?"":"s"}`, vines*2);
  for(let y=1;y<=N;y++){
    const est=chosen.filter(p=>pYear(p)<=y); if(!est.length) continue;
    if(area>0) S(y,2,4,"Maintenance","Mulch refresh", Math.max(1,area*0.01));
    S(y,3,6,"Maintenance",`Weeding & monitoring (${est.length} plants)`, est.length*0.25);
    const nw=chosen.filter(p=>pYear(p)===y), nwq=nw.reduce((a,p)=>a+qtyOf(p),0);
    if(nwq) S(y,3,7,"Maintenance",`Establishment watering (${nwq} new)`, nwq*0.4);
    const woody=est.filter(p=>WOODY_TYPES.has(p.type)&&pYear(p)<y);
    if(woody.length) S(y,1,2,"Prune",`Dormant pruning (${woody.length} woody)`, woody.length*0.5);
    const bearing=est.filter(p=>isFood(p)&&(y-pYear(p)+1)>=(firstFruitYear(p)||1));
    if(bearing.length) S(y,4,9,"Harvest",`Harvest & process (${bearing.length} bearing)`, bearing.length*0.6);
  }

  // --- costs ---
  for(let y=1;y<=N;y++){ const newP=chosen.filter(p=>pYear(p)===y);
    const cost=newP.reduce((a,p)=>a+qtyOf(p)*projPrice(p,st),0); E(y,2,"stock","Plant stock",cost,"cost"); }
  (st.cats||[]).forEach(cat=>{
    if(cat.type==="oneTime") E(Math.max(1,Math.min(N,cat.year||1)), cat.id==="tools"?1:2, cat.id, cat.name, +cat.rate||0, "cost");
    else if(cat.type==="perSqFtOnce"){ const total=(+cat.rate||0)*area;
      for(let y=1;y<=N;y++){ const q=chosen.filter(p=>pYear(p)===y).reduce((a,p)=>a+qtyOf(p),0); if(q) E(y,2,cat.id,cat.name,total*q/totalQty,"cost"); } }
    else if(cat.type==="perSqFtAnnual"){ for(let y=1;y<=N;y++) E(y,2,cat.id,cat.name,(+cat.rate||0)*area,"cost"); }
    else if(cat.type==="annual"){ for(let y=1;y<=N;y++) E(y,3,cat.id,cat.name,+cat.rate||0,"cost"); }
  });
  // labor from scope hours (seasonal split), split cash (hired) vs your time
  const hiredPct=Math.max(0,Math.min(100,st.labor.hiredPct||0))/100;
  const laborCat=(st.cats||[]).find(c=>c.type==="labor");
  const hrsYQ={}; scope.forEach(t=>{ hrsYQ[t.y]=hrsYQ[t.y]||[0,0,0,0]; hrsYQ[t.y][t.q-1]+=t.hours; });
  if(laborCat) for(let y=1;y<=N;y++){ const qs=hrsYQ[y]||[0,0,0,0];
    for(let q=1;q<=4;q++){ const h=qs[q-1]; if(!h) continue;
      E(y,q,"labor","Labor", h*(st.labor.hiredRate||0)*hiredPct, "cost", h*(st.labor.yourRate||0)*(1-hiredPct)); } }
  // contingency (% of that year's cash costs so far, excl. contingency)
  const cont=(st.cats||[]).find(c=>c.type==="contingencyPct");
  if(cont&&+cont.rate){ for(let y=1;y<=N;y++){ const base=entries.filter(e=>e.y===y&&e.kind==="cost").reduce((a,e)=>a+e.cash,0);
    if(base) E(y,2,"contingency","Contingency",base*(+cont.rate)/100,"cost"); } }
  // revenue / imputed savings (rough, from yield value × ramp)
  if(st.revenueOn||st.imputedOn){ const kind=st.revenueOn?"revenue":"imputed", label=st.revenueOn?"Produce sales":"Imputed harvest value";
    for(let y=1;y<=N;y++){ let val=0;
      chosen.forEach(p=>{ if(!isFood(p)) return; const age=y-pYear(p)+1, ff=firstFruitYear(p)||2;
        let f=0; if(age>=1){ if(age>=ff) f=1; else if(age>=ff-1) f=0.4; } if(f<=0) return;
        val+=(YIELD_VALUE[p.type]||5)*(st.yieldFactor||1)*qtyOf(p)*f; });
      if(val){ E(y,3,"yield",label,val*0.5,kind); E(y,4,"yield",label,val*0.5,kind); } }
  }
  return { N, entries, scope, hrsYQ, phased,
    calYear:y=>st.startYear+(y-1),
    totalHours:scope.reduce((a,t)=>a+t.hours,0) };
}


/* Per-phase plant list, opened inline from a Scope planting row. Sorting is
   LOCAL to the phase so opening one doesn't disturb another, and the component
   is keyed by phase so switching phases resets cleanly. Scheduling deliberately
   lives elsewhere (PC1) — this is a read-only view of what's in the wave. */
const PHCOLS=[["name","Plant"],["layer","Layer"],["qty","Qty"],["hours","Install h"],
  ["cost","Stock cost"],["yrs","Yrs→fruit"]];
function PhaseTable({data, openDetail, money}){
  const [sort,setSort]=useState({key:"name",dir:1});
  if(!data) return null;
  const val=(r,k)=>{ switch(k){
    case "name": return r.p.common.toLowerCase();
    case "layer": return ((PP_LAYER[r.p.type]||{}).layer||r.p.type||"").toLowerCase();
    case "qty": return r.qty;
    case "hours": return r.hours;
    case "cost": return r.cost;
    case "yrs": return r.yrs==null?9999:r.yrs;
    default: return 0; } };
  const rows=[...data.rows].sort((a,b)=>{
    const x=val(a,sort.key), y=val(b,sort.key);
    return (x<y?-1:x>y?1:0)*sort.dir || a.p.common.localeCompare(b.p.common); });
  const by=k=>setSort(s=>s.key===k?{key:k,dir:-s.dir}:{key:k,dir:1});
  return (
    <div className="phtbl" onClick={e=>e.stopPropagation()}>
      <div className="phsum">{data.rows.length} plant{data.rows.length===1?"":"s"} · {data.qty} to plant
        · {Math.round(data.hrs)} h · {money(data.cost)} stock</div>
      <div className="phhead">
        {PHCOLS.map(([k,label])=>(
          <div key={k} className={"phsort"+(k==="qty"||k==="hours"||k==="cost"||k==="yrs"?" r":"")+(sort.key===k?" on":"")}
               onClick={()=>by(k)}>{label}<span className="ar">{sort.key===k?(sort.dir===1?"▲":"▼"):"⇅"}</span></div>
        ))}
      </div>
      {rows.map(r=>(
        <div className="phrow" key={r.p.id} onClick={()=>openDetail&&openDetail(r.p)}>
          <div><b>{r.p.common}</b><i>{r.p.sci}</i></div>
          <div className="fr">{(PP_LAYER[r.p.type]||{}).layer||r.p.type}</div>
          <div className="r">{r.qty}</div>
          <div className="r">{r.hours.toFixed(1)}</div>
          <div className="r">{money(r.cost)}</div>
          <div className="r">{r.yrs==null?"—":r.yrs}</div>
        </div>
      ))}
    </div>
  );
}

function ProjectPlan({chosen, state, planId, counts, phases, areaSqft, openDetail, phaseMeta, setPhaseMeta}){
  const [st,setSt]=useState(defaultProject);
  const [ready,setReady]=useState(false);
  const [tab,setTab]=useState("summary"); // summary | scope | schedule | budget | assume
  const [period,setPeriod]=useState("year"); // year | quarter | five
  const [selYear,setSelYear]=useState(1);
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{ let cancelled=false; setReady(false);
    try{ const s=localStorage.getItem("ff-project-"+planId); if(s) setSt(mergeProject(JSON.parse(s))); }catch(e){}
    dataProvider.loadProject(planId).then(d=>{ if(cancelled) return; if(d) setSt(mergeProject(d)); setReady(true); setLoaded(true); })
      .catch(e=>{ console.error(e); if(!cancelled){ setReady(true); setLoaded(true); } });
    return ()=>{ cancelled=true; };
  },[planId]);
  const saveT=useRef(null);
  useEffect(()=>{ if(!ready) return;
    try{ localStorage.setItem("ff-project-"+planId, JSON.stringify(st)); }catch(e){}
    clearTimeout(saveT.current); saveT.current=setTimeout(()=>{ dataProvider.saveProject(planId,st).catch(e=>console.error(e)); },800);
    return ()=>clearTimeout(saveT.current);
  },[ready,planId,st]);

  const M=useMemo(()=>computeProject(chosen,counts||{},phases||{},areaSqft||0,st),[chosen,counts,phases,areaSqft,st]);

  const [openPhase,setOpenPhase]=useState(null);
  /* ---- plants in each phase, for the inline phase table ---- */
  const phaseRows=useMemo(()=>{
    const byPhase={};
    chosen.forEach(p=>{
      const ph=(phases||{})[p.id]; if(!ph) return;
      const qty=(counts||{})[p.id]||0; if(!qty) return;
      const hours=qty*(INSTALL_HRS[p.type]||0.3);
      const cost=qty*projPrice(p,st);
      const yrs=firstFruitYear(p);
      (byPhase[ph]||(byPhase[ph]=[])).push({p,qty,hours,cost,yrs});
    });
    return Object.keys(byPhase).map(Number)
      .map(ph=>{ const rows=byPhase[ph];
        return {ph, rows,
                qty:rows.reduce((a,r)=>a+r.qty,0),
                hrs:rows.reduce((a,r)=>a+r.hours,0),
                cost:rows.reduce((a,r)=>a+r.cost,0)}; })
      .sort((a,b)=>a.ph-b.ph);
  },[chosen,phases,counts,st]);
  const set=(k,v)=>setSt(o=>({...o,[k]:v}));
  const setLabor=(k,v)=>setSt(o=>({...o,labor:{...o.labor,[k]:v}}));
  const $=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString();
  const blended=(st.labor.yourRate*(1-(st.labor.hiredPct||0)/100)+st.labor.hiredRate*((st.labor.hiredPct||0)/100));

  // period columns + bucket fn
  const cols = period==="year" ? Array.from({length:M.N},(_,i)=>({key:i+1,label:"Yr "+(i+1),sub:M.calYear(i+1)}))
    : period==="quarter" ? QLABEL.map((q,i)=>({key:i+1,label:q,sub:M.calYear(selYear)}))
    : [{key:"all",label:M.N+"-yr total",sub:M.calYear(1)+"–"+M.calYear(M.N)}];
  const inScope = e => period==="quarter" ? e.y===selYear : true;
  const colOf = e => period==="year" ? e.y : period==="quarter" ? e.q : "all";
  const catRows=useMemo(()=>{ const ids=[]; M.entries.forEach(e=>{ if(e.kind==="cost"&&!ids.includes(e.catId)) ids.push(e.catId); }); return ids; },[M]);
  const catName=id=>{ const e=M.entries.find(x=>x.catId===id); return e?e.catName:id; };
  const cell=(pred)=>{ const o={}; cols.forEach(c=>o[c.key]=0);
    M.entries.forEach(e=>{ if(!inScope(e)||!pred(e)) return; o[colOf(e)]+=e.cash+(showTime?e.timeVal:0)*(e.kind==="cost"?1:0); }); return o; };
  const [showTime,setShowTime]=useState(false); // fully-loaded (include your time)
  const costCell=id=>cell(e=>e.kind==="cost"&&e.catId===id);
  const totalCostCell=cell(e=>e.kind==="cost");
  const revCell=cell(e=>e.kind==="revenue"||e.kind==="imputed");
  const anyRev=M.entries.some(e=>e.kind==="revenue"||e.kind==="imputed");
  const sumRow=o=>cols.reduce((a,c)=>a+o[c.key],0);

  // summary numbers (whole horizon)
  const totalCash=M.entries.filter(e=>e.kind==="cost").reduce((a,e)=>a+e.cash,0);
  const totalTime=M.entries.filter(e=>e.kind==="cost").reduce((a,e)=>a+e.timeVal,0);
  const totalRev=M.entries.filter(e=>e.kind==="revenue"||e.kind==="imputed").reduce((a,e)=>a+e.cash,0);
  const y1Cash=M.entries.filter(e=>e.kind==="cost"&&e.y===1).reduce((a,e)=>a+e.cash,0);
  const firstBearing=(()=>{ for(let y=1;y<=M.N;y++){ if(chosen.some(p=>isFood(p)&&(y-Math.max(1,Math.min(M.N,phases[p.id]||1))+1)>=(firstFruitYear(p)||1))) return y; } return null; })();

  const num=(val,on,step)=><input type="number" step={step||1} value={val} onChange={e=>on(e.target.value===""?"":Number(e.target.value))} className="pjnum"/>;

  return (
    <div>
      <div className="pagehead" style={{border:0,margin:"0 0 12px",padding:0}}><div className="eye">Project plan · {chosen.length} plants{areaSqft?` · ${areaSqft.toLocaleString()} sq ft`:""}</div>
        <p style={{margin:"4px 0 0"}}>Scope, schedule and budget to establish this food forest over {M.N} years from {M.calYear(1)}. All figures are editable planning estimates — set your prices and rates under <b>Assumptions</b>. {!areaSqft&&<span style={{color:"var(--orange)"}}>Tip: draw your area in the Planting Plan → Map step so area-based costs (mulch, site prep) fill in.</span>}</p></div>

      <div className="pjtabs">
        {[["summary","Summary"],["scope","Scope"],["schedule","Schedule"],["budget","Budget"],["assume","Assumptions"]].map(([k,l])=>(
          <button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>

      {tab==="summary" && (
        <div>
          <div className="pjcards">
            <div className="pjc"><div className="l">Cash to establish</div><div className="v">{$(totalCash)}</div><div className="s">over {M.N} yrs</div></div>
            <div className="pjc"><div className="l">Year 1 cash</div><div className="v">{$(y1Cash)}</div><div className="s">biggest outlay</div></div>
            <div className="pjc"><div className="l">Your labor</div><div className="v">{Math.round(M.totalHours).toLocaleString()} h</div><div className="s">{$(totalTime)} at your rate</div></div>
            <div className="pjc"><div className="l">Fully-loaded</div><div className="v">{$(totalCash+totalTime)}</div><div className="s">cash + your time</div></div>
            <div className="pjc"><div className="l">First harvest</div><div className="v">{firstBearing?("Yr "+firstBearing):"—"}</div><div className="s">{firstBearing?M.calYear(firstBearing):"no edibles"}</div></div>
            {anyRev && <div className="pjc"><div className="l">{st.revenueOn?"Revenue":"Imputed value"}</div><div className="v">{$(totalRev)}</div><div className="s">over {M.N} yrs</div></div>}
          </div>
          <div className="hvnote" style={{marginTop:14}}>
            <b>The plan at a glance.</b> Establishing <b>{chosen.length}</b> species{M.phased?` across ${Math.max(...chosen.map(p=>Math.max(1,Math.min(M.N,phases[p.id]||1))))} planting phases`:" in year one"} costs about <b>{$(totalCash)}</b> in cash over {M.N} years, front-loaded at <b>{$(y1Cash)}</b> in {M.calYear(1)}. Expect roughly <b>{Math.round(M.totalHours)} hours</b> of work{st.labor.hiredPct?` (${st.labor.hiredPct}% contracted out)`:""}. {firstBearing?<span>First meaningful harvest around <b>{M.calYear(firstBearing)}</b>.</span>:null} {anyRev?<span> Estimated {st.revenueOn?"sales":"grocery savings"} of <b>{$(totalRev)}</b> across the horizon.</span>:<span> Turn on a yield estimate under Assumptions to project {"savings or income"}.</span>}
          </div>
          <div className="pjmini">
            <b>Scope highlights</b>
            <ul>{Array.from(new Set(M.scope.map(t=>t.cat))).map(c=>{ const h=M.scope.filter(t=>t.cat===c).reduce((a,t)=>a+t.hours,0);
              return <li key={c}>{c}: {Math.round(h)} h</li>; })}</ul>
          </div>
        </div>
      )}

      {tab==="scope" && (
        <div className="mtsched">
          <p className="pphint" style={{margin:"0 0 12px"}}>Work packages generated from your plan — planting waves, site setup, upkeep and harvest — with estimated hours. These drive the Schedule and the Labor line in the Budget. Click a planting wave to see the plants in it.</p>
          {Array.from({length:M.N},(_,i)=>i+1).map(y=>{ const rows=M.scope.filter(t=>t.y===y); if(!rows.length) return null;
            const hrs=rows.reduce((a,t)=>a+t.hours,0);
            return (
              <div className="mtplant" key={y}>
                <div className="mthead"><b>Year {y}</b> <span className="mtmeta">{M.calYear(y)} · {Math.round(hrs)} h · ≈ {$(hrs*blended)} labor</span></div>
                {rows.sort((a,b)=>a.q-b.q).map((t,i)=>{
                  // a "Plant …" package belongs to a phase; make that row open its plant list
                  const ph=t.cat==="Plant" ? y : null;
                  const openable=ph!=null && (phaseRows.find(r=>r.ph===ph)||{rows:[]}).rows.length>0;
                  const isOpen=openPhase===ph;
                  return (
                    <React.Fragment key={i}>
                      <div className={"mttask"+(openable?" openable":"")+(isOpen?" open":"")}
                           onClick={openable?()=>setOpenPhase(isOpen?null:ph):undefined}>
                        <span className="yr">{QLABEL[t.q-1]}</span>
                        <span className="mtcat" style={{background:MAINT_CATS[t.cat]||"#8a8577"}}>{t.cat}</span>
                        <div className="body">{t.name} <span className="when">· {t.hours} h</span>
                          {openable && <span className="phtoggle">{isOpen?"▲ hide plants":"▼ show plants"}</span>}
                        </div>
                      </div>
                      {openable && isOpen && <PhaseTable data={phaseRows.find(r=>r.ph===ph)} openDetail={openDetail} money={$} />}
                    </React.Fragment>

          })}

      {tab==="schedule" && (
        <div>
          <div className="hvctrls">

            <select className="pjnum" style={{width:"auto"}} value={selYear} onChange={e=>setSelYear(Number(e.target.value))}>
              {Array.from({length:M.N},(_,i)=>i+1).map(y=><option key={y} value={y}>Year {y} · {M.calYear(y)}</option>)}
            </select>
          </div>
          <div className="pjcal">
            {["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((mo,mi)=>{ const items=M.scope.filter(t=>t.y===selYear&&t.mo===mi+1);
              return (
                <div className="pjmo" key={mo}>
                  <div className="mh">{mo}</div>
                  {items.map((t,i)=><div key={i} className="pjev" style={{borderLeftColor:MAINT_CATS[t.cat]||"#8a8577"}}>{t.name}<span>{t.hours} h</span></div>)}
                </div>
              );
            })}
          </div>
          <div className="pjgrid" style={{marginTop:16}}>
            <div className="pgh"><div>Year</div>{QLABEL.map(q=><div key={q}>{q}</div>)}<div>Hours</div><div>Labor</div></div>
            {Array.from({length:M.N},(_,i)=>i+1).map(y=>{ const qs=M.hrsYQ[y]||[0,0,0,0], h=qs.reduce((a,b)=>a+b,0);

            {period==="quarter" && <select className="pjnum" style={{width:"auto"}} value={selYear} onChange={e=>setSelYear(Number(e.target.value))}>
              {Array.from({length:M.N},(_,i)=>i+1).map(y=><option key={y} value={y}>{M.calYear(y)}</option>)}</select>}
            <span style={{flex:"1 1 auto"}}></span>
